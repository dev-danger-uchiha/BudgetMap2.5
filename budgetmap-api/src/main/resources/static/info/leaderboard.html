<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
    <meta charset="UTF-8">
    <title>Leaderboard - Top Exploradores | BudgetMap</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50">
    <div th:replace="~{fragments/navbar :: miNavbar}"></div>

    <main class="max-w-4xl mx-auto py-20 px-6">
        <div class="text-center mb-16">
            <h1 class="text-4xl font-black text-gray-900">Top Exploradores</h1>
            <p class="mt-4 text-gray-600">Los usuarios más activos de la comunidad que han ahorrado y ganado más tokens.</p>
        </div>

        <div class="bg-white rounded-3xl shadow-xl overflow-hidden border border-gray-100">
            <table class="w-full text-left border-collapse">
                <thead>
                    <tr class="bg-gray-50 border-b border-gray-100">
                        <th class="px-8 py-5 text-sm font-bold text-gray-400 uppercase">Posición</th>
                        <th class="px-8 py-5 text-sm font-bold text-gray-400 uppercase">Explorador</th>
                        <th class="px-8 py-5 text-sm font-bold text-gray-400 uppercase text-right">Tokens Acumulados</th>
                    </tr>
                </thead>
                <tbody id="leaderboard-body" class="divide-y divide-gray-100">
                    <!-- Contenido dinámico generado por JavaScript -->
                </tbody>
            </table>
        </div>

        <div class="mt-10 text-center">
            <p class="text-gray-500 text-sm italic">El ranking se actualiza cada 24 horas basado en reservas confirmadas.</p>
        </div>
    </main>

    <div th:replace="~{fragments/footer :: miFooter}"></div>

    <script>
        document.addEventListener("DOMContentLoaded", () => {
            cargarLeaderboard();
        });

        async function cargarLeaderboard() {
            const tbody = document.getElementById('leaderboard-body');
            tbody.innerHTML = `
                <tr>
                    <td colspan="3" class="text-center p-10 text-gray-500 font-bold animate-pulse">
                        Cargando el Top 5 de Exploradores...
                    </td>
                </tr>
            `;

            try {
                const token = localStorage.getItem('jwt_token');
                const headers = { 'Content-Type': 'application/json' };
                if (token) {
                    headers['Authorization'] = `Bearer ${token}`;
                }

                const response = await fetch('/api/usuarios/leaderboard?top=5', { headers });

                if (!response.ok) {
                    throw new Error('No se pudo cargar el leaderboard. Estado: ' + response.status);
                }

                const usuarios = await response.json();

                if (usuarios.length === 0) {
                    tbody.innerHTML = `
                        <tr>
                            <td colspan="3" class="text-center p-10 text-gray-500 font-medium">
                                Aún no hay suficientes datos para generar un ranking. ¡Sé el primero!
                            </td>
                        </tr>
                    `;
                    return;
                }

                tbody.innerHTML = ''; // Limpiar el "Cargando..."

                usuarios.forEach((usuario, index) => {
                    const posicion = index + 1;
                    
                    let posicionClase = 'text-gray-400';
                    if (posicion === 1) posicionClase = 'text-amber-500'; // Oro
                    if (posicion === 2) posicionClase = 'text-slate-500'; // Plata
                    if (posicion === 3) posicionClase = 'text-amber-700'; // Bronce

                    const nombre = usuario.nombre || '';
                    const apellido = usuario.apellido || '';
                    const iniciales = (nombre.charAt(0) + apellido.charAt(0)).toUpperCase();

                    tbody.innerHTML += `
                        <tr class="hover:bg-emerald-50/30 transition">
                            <td class="px-8 py-6 font-black text-2xl ${posicionClase}">${posicion}</td>
                            <td class="px-8 py-6">
                                <div class="flex items-center gap-4">
                                    <div class="w-10 h-10 bg-gray-200 rounded-full flex items-center justify-center font-bold text-gray-500">${iniciales || '??'}</div>
                                    <span class="font-bold text-gray-800">${nombre} ${apellido.charAt(0)}.</span>
                                </div>
                            </td>
                            <td class="px-8 py-6 text-right font-black text-emerald-600 text-lg">${new Intl.NumberFormat('es-CO').format(usuario.puntosAcumulados || 0)}</td>
                        </tr>
                    `;
                });
            } catch (error) {
                console.error("Error al cargar el leaderboard:", error);
                tbody.innerHTML = `<tr><td colspan="3" class="text-center p-10 text-red-500 font-bold">Ocurrió un error al conectar con el servidor.</td></tr>`;
            }
        }
    </script>
</body>
</html>
