<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
    <meta charset="UTF-8">
    <title>Radicar PQRS | BudgetMap</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50">
    <div th:replace="~{fragments/navbar :: miNavbar}"></div>

    <main class="max-w-3xl mx-auto py-20 px-6">
        <div class="bg-white rounded-3xl shadow-xl overflow-hidden border border-gray-100">
            <div class="bg-emerald-600 p-8 text-white text-center">
                <h1 class="text-3xl font-bold">Radicar PQRS</h1>
                <p class="text-emerald-100 mt-2">Peticiones, Quejas, Reclamos o Sugerencias</p>
            </div>
            
            <form action="#" th:action="@{/pqrs/enviar}" method="post" class="p-8 space-y-6">
                <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                    <div>
                        <label class="block text-sm font-bold text-gray-700 mb-2">Nombre Completo</label>
                        <input type="text" name="nombre" class="w-full px-4 py-3 rounded-xl border border-gray-200 focus:ring-2 focus:ring-emerald-500 outline-none transition" required>
                    </div>
                    <div>
                        <label class="block text-sm font-bold text-gray-700 mb-2">Correo Electrónico</label>
                        <input type="email" name="email" class="w-full px-4 py-3 rounded-xl border border-gray-200 focus:ring-2 focus:ring-emerald-500 outline-none transition" required>
                    </div>
                </div>

                <div>
                    <label class="block text-sm font-bold text-gray-700 mb-2">Tipo de Solicitud</label>
                    <select name="tipo" class="w-full px-4 py-3 rounded-xl border border-gray-200 focus:ring-2 focus:ring-emerald-500 outline-none transition">
                        <option value="peticion">Petición</option>
                        <option value="queja">Queja</option>
                        <option value="reclamo">Reclamo</option>
                        <option value="sugerencia">Sugerencia</option>
                    </select>
                </div>

                <div>
                    <label class="block text-sm font-bold text-gray-700 mb-2">Descripción del caso</label>
                    <textarea name="mensaje" rows="4" class="w-full px-4 py-3 rounded-xl border border-gray-200 focus:ring-2 focus:ring-emerald-500 outline-none transition" placeholder="Cuéntanos qué sucedió..."></textarea>
                </div>

                <button type="submit" class="w-full bg-emerald-600 text-white font-bold py-4 rounded-xl shadow-lg hover:bg-emerald-700 transition transform hover:-translate-y-1">
                    Enviar Solicitud
                </button>
            </form>
        </div>
    </main>

    <div th:replace="~{fragments/footer :: miFooter}"></div>
</body>
</html>
