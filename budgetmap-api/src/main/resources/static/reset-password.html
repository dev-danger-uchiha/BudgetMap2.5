<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Crear Nueva Contraseña - BudgetMap</title>
  
  <!-- Preconnect para recursos críticos -->
  <link rel="preconnect" href="https://cdn.tailwindcss.com">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;900&display=swap" rel="stylesheet">
  <link rel="manifest" href="/manifest.json">
  <meta name="theme-color" content="#f97316">
  <link rel="apple-touch-icon" href="/images/pwa-icon.png">

  <style>
    body {
      font-family: 'Inter', sans-serif;
    }
    .glass-panel {
      background: rgba(20, 20, 20, 0.45);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.1);
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
    }
    /* Input autofill fix for dark glass */
    input:-webkit-autofill,
    input:-webkit-autofill:hover, 
    input:-webkit-autofill:focus, 
    input:-webkit-autofill:active{
        -webkit-box-shadow: 0 0 0 30px rgba(0,0,0,0.5) inset !important;
        -webkit-text-fill-color: white !important;
        transition: background-color 5000s ease-in-out 0s;
    }
  </style>
</head>
<body class="relative min-h-screen flex items-center justify-center overflow-hidden bg-black text-white">

  <!-- Video Background -->
  <video autoplay loop muted playsinline class="absolute inset-0 w-full h-full object-cover z-0 opacity-80 mix-blend-screen pointer-events-none">
    <source src="/images/video%20luz.mp4" type="video/mp4">
  </video>

  <!-- Overlay para oscurecer el video y mejorar legibilidad -->
  <div class="absolute inset-0 bg-gradient-to-b from-black/60 via-black/40 to-black/80 z-10"></div>

  <!-- Contenedor Principal -->
  <div class="relative z-20 w-full max-w-md px-6 py-10 animate-fade-in-up">
    
    <!-- Logo y Título -->
    <div class="text-center mb-10">
      <a href="/" class="inline-block relative group">
        <div class="absolute inset-0 bg-orange-500 rounded-full blur-2xl opacity-20 group-hover:opacity-40 transition duration-500"></div>
        <img src="/images/logo.png" alt="Logo BudgetMap" class="relative w-28 h-28 mx-auto object-contain drop-shadow-[0_0_15px_rgba(249,115,22,0.5)] transform transition duration-500 hover:scale-110 hover:-translate-y-2">
      </a>
      <h2 class="text-4xl font-black text-white tracking-tight mt-6 drop-shadow-md">Nueva Contraseña</h2>
      <p class="text-gray-300 mt-3 text-sm font-light tracking-wide px-4">Crea una clave segura para proteger tu cuenta.</p>
    </div>

    <!-- Alertas -->
    <div id="alertContainer" class="hidden mb-6 p-4 rounded-2xl text-sm font-medium text-center transition-all duration-300 shadow-lg border backdrop-blur-md">
      <span id="alertText"></span>
    </div>

    <!-- Panel Glassmorphism (Formulario) -->
    <main id="mainContent" class="glass-panel p-8 sm:p-10 rounded-[2rem] transform transition-all duration-500 hover:shadow-orange-500/10 hidden">
      <form id="resetForm" class="space-y-6">
        
        <!-- Input Group -->
        <div class="space-y-2 relative group">
          <label for="password" class="block text-xs font-semibold text-gray-300 uppercase tracking-widest ml-1 group-focus-within:text-orange-400 transition-colors">Nueva Contraseña</label>
          <div class="relative">
            <div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none">
              <svg class="h-5 w-5 text-gray-400 group-focus-within:text-orange-400 transition-colors" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z" />
              </svg>
            </div>
            <input type="password" id="password" required autofocus minlength="8"
                   class="w-full pl-11 pr-4 py-3.5 bg-black/20 border border-white/10 rounded-2xl focus:ring-2 focus:ring-orange-500/50 focus:border-orange-500 text-white placeholder-gray-500 outline-none transition-all duration-300 hover:bg-black/30" 
                   placeholder="••••••••" />
          </div>
          <p class="text-xs text-gray-400 mt-2 ml-1">Debe incluir minúscula, mayúscula, número y un símbolo.</p>
        </div>

        <!-- Botón Submit -->
        <button type="submit" 
                class="relative w-full py-4 px-4 rounded-2xl text-sm font-bold text-white overflow-hidden group">
          <!-- Fondo gradiente animado -->
          <div class="absolute inset-0 bg-gradient-to-r from-orange-600 via-amber-500 to-orange-600 bg-[length:200%_auto] animate-[gradient_2s_linear_infinite] group-hover:scale-105 transition-transform duration-500"></div>
          <!-- Contenido del botón -->
          <span class="relative flex items-center justify-center gap-2 drop-shadow-md">
            <span>Actualizar Contraseña</span>
            <svg class="w-5 h-5 group-hover:translate-x-1 transition-transform" fill="none" viewBox="0 0 24 24" stroke="currentColor">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7" />
            </svg>
          </span>
        </button>
      </form>
    </main>

    <!-- Error View -->
    <div id="errorView" class="hidden text-center glass-panel p-8 sm:p-10 rounded-[2rem] transform transition-all duration-500">
        <div class="mx-auto flex items-center justify-center h-12 w-12 rounded-full bg-red-500/20 border border-red-500/50 mb-4">
          <svg class="h-6 w-6 text-red-400" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" />
          </svg>
        </div>
        <h3 class="text-xl font-bold text-red-400 mb-2">Enlace Inválido</h3>
        <p class="text-gray-300 text-sm mb-6">El enlace de recuperación ha expirado o es incorrecto.</p>
        <a href="/recuperar-password.html" class="inline-block py-3 px-6 rounded-xl bg-orange-500/20 border border-orange-500/50 text-orange-400 font-bold hover:bg-orange-500 hover:text-white transition-all duration-300">Solicitar nuevo enlace</a>
    </div>

  </div>

  <script>
    // Configuración Tailwind Custom Animations
    tailwind.config = {
      theme: {
        extend: {
          animation: {
            'fade-in-up': 'fadeInUp 0.8s cubic-bezier(0.16, 1, 0.3, 1)',
            'gradient': 'gradient 3s linear infinite',
          },
          keyframes: {
            fadeInUp: {
              '0%': { opacity: '0', transform: 'translateY(20px)' },
              '100%': { opacity: '1', transform: 'translateY(0)' },
            },
            gradient: {
              '0%': { backgroundPosition: '0% 50%' },
              '50%': { backgroundPosition: '100% 50%' },
              '100%': { backgroundPosition: '0% 50%' },
            }
          }
        }
      }
    }

    let urlToken = null;

    document.addEventListener("DOMContentLoaded", () => {
      const urlParams = new URLSearchParams(window.location.search);
      urlToken = urlParams.get('token');

      if (!urlToken) {
        document.getElementById('errorView').classList.remove('hidden');
      } else {
        document.getElementById('mainContent').classList.remove('hidden');
      }
    });

    document.getElementById('resetForm').addEventListener('submit', async function (e) {
      e.preventDefault();
      const password = document.getElementById('password').value;
      const submitBtn = document.querySelector('button[type="submit"]');
      const btnText = submitBtn.querySelector('span span');
      const originalText = btnText.innerText;
      
      submitBtn.disabled = true;
      btnText.innerText = 'Actualizando...';
      submitBtn.classList.add('opacity-70', 'cursor-wait');

      try {
        const response = await fetch('https://budgetmap-api.onrender.com/api/auth/reset-password', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ token: urlToken, password: password })
        });

        if (response.ok) {
            mostrarAlerta("¡Contraseña actualizada con éxito! Redirigiendo...", "success");
            setTimeout(() => { window.location.href = '/login.html'; }, 2000);
        } else {
            const data = await response.json();
            mostrarAlerta(data.message || "La contraseña debe ser más segura.", "error");
            submitBtn.disabled = false;
            btnText.innerText = originalText;
            submitBtn.classList.remove('opacity-70', 'cursor-wait');
        }
      } catch (error) {
        mostrarAlerta("Error de conexión. Intenta de nuevo.", "error");
        submitBtn.disabled = false;
        btnText.innerText = originalText;
        submitBtn.classList.remove('opacity-70', 'cursor-wait');
      }
    });

    function mostrarAlerta(mensaje, tipo) {
      const alertContainer = document.getElementById('alertContainer');
      const alertText = document.getElementById('alertText');
      alertText.textContent = mensaje;
      
      // Reiniciar clases
      alertContainer.className = 'mb-6 p-4 rounded-2xl text-sm font-medium text-center transition-all duration-500 shadow-lg border backdrop-blur-md animate-fade-in-up';
      
      if (tipo === "error") {
        alertContainer.classList.add('bg-red-500/20', 'text-red-200', 'border-red-500/40');
      } else {
        alertContainer.classList.add('bg-emerald-500/20', 'text-emerald-200', 'border-emerald-500/40');
      }
    }
  </script>
</body>
</html>
