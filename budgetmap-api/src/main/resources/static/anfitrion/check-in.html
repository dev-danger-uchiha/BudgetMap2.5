<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Acceso Eventos | BudgetMap</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    const token = localStorage.getItem('jwt_token');
    if (!token || localStorage.getItem('user_rol') !== 'ANFITRION') window.location.href = '/login.html';
  </script>
</head>
<body class="bg-slate-900 min-h-screen text-white font-sans flex flex-col items-center justify-center p-6 relative overflow-hidden">

  <div class="absolute inset-0 opacity-10 pointer-events-none" style="background-image: radial-gradient(#3b82f6 1px, transparent 1px); background-size: 20px 20px;"></div>

  <button onclick="location.href='/anfitrion/dashboard.html'" class="absolute top-6 left-6 text-blue-400 text-xs font-bold uppercase tracking-widest hover:text-white transition z-10 flex items-center gap-2">
    <span>◀</span> Volver al Panel
  </button>

  <div class="w-full max-w-sm bg-slate-800 p-8 rounded-3xl border border-blue-900/50 shadow-2xl shadow-blue-900/20 text-center z-10">
    <div class="w-16 h-16 bg-blue-900/50 rounded-full flex items-center justify-center mx-auto mb-6 border border-blue-500/30">
        <svg class="w-8 h-8 text-blue-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 5v2m0 4v2m0 4v2M5 5a2 2 0 00-2 2v3a2 2 0 110 4v3a2 2 0 002 2h14a2 2 0 002-2v-3a2 2 0 110-4V7a2 2 0 00-2-2H5z"></path></svg>
    </div>

    <h2 class="text-xl font-black uppercase tracking-widest mb-2 text-slate-100">Escáner de Entradas</h2>
    <p class="text-xs text-slate-400 mb-8">Digita el código del ticket del asistente.</p>

    <div class="bg-slate-900/50 rounded-2xl p-4 mb-6 border border-slate-700">
        <input type="text" id="codigo-input" readonly placeholder="TICKET-000" class="bg-transparent text-3xl font-black text-center w-full outline-none text-blue-400 placeholder-slate-700 tracking-widest mb-4">
        <div class="grid grid-cols-3 gap-3">
            <button onclick="addNum('1')" class="h-14 bg-slate-700 rounded-xl text-xl font-bold hover:bg-blue-600 transition">1</button>
            <button onclick="addNum('2')" class="h-14 bg-slate-700 rounded-xl text-xl font-bold hover:bg-blue-600 transition">2</button>
            <button onclick="addNum('3')" class="h-14 bg-slate-700 rounded-xl text-xl font-bold hover:bg-blue-600 transition">3</button>
            <button onclick="addNum('4')" class="h-14 bg-slate-700 rounded-xl text-xl font-bold hover:bg-blue-600 transition">4</button>
            <button onclick="addNum('5')" class="h-14 bg-slate-700 rounded-xl text-xl font-bold hover:bg-blue-600 transition">5</button>
            <button onclick="addNum('6')" class="h-14 bg-slate-700 rounded-xl text-xl font-bold hover:bg-blue-600 transition">6</button>
            <button onclick="addNum('7')" class="h-14 bg-slate-700 rounded-xl text-xl font-bold hover:bg-blue-600 transition">7</button>
            <button onclick="addNum('8')" class="h-14 bg-slate-700 rounded-xl text-xl font-bold hover:bg-blue-600 transition">8</button>
            <button onclick="addNum('9')" class="h-14 bg-slate-700 rounded-xl text-xl font-bold hover:bg-blue-600 transition">9</button>
            <button onclick="clearInput()" class="h-14 bg-slate-800 text-red-400 rounded-xl text-lg font-bold border border-red-900/50">C</button>
            <button onclick="addNum('0')" class="h-14 bg-slate-700 rounded-xl text-xl font-bold hover:bg-blue-600 transition">0</button>
            <button onclick="procesarAcceso()" class="h-14 bg-blue-600 rounded-xl text-xl font-bold shadow-lg shadow-blue-600/30">✔</button>
        </div>
    </div>
  </div>

  <div id="modal-resultado" class="fixed inset-0 bg-slate-900/95 hidden flex flex-col items-center justify-center z-50 p-6 backdrop-blur-sm">
    <div class="bg-slate-800 p-8 rounded-3xl border border-slate-700 text-center max-w-sm w-full">
        <div id="modal-icon" class="text-6xl mb-4">🎟️</div>
        <h3 id="modal-title" class="text-2xl font-black uppercase mb-2 text-white">Acceso Válido</h3>
        <p id="modal-msg" class="text-sm text-slate-400 mb-8 font-medium">Entrada VIP para 1 persona.</p>
        <button onclick="cerrarModal()" class="w-full bg-slate-700 text-white font-bold py-4 rounded-xl uppercase text-xs hover:bg-slate-600 tracking-widest">Siguiente Asistente</button>
    </div>
  </div>

  <script>
    let currentInput = "";
    const inputDisplay = document.getElementById('codigo-input');

    function addNum(num) {
      if (currentInput.length < 10) {
        currentInput += num;
        inputDisplay.value = currentInput;
      }
    }

    function clearInput() { currentInput = ""; inputDisplay.value = ""; }

    async function procesarAcceso() {
      if (!currentInput) return;
      
      try {
        // En tu backend, este endpoint debe confirmar el uso del ticket/reserva para el evento
        const res = await fetch(`http://localhost:8080/api/reservas/${currentInput}/confirmar`, {
          method: 'PUT',
          headers: { 'Authorization': `Bearer ${token}`, 'Content-Type': 'application/json' }
        });

        if (res.ok) {
          const data = await res.json();
          mostrarModal("✅", "ACCESO PERMITIDO", `Titular: ${data.usuarioNombre || 'Invitado'}<br>Boletas: ${data.cantidadPersonas || 1} pax`);
        } else {
          mostrarModal("❌", "TICKET INVÁLIDO", "Este código no existe o ya fue escaneado en puerta.");
        }
      } catch (e) { mostrarModal("⚠️", "ERROR DE RED", "No se pudo conectar con el validador."); }
      clearInput();
    }

    function mostrarModal(icon, title, msg) {
        document.getElementById('modal-icon').innerHTML = icon;
        document.getElementById('modal-title').textContent = title;
        document.getElementById('modal-msg').innerHTML = msg;
        document.getElementById('modal-resultado').classList.remove('hidden');
    }

    function cerrarModal() { document.getElementById('modal-resultado').classList.add('hidden'); }
  </script>
</body>
</html>
