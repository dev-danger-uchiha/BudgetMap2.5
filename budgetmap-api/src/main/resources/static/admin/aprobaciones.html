<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin - Aprobaciones | BudgetMap</title>
    <script src="https://cdn.tailwindcss.com">
        function cerrarSesion() {
            localStorage.clear();
            sessionStorage.clear();
            window.location.href = '/login.html';
        }
    </script>
    <script>
        const token = localStorage.getItem('jwt_token');
        const rol = localStorage.getItem('user_rol');
        // Seguridad: Acceso solo para ADMINISTRADOR o MODERADOR
        if (!token || !rol || (!rol.includes('ADMINISTRADOR') && !rol.includes('MODERADOR'))) {
            window.location.href = '/login.html?denied=true';
        }

        function cerrarSesion() {
            localStorage.clear();
            sessionStorage.clear();
            window.location.href = '/login.html';
        }
    </script>
</head>

<body class="bg-slate-50 min-h-screen text-slate-800 font-sans flex flex-col pb-20">

    <nav class="bg-white border-b border-emerald-100 p-4 sticky top-0 z-50 shadow-sm">
        <div class="w-full px-6 md:px-10 flex justify-between items-center">
            <div class="flex items-center gap-4">
                <div
                    class="relative bg-white rounded-full w-12 h-12 md:w-16 md:h-16 shadow-md ring-1 ring-black/5 flex items-center justify-center z-0 hidden sm:flex">
                    <img src="/images/logo.png" alt="Logo BudgetMap"
                        class="absolute w-16 h-16 md:w-24 md:h-24 max-w-none object-contain transform transition duration-500 hover:scale-110 top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 z-40 drop-shadow-xl" />
                </div><span class="text-xl font-black tracking-widest drop-shadow-md mx-2"><a href="/index.html" class="hover:text-emerald-600 transition">BUDGETMAP</a></span>
                <span
                    class="bg-emerald-600 text-white px-3 py-1 rounded-full font-black text-[10px] uppercase tracking-tighter">ADMIN</span>
                <h1 class="font-black tracking-widest text-emerald-900">CONTROL CENTER</h1>
            </div>
            <div class="flex gap-6 text-xs font-bold uppercase tracking-widest hidden md:flex">
                <a href="/admin/usuarios.html" class="text-slate-400 hover:text-emerald-600 transition">Usuarios</a>
                <a href="/admin/aprobaciones.html"
                    class="text-emerald-600 border-b-2 border-emerald-600 pb-1">Aprobaciones</a>
                <a href="/admin/pqrs.html" class="text-slate-400 hover:text-emerald-600 transition">Soporte</a>
                <a href="/admin/estadisticas.html" class="text-slate-400 hover:text-emerald-600 transition">Estadísticas</a>
                <a href="/admin/base-datos.html" class="text-slate-400 hover:text-emerald-600 transition">Base de Datos</a>
            </div>
            <button onclick="cerrarSesion()"
                class="text-[12px] text-slate-400 font-bold hover:text-red-500 transition">SALIR</button>
        </div>
    </nav>

    <main class="w-full px-6 md:px-10 mt-8 px-6 w-full">

        <header class="mb-8 flex justify-between items-end">
            <div>
                <h2 class="text-3xl font-black text-slate-900 italic tracking-tighter uppercase">Bandeja de Entrada</h2>
                <p class="text-emerald-600 font-bold text-xs uppercase tracking-widest mt-1">Lugares, Locales y Eventos
                    pendientes de revisión</p>
            </div>
            <span id="info-paginacion"
                class="text-xs font-bold text-slate-400 uppercase tracking-widest">Calculando...</span>
        </header>

        <div class="bg-white border border-emerald-100 rounded-3xl p-6 shadow-sm mb-6">
            <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
                <div class="flex flex-col gap-1">
                    <label class="text-[10px] font-bold text-slate-400 uppercase tracking-widest">Búsqueda
                        (Nombre)</label>
                    <input type="text" id="filtro-nombre" placeholder="Ej: Local ABC..."
                        class="bg-emerald-50/50 border border-emerald-100 rounded-xl px-4 py-2.5 text-sm focus:border-emerald-500 focus:bg-white outline-none transition-all"
                        onchange="cargarSolicitudesUnificadas()">
                </div>
                <div class="flex flex-col gap-1">
                    <label class="text-[10px] font-bold text-slate-400 uppercase tracking-widest">Tipo</label>
                    <select id="filtro-tipo"
                        class="bg-emerald-50/50 border border-emerald-100 rounded-xl px-4 py-2.5 text-sm focus:border-emerald-500 outline-none"
                        onchange="cargarSolicitudesUnificadas()">
                        <option value="">Todos</option>
                        <option value="ESTABLECIMIENTO">Establecimiento</option>
                        <option value="LUGAR">Lugar</option>
                        <option value="EVENTO">Evento</option>
                    </select>
                </div>
                <div class="flex items-end gap-2">
                    <button onclick="limpiarFiltros()"
                        class="w-1/3 bg-slate-200 text-slate-700 px-4 py-2.5 rounded-xl text-xs font-black uppercase hover:bg-slate-300 transition-all"
                        title="Limpiar Filtros">
                        Limpiar
                    </button>
                    <button onclick="cargarSolicitudesUnificadas()"
                        class="w-2/3 bg-emerald-600 text-white px-6 py-2.5 rounded-xl text-xs font-black uppercase hover:bg-emerald-700 shadow-md transition-all">
                        Filtrar
                    </button>
                </div>
            </div>
        </div>

        <div id="grid-aprobaciones" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
        </div>

        <div class="mt-8 flex justify-center gap-4">
            <button id="btn-prev" onclick="cambiarPagina(-1)"
                class="px-6 py-3 bg-white border border-slate-200 rounded-xl text-xs font-black uppercase tracking-widest hover:bg-slate-50 disabled:opacity-50 transition shadow-sm">Anterior</button>
            <button id="btn-next" onclick="cambiarPagina(1)"
                class="px-6 py-3 bg-emerald-600 text-white rounded-xl text-xs font-black uppercase tracking-widest hover:bg-emerald-700 disabled:opacity-50 transition shadow-sm">Siguiente</button>
        </div>
    </main>

    <script>
        let todasLasSolicitudes = [];
        let paginaActual = 0;
        const size = 9;
        let paginasTotales = 0;

        document.addEventListener("DOMContentLoaded", cargarSolicitudesUnificadas);

        async function cargarSolicitudesUnificadas() {
            const contenedor = document.getElementById('grid-aprobaciones');
            contenedor.innerHTML = '<p class="col-span-full text-center text-emerald-600 font-bold p-8 animate-pulse uppercase">Cargando...</p>';
            paginaActual = 0;

            try {
                const [resEst, resLug, resEvt] = await Promise.all([
                    fetch('http://localhost:8080/api/establecimientos/pendientes', { headers: { 'Authorization': `Bearer ${token}` } }),
                    fetch('http://localhost:8080/api/lugares/pendientes', { headers: { 'Authorization': `Bearer ${token}` } }),
                    fetch('http://localhost:8080/api/eventos/pendientes', { headers: { 'Authorization': `Bearer ${token}` } })
                ]);

                let estData = resEst.ok ? await resEst.json() : [];
                let lugData = resLug.ok ? await resLug.json() : [];
                let evtData = resEvt.ok ? await resEvt.json() : [];

                estData = estData.map(e => ({ ...e, tipoSolicitud: 'ESTABLECIMIENTO' }));
                lugData = lugData.map(l => ({ ...l, tipoSolicitud: 'LUGAR' }));
                evtData = evtData.map(e => ({ ...e, tipoSolicitud: 'EVENTO' }));

                todasLasSolicitudes = [...estData, ...lugData, ...evtData];

                const filtroNombre = document.getElementById('filtro-nombre').value.toLowerCase();
                const filtroTipo = document.getElementById('filtro-tipo').value;

                if (filtroNombre) {
                    todasLasSolicitudes = todasLasSolicitudes.filter(s =>
                        s.nombre.toLowerCase().includes(filtroNombre)
                    );
                }

                if (filtroTipo) {
                    todasLasSolicitudes = todasLasSolicitudes.filter(s =>
                        s.tipoSolicitud === filtroTipo
                    );
                }

                paginasTotales = Math.ceil(todasLasSolicitudes.length / size) || 1;
                renderPagina();
            } catch (e) {
                contenedor.innerHTML = '<p class="col-span-full text-center text-red-500 font-bold p-8">Error de conexión al servidor.</p>';
            }
        }

        function renderPagina() {
            const contenedor = document.getElementById('grid-aprobaciones');
            const inicio = paginaActual * size;
            const paginaData = todasLasSolicitudes.slice(inicio, inicio + size);

            contenedor.innerHTML = paginaData.length ? '' : '<p class="col-span-full text-center text-slate-400 p-10">No hay solicitudes.</p>';

            paginaData.forEach(item => {
                const esEst = item.tipoSolicitud === 'ESTABLECIMIENTO';
                const esEvt = item.tipoSolicitud === 'EVENTO';
                const badgeClass = esEst ? 'bg-amber-100 text-amber-700' : (esEvt ? 'bg-blue-100 text-blue-700' : 'bg-purple-100 text-purple-700');
                const locText = esEvt ? (item.lugarNombre || item.establecimientoNombre || 'Evento online/Sin ub.') : (item.direccion || 'Sin dirección');
                contenedor.innerHTML += `
                <div class="bg-white p-6 rounded-3xl shadow-sm border border-slate-100 flex flex-col justify-between hover:shadow-md transition">
                    <div>
                        <span class="${badgeClass} text-[9px] font-black px-2 py-1 rounded uppercase">${item.tipoSolicitud}</span>
                        <h4 class="font-black text-slate-800 mt-3">${item.nombre}</h4>
                        <p class="text-[10px] text-slate-400 mt-2">📍 ${locText}</p>
                    </div>
                    <div class="mt-6 flex gap-2">
                        <button onclick="procesar('${item.tipoSolicitud}', ${item.id}, 'aprobar')" class="flex-1 bg-emerald-600 text-white font-black py-3 rounded-xl text-[10px] uppercase hover:bg-emerald-700">Aprobar</button>
                        <button onclick="procesar('${item.tipoSolicitud}', ${item.id}, 'rechazar')" class="flex-1 bg-red-50 text-red-600 font-black py-3 rounded-xl text-[10px] uppercase hover:bg-red-100">Rechazar</button>
                    </div>
                </div>
            `;
            });
            actualizarControlesPaginacion();
        }

        function cambiarPagina(delta) {
            const nuevaPagina = paginaActual + delta;
            if (nuevaPagina >= 0 && nuevaPagina < paginasTotales) {
                paginaActual = nuevaPagina;
                renderPagina();
            }
        }

        function actualizarControlesPaginacion() {
            document.getElementById('info-paginacion').innerText = `Pág ${paginaActual + 1} de ${paginasTotales}`;
            document.getElementById('btn-prev').disabled = paginaActual === 0;
            document.getElementById('btn-next').disabled = paginaActual >= paginasTotales - 1;
        }

        function limpiarFiltros() {
            document.getElementById('filtro-nombre').value = '';
            document.getElementById('filtro-tipo').value = '';
            cargarSolicitudesUnificadas();
        }

        async function procesar(tipo, id, accion) {
            let path = 'lugares';
            if (tipo === 'ESTABLECIMIENTO') path = 'establecimientos';
            else if (tipo === 'EVENTO') path = 'eventos';

            const motivo = accion === 'rechazar' ? prompt("Motivo del rechazo:") : null;
            if (accion === 'rechazar' && !motivo) return;

            const body = accion === 'rechazar' ? JSON.stringify({ motivoRechazo: motivo }) : null;
            const headers = { 'Authorization': `Bearer ${token}` };
            if (body) headers['Content-Type'] = 'application/json';

            const res = await fetch(`http://localhost:8080/api/${path}/${id}/${accion}`, { method: 'POST', headers, body });
            if (res.ok) { alert("¡Hecho!"); cargarSolicitudesUnificadas(); }
        }

        function cerrarSesion() {
            localStorage.clear();
            sessionStorage.clear();
            window.location.href = '/login.html';
        }
    </script>
</body>

</html>
