<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Moderación - Aprobaciones</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-emerald-50 min-h-screen text-slate-800 font-sans">

  <nav class="bg-white border-b border-emerald-100 p-4 sticky top-0 z-50 shadow-sm">
    <div class="max-w-7xl mx-auto flex justify-between items-center">
      <div class="flex items-center gap-4">
        <span class="bg-emerald-600 text-white px-3 py-1 rounded-full font-black text-[10px] uppercase tracking-tighter">ADMIN</span>
        <h1 class="font-black tracking-widest text-emerald-900">CONTROL CENTER</h1>
      </div>
      <div class="flex gap-6 text-xs font-bold uppercase tracking-widest">
        <a href="/admin/aprobaciones.html" class="text-emerald-600 border-b-2 border-emerald-600 pb-1">Aprobaciones</a>
        <a href="/admin/pqrs.html" class="text-slate-500 hover:text-emerald-600 transition">Tickets PQRS</a>
        <a href="/admin/estadisticas.html" class="text-slate-500 hover:text-emerald-600 transition">Métricas</a>
      </div>
      <button onclick="localStorage.clear(); location.href='/login.html'" class="text-[10px] text-slate-400 font-bold hover:text-red-500 transition">SALIR</button>
    </div>
  </nav>

  <main class="max-w-6xl mx-auto mt-10 px-6">
    
    <div class="flex justify-between items-end mb-8">
        <div>
            <h2 class="text-3xl font-black text-slate-900 italic uppercase tracking-tighter">Bandeja de Entrada</h2>
            <p class="text-slate-500 text-sm">Revisa y valida las solicitudes de nuevos establecimientos y lugares.</p>
        </div>
        <div class="flex bg-white p-1 rounded-xl border border-emerald-100 shadow-sm">
            <button onclick="cambiarTab('ESTABLECIMIENTO')" id="tab-ESTABLECIMIENTO" class="px-6 py-2 text-xs font-bold rounded-lg bg-emerald-600 text-white shadow-md transition-all">Establecimientos</button>
            <button onclick="cambiarTab('LUGAR')" id="tab-LUGAR" class="px-6 py-2 text-xs font-bold rounded-lg text-slate-400 hover:text-emerald-600 transition">Lugares Públicos</button>
        </div>
    </div>

    <div id="contenedor-solicitudes" class="space-y-4">
        <div class="bg-white border border-emerald-100 rounded-2xl p-6 flex flex-col md:flex-row justify-between items-center gap-6 animate-pulse">
            <div class="w-full h-20 bg-emerald-50 rounded-xl"></div>
        </div>
    </div>

    <div id="mensaje-vacio" class="hidden text-center py-20 border-2 border-dashed border-emerald-200 rounded-3xl bg-white/50">
        <p class="text-emerald-800/40 font-bold italic">No hay solicitudes pendientes por el momento. ¡Buen trabajo!</p>
    </div>

  </main>

  <script>
    let tipoActual = 'ESTABLECIMIENTO';
    
    const token = localStorage.getItem('jwt_token'); 
    const rol = localStorage.getItem('user_rol');

    if (!token || !rol || !rol.includes('ADMINISTRADOR')) {
        alert("Acceso denegado: Se requieren permisos de administrador.");
        window.location.href = '/login.html?denied=true';
    }

    document.addEventListener("DOMContentLoaded", () => {
        cargarPendientes();
    });

    function cambiarTab(tipo) {
        tipoActual = tipo;
        document.querySelectorAll('button[id^="tab-"]').forEach(btn => {
            btn.classList.remove('bg-emerald-600', 'text-white', 'shadow-md');
            btn.classList.add('text-slate-400');
        });
        const activeBtn = document.getElementById(`tab-${tipo}`);
        activeBtn.classList.add('bg-emerald-600', 'text-white', 'shadow-md');
        activeBtn.classList.remove('text-slate-400');
        cargarPendientes();
    }

    async function cargarPendientes() {
        const contenedor = document.getElementById('contenedor-solicitudes');
        const vacio = document.getElementById('mensaje-vacio');
        
        try {
            const url = tipoActual === 'ESTABLECIMIENTO' 
                ? 'http://localhost:8080/api/establecimientos/pendientes'
                : 'http://localhost:8080/api/lugares/pendientes';

            const response = await fetch(url, {
                headers: { 'Authorization': `Bearer ${token}` } 
            });

            if (response.ok) {
                const lista = await response.json();
                contenedor.innerHTML = '';
                
                if (lista.length === 0) {
                    vacio.classList.remove('hidden');
                    return;
                }
                vacio.classList.add('hidden');

                lista.forEach(item => {
                    contenedor.innerHTML += `
                        <div class="bg-white border border-emerald-100 rounded-2xl p-6 hover:shadow-lg hover:border-emerald-300 transition-all group">
                            <div class="flex flex-col md:flex-row justify-between gap-6">
                                <div class="flex gap-6">
                                    <img src="${item.imagenUrl || 'https://via.placeholder.com/150'}" 
                                         onerror="this.src='https://via.placeholder.com/150'" 
                                         class="w-24 h-24 object-cover rounded-xl border border-emerald-50 shadow-sm">
                                    <div>
                                        <h3 class="text-xl font-black text-slate-900 uppercase italic">${item.nombre}</h3>
                                        <p class="text-xs text-emerald-600 font-semibold mb-2">📍 ${item.direccion}</p>
                                        <p class="text-sm text-slate-600 line-clamp-2 max-w-md">${item.descripcion}</p>
                                        <div class="mt-3 flex gap-2">
                                            <span class="text-[9px] font-bold bg-emerald-50 text-emerald-700 px-2 py-1 rounded uppercase tracking-widest">Cat: ${item.categoria || item.tipo}</span>
                                            <span class="text-[9px] font-bold bg-slate-100 text-slate-600 px-2 py-1 rounded uppercase tracking-widest">Aforo: ${item.aforoMaximo || 'N/A'}</span>
                                        </div>
                                    </div>
                                </div>
                                <div class="flex flex-row md:flex-col justify-center gap-3 w-full md:w-auto">
                                    <button onclick="procesarSolicitud(${item.id}, 'APROBAR')" class="flex-1 bg-emerald-600 text-white text-xs font-black px-6 py-3 rounded-xl hover:bg-emerald-700 shadow-sm transition-all">APROBAR</button>
                                    <button onclick="procesarSolicitud(${item.id}, 'RECHAZAR')" class="flex-1 bg-white text-red-500 border border-red-100 text-xs font-black px-6 py-3 rounded-xl hover:bg-red-50 transition-all">RECHAZAR</button>
                                </div>
                            </div>
                        </div>
                    `;
                });
            } else {
                console.error("Error del servidor:", response.status);
                if(response.status === 403) alert("Tu usuario no tiene permisos de administrador.");
            }
        } catch (e) { console.error("Error de conexión:", e); }
    }

    async function procesarSolicitud(id, accion) {
        const confirmacion = confirm(`¿Estás seguro de que deseas ${accion} esta solicitud?`);
        if (!confirmacion) return;

        const path = tipoActual === 'ESTABLECIMIENTO' ? 'establecimientos' : 'lugares';
        const url = `http://localhost:8080/api/${path}/${id}/${accion.toLowerCase()}`;

        try {
            const response = await fetch(url, {
                method: 'POST',
                headers: { 
                    'Authorization': `Bearer ${token}`,
                    'Content-Type': 'application/json' 
                }
            });

            if (response.ok) {
                alert(`¡Solicitud procesada con éxito!`);
                cargarPendientes();
            } else {
                alert("Hubo un problema al procesar la solicitud.");
            }
        } catch (e) { alert("Error al procesar la conexión con el servidor."); }
    }
  </script>

</body>
</html>
