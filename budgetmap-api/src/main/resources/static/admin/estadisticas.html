<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin - Métricas | BudgetMap</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <script>
    const token = localStorage.getItem('jwt_token');
    const rol = localStorage.getItem('user_rol');
    if (!token || !rol || !rol.includes('ADMINISTRADOR')) window.location.href = '/login.html?denied=true';
  </script>
</head>
<body class="bg-emerald-50 min-h-screen text-slate-800 font-sans flex flex-col">

  <nav class="bg-white border-b border-emerald-100 p-4 sticky top-0 z-50 shadow-sm">
    <div class="max-w-7xl mx-auto flex justify-between items-center">
      <div class="flex items-center gap-4">
        <span class="bg-emerald-600 text-white px-3 py-1 rounded-full font-black text-[10px] uppercase tracking-tighter">ADMIN</span>
        <h1 class="font-black tracking-widest text-emerald-900">CONTROL CENTER</h1>
      </div>
      <div class="flex gap-6 text-xs font-bold uppercase tracking-widest hidden md:flex">
        <a href="/admin/aprobaciones.html" class="text-slate-500 hover:text-emerald-600 transition">Aprobaciones</a>
        <a href="/admin/pqrs.html" class="text-slate-500 hover:text-emerald-600 transition">Tickets PQRS</a>
        <a href="/admin/usuarios.html" class="text-slate-500 hover:text-emerald-600 transition">Usuarios</a>
        <a href="/admin/estadisticas.html" class="text-emerald-600 border-b-2 border-emerald-600 pb-1">Métricas</a>
      </div>
      <button onclick="cerrarSesion()" class="text-[10px] text-slate-400 font-bold hover:text-red-500 transition">SALIR</button>
    </div>
  </nav>

  <main class="flex-1 max-w-7xl mx-auto w-full mt-8 px-6 pb-12">
    
    <div class="flex justify-between items-end mb-8">
        <div>
            <h2 class="text-3xl font-black text-slate-900 italic uppercase tracking-tighter">Métricas de Plataforma</h2>
            <p class="text-emerald-600/70 text-sm font-medium">Análisis global de crecimiento y operaciones.</p>
        </div>
        <button onclick="generarPDF()" class="bg-emerald-900 text-white px-6 py-3 rounded-xl text-xs font-black uppercase tracking-widest shadow-lg hover:bg-emerald-800 transition-all flex items-center gap-2">
            📄 Exportar Informe PDF
        </button>
    </div>

    <div class="grid grid-cols-1 md:grid-cols-4 gap-6 mb-8">
        <div class="bg-white border border-emerald-100 p-6 rounded-3xl shadow-sm">
            <p class="text-[10px] font-bold text-slate-400 uppercase tracking-widest mb-1">Usuarios Totales</p>
            <h3 id="stat-usuarios" class="text-4xl font-black text-slate-800">--</h3>
        </div>
        <div class="bg-white border border-emerald-100 p-6 rounded-3xl shadow-sm">
            <p class="text-[10px] font-bold text-slate-400 uppercase tracking-widest mb-1">Locales Aprobados</p>
            <h3 id="stat-locales" class="text-4xl font-black text-emerald-600">--</h3>
        </div>
        <div class="bg-white border border-emerald-100 p-6 rounded-3xl shadow-sm">
            <p class="text-[10px] font-bold text-slate-400 uppercase tracking-widest mb-1">Reservas Completadas</p>
            <h3 id="stat-reservas" class="text-4xl font-black text-blue-600">--</h3>
        </div>
        <div class="bg-white border border-emerald-100 p-6 rounded-3xl shadow-sm">
            <p class="text-[10px] font-bold text-slate-400 uppercase tracking-widest mb-1">Tickets Pendientes</p>
            <h3 id="stat-tickets" class="text-4xl font-black text-amber-500">--</h3>
        </div>
    </div>

    <div class="bg-white border border-emerald-100 rounded-3xl p-6 shadow-sm">
        <h4 class="text-lg font-black text-slate-800 uppercase tracking-tight mb-6 border-b border-emerald-50 pb-4">Distribución por Categoría</h4>
        <div id="lista-categorias" class="grid grid-cols-2 md:grid-cols-4 gap-4">
            <p class="text-xs text-slate-500 italic">Cargando métricas...</p>
        </div>
    </div>
  </main>

  <script>
    let datosGlobales = {};

    document.addEventListener("DOMContentLoaded", () => cargarMetricas());
    function cerrarSesion() { localStorage.clear(); window.location.href = '/login.html'; }

    async function cargarMetricas() {
        try {
            // Ajusta este endpoint a tu backend analítico real
            const res = await fetch(`http://localhost:8080/api/admin/estadisticas/global`, {
                headers: { 'Authorization': `Bearer ${token}` }
            });
            if (res.ok) {
                datosGlobales = await res.json();
                
                document.getElementById('stat-usuarios').innerText = datosGlobales.totalUsuarios || 0;
                document.getElementById('stat-locales').innerText = datosGlobales.totalEstablecimientosAprobados || 0;
                document.getElementById('stat-reservas').innerText = datosGlobales.totalReservas || 0;
                document.getElementById('stat-tickets').innerText = datosGlobales.ticketsPendientes || 0;

                const catList = document.getElementById('lista-categorias');
                catList.innerHTML = '';
                const cats = datosGlobales.establecimientosPorCategoria || {};
                
                if (Object.keys(cats).length === 0) {
                    catList.innerHTML = '<p class="text-xs text-slate-400 font-bold">Sin datos de categorías aún.</p>';
                }

                Object.entries(cats).forEach(([cat, cantidad]) => {
                    catList.innerHTML += `
                        <div class="bg-emerald-50/50 p-4 rounded-xl border border-emerald-100">
                            <span class="text-[10px] font-black uppercase text-slate-500 block mb-1">${cat}</span>
                            <span class="text-xl font-bold text-emerald-800">${cantidad}</span>
                        </div>
                    `;
                });
            }
        } catch (e) { console.error("Error al cargar métricas"); }
    }

    function generarPDF() {
        const { jsPDF } = window.jspdf;
        const pdf = new jsPDF();
        const hoy = new Date().toLocaleDateString();

        pdf.setFontSize(18);
        pdf.setTextColor(5, 150, 105);
        pdf.text("REPORTE EJECUTIVO BUDGETMAP", 15, 20);
        
        pdf.setFontSize(10);
        pdf.setTextColor(100, 116, 139);
        pdf.text(`Fecha: ${hoy} | Generado por Admin`, 15, 28);
        pdf.line(15, 32, 195, 32);

        pdf.setFontSize(12);
        pdf.setTextColor(30, 41, 59);
        pdf.text(`Usuarios Registrados: ${datosGlobales.totalUsuarios || 0}`, 15, 45);
        pdf.text(`Locales Aprobados: ${datosGlobales.totalEstablecimientosAprobados || 0}`, 15, 55);
        pdf.text(`Reservas Exitosas: ${datosGlobales.totalReservas || 0}`, 15, 65);

        pdf.text("DESGLOSE POR CATEGORÍA DE LOCALES:", 15, 85);
        let y = 95;
        const cats = datosGlobales.establecimientosPorCategoria || {};
        Object.entries(cats).forEach(([cat, val]) => {
            pdf.setFontSize(10);
            pdf.text(`• ${cat}: ${val}`, 20, y);
            y += 8;
        });

        pdf.save(`BudgetMap_Reporte_${hoy}.pdf`);
    }
  </script>
</body>
</html>
