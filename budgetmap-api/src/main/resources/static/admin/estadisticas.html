<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin - Métricas BudgetMap</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
  
  <script>
    const token = localStorage.getItem('jwt_token');
    const rol = localStorage.getItem('user_rol');
    if (!token || !rol || !rol.includes('ADMINISTRADOR')) {
        window.location.href = '/login.html?denied=true';
    }
  </script>
</head>
<body class="bg-emerald-50 min-h-screen text-slate-800 font-sans">

  <nav class="bg-white border-b border-emerald-100 p-4 sticky top-0 z-50 shadow-sm">
    <div class="max-w-7xl mx-auto flex justify-between items-center">
      <div class="flex items-center gap-4">
        <span class="bg-emerald-600 text-white px-3 py-1 rounded-full font-black text-[10px] uppercase tracking-tighter">ADMIN</span>
        <h1 class="font-black tracking-widest text-emerald-900">CONTROL CENTER</h1>
      </div>
      <div class="flex gap-6 text-xs font-bold uppercase tracking-widest">
        <a href="/admin/aprobaciones.html" class="text-slate-500 hover:text-emerald-600 transition">Aprobaciones</a>
        <a href="/admin/pqrs.html" class="text-slate-500 hover:text-emerald-600 transition">Tickets PQRS</a>
        <a href="/admin/usuarios.html" class="text-slate-500 hover:text-emerald-600 transition">Usuarios</a>
        <a href="/admin/estadisticas.html" class="text-emerald-600 border-b-2 border-emerald-600 pb-1">Métricas</a>
      </div>
      <button onclick="localStorage.clear(); location.href='/login.html'" class="text-[10px] text-slate-400 font-bold hover:text-red-500 transition">SALIR</button>
    </div>
  </nav>

  <main id="reporte-contenido" class="max-w-6xl mx-auto mt-10 px-6 pb-12">
    
    <div class="flex justify-between items-center mb-10">
        <div>
            <h2 class="text-3xl font-black text-slate-900 italic uppercase tracking-tighter">Panel de Estadísticas</h2>
            <p class="text-emerald-600/70 text-sm font-medium">Datos reales extraídos de la base de datos BudgetMap.</p>
        </div>
        <button onclick="descargarPDF()" class="bg-emerald-600 hover:bg-emerald-700 text-white text-[10px] font-black px-5 py-3 rounded-xl transition-all uppercase flex items-center gap-2 shadow-md shadow-emerald-200">
            Exportar Reporte
        </button>
    </div>

    <div class="grid grid-cols-1 lg:grid-cols-2 gap-8">
        
        <div class="bg-white border border-emerald-100 rounded-3xl p-8 shadow-sm">
            <h4 class="text-xs font-black text-slate-400 uppercase tracking-widest mb-8 flex items-center gap-2">
                <span class="w-1.5 h-4 bg-emerald-500 rounded-full"></span> Crecimiento de Usuarios
            </h4>
            <div class="flex items-end justify-between h-64 gap-3 px-2 border-b border-emerald-50">
                <div class="flex-1 flex flex-col items-center h-full justify-end">
                    <div id="barra-ENE" class="bg-emerald-500 w-full rounded-t-lg transition-all duration-1000 shadow-sm" style="height: 0%"></div>
                    <span class="text-[10px] mt-3 text-slate-400 font-bold uppercase">Ene</span>
                </div>
                <div class="flex-1 flex flex-col items-center h-full justify-end">
                    <div id="barra-FEB" class="bg-emerald-500 w-full rounded-t-lg transition-all duration-1000 shadow-sm" style="height: 0%"></div>
                    <span class="text-[10px] mt-3 text-slate-400 font-bold uppercase">Feb</span>
                </div>
                <div class="flex-1 flex flex-col items-center h-full justify-end">
                    <div id="barra-MAR" class="bg-emerald-400 w-full rounded-t-lg transition-all duration-1000 shadow-sm" style="height: 0%"></div>
                    <span class="text-[10px] mt-3 text-slate-400 font-bold uppercase">Mar</span>
                </div>
                <div class="flex-1 flex flex-col items-center h-full justify-end">
                    <div id="barra-ABR" class="bg-emerald-600 w-full rounded-t-lg transition-all duration-1000 shadow-sm" style="height: 0%"></div>
                    <span class="text-[10px] mt-3 text-slate-400 font-bold uppercase">Abr</span>
                </div>
            </div>
        </div>

        <div class="bg-white border border-emerald-100 rounded-3xl p-8 shadow-sm">
            <h4 class="text-xs font-black text-slate-400 uppercase tracking-widest mb-8 flex items-center gap-2">
                <span class="w-1.5 h-4 bg-emerald-400 rounded-full"></span> Distribución por Categoría
            </h4>
            <div class="space-y-6">
                <div id="barra-proporcional" class="w-full h-10 flex rounded-full overflow-hidden bg-emerald-50 shadow-inner p-1">
                    </div>
                <div id="leyenda-categorias" class="grid grid-cols-2 gap-4 pt-4 border-t border-emerald-50">
                    </div>
            </div>
        </div>
    </div>
  </main>

  <script>
    let datosGlobales = null;
    // Colores profesionales: Esmeralda, Azul Slate, Lima, Menta, etc.
    const colores = ['#059669', '#10b981', '#34d399', '#6ee7b7', '#a7f3d0', '#064e3b', '#065f46', '#047857'];

    window.onload = () => cargarMetricasReales();

    async function cargarMetricasReales() {
        try {
            const response = await fetch('http://localhost:8080/api/admin/metrics/summary', {
                headers: { 'Authorization': `Bearer ${token}` }
            });
            if (response.ok) {
                datosGlobales = await response.json();
                renderizarDashboard(datosGlobales);
            }
        } catch (e) { console.error("Error:", e); }
    }

    function renderizarDashboard(data) {
        if (!data) return;

        // 1. Barras Mensuales
        const reg = data.registrosMensuales || {};
        const max = Math.max(...Object.values(reg), 1);
        
        ['ENE', 'FEB', 'MAR', 'ABR'].forEach(mes => {
            const valor = reg[mes] || 0;
            const porcentaje = (valor / max) * 100;
            const elemento = document.getElementById(`barra-${mes}`);
            
            if (elemento) {
                setTimeout(() => {
                    elemento.style.height = porcentaje + "%";
                }, 200);
            }
        });

        // 2. Categorías
        const cats = data.establecimientosPorCategoria || {};
        const total = Object.values(cats).reduce((a, b) => a + b, 0) || 1;
        const contenedorBarra = document.getElementById('barra-proporcional');
        const contenedorLeyenda = document.getElementById('leyenda-categorias');
        
        contenedorBarra.innerHTML = '';
        contenedorLeyenda.innerHTML = '';

        Object.keys(cats).forEach((key, index) => {
            const valor = cats[key];
            const porcentaje = Math.round((valor / total) * 100);
            if (porcentaje <= 0) return;
            const color = colores[index % colores.length];

            contenedorBarra.innerHTML += `<div style="width: ${porcentaje}%; background-color: ${color}" class="h-full transition-all duration-1000 first:rounded-l-full last:rounded-r-full"></div>`;
            contenedorLeyenda.innerHTML += `
                <div class="flex items-center justify-between border-b border-emerald-50 pb-2">
                    <div class="flex items-center gap-2">
                        <div class="w-2 h-2 rounded-full" style="background-color: ${color}"></div>
                        <span class="text-[10px] text-slate-500 font-bold uppercase">${key}</span>
                    </div>
                    <span class="text-xs font-black text-emerald-700">${porcentaje}%</span>
                </div>`;
        });
    }

    async function descargarPDF() {
        const { jsPDF } = window.jspdf;
        const pdf = new jsPDF('p', 'mm', 'a4');
        const hoy = new Date().toLocaleDateString();

        pdf.setFontSize(18);
        pdf.setTextColor(5, 150, 105); // Color Esmeralda
        pdf.text("REPORTE DE MÉTRICAS BUDGETMAP", 15, 20);
        
        pdf.setFontSize(10);
        pdf.setTextColor(100, 116, 139); // Color Slate
        pdf.text(`Fecha de emisión: ${hoy} | Total Usuarios: ${datosGlobales.totalUsuarios || 'N/A'}`, 15, 28);
        pdf.line(15, 32, 195, 32);

        // Tabla de Porcentajes
        pdf.setFontSize(12);
        pdf.setTextColor(30, 41, 59);
        pdf.text("DISTRIBUCIÓN POR CATEGORÍA", 15, 45);
        
        let y = 55;
        const cats = datosGlobales.establecimientosPorCategoria || {};
        const total = Object.values(cats).reduce((a, b) => a + b, 0) || 1;

        Object.keys(cats).forEach(key => {
            const p = Math.round((cats[key] / total) * 100);
            pdf.setFontSize(10);
            pdf.text(`• ${key}:`, 15, y);
            pdf.text(`${p}%`, 80, y);
            y += 8;
        });

        // Captura del dashboard con fondo claro
        const canvas = await html2canvas(document.getElementById('reporte-contenido'), { 
            scale: 1, 
            backgroundColor: '#f0fdf4' // emerald-50
        });
        
        pdf.addPage();
        pdf.text("ANEXO VISUAL DEL DASHBOARD", 15, 15);
        pdf.addImage(canvas.toDataURL('image/png'), 'PNG', 10, 20, 190, 0);
        pdf.save(`Reporte_BudgetMap_${hoy}.pdf`);
    }
  </script>
</body>
</html>
