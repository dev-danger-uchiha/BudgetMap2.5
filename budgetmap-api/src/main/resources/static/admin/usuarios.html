<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin - Usuarios</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    const token = localStorage.getItem('jwt_token');
    const rol = localStorage.getItem('user_rol');
    // Solo Administrador puede ver esta vista
    if (!token || !rol || !rol.includes('ADMINISTRADOR')) {
        window.location.href = '/login.html?denied=true';
    }
  </script>
</head>
<body class="bg-emerald-50 min-h-screen text-slate-800 font-sans">

  <nav class="bg-white border-b border-emerald-100 p-4 sticky top-0 z-50 shadow-sm">
    <div class="max-w-7xl mx-auto flex justify-between items-center">
      <div class="flex items-center gap-4">
        <span class="bg-emerald-600 text-white px-3 py-1 rounded-full font-black text-[10px] uppercase tracking-tighter">ADMIN</span>
        <h1 class="font-black tracking-widest text-emerald-900">CONTROL CENTER</h1>
      </div>
      <div class="flex gap-6 text-xs font-bold uppercase tracking-widest">
        <a href="/admin/aprobaciones.html" class="text-slate-500 hover:text-emerald-600 transition">Aprobaciones</a>
        <a href="/admin/pqrs.html" class="text-slate-500 hover:text-emerald-600 transition">Tickets PQRS</a>
        <a href="/admin/usuarios.html" class="text-emerald-600 border-b-2 border-emerald-600 pb-1">Usuarios</a>
        <a href="/admin/estadisticas.html" class="text-slate-500 hover:text-emerald-600 transition">Métricas</a>
      </div>
      <button onclick="localStorage.clear(); location.href='/login.html'" class="text-[10px] text-slate-400 font-bold hover:text-red-500 transition">SALIR</button>
    </div>
  </nav>

  <main class="max-w-6xl mx-auto mt-10 px-6 pb-12">
    <div class="flex flex-col md:flex-row justify-between items-start md:items-end mb-8 gap-4">
        <div>
            <h2 class="text-3xl font-black text-slate-900 italic uppercase tracking-tighter">Usuarios Registrados</h2>
            <p class="text-emerald-600/70 text-sm font-medium">Administra roles y el estado de las cuentas de la plataforma.</p>
        </div>
        <div class="flex gap-2 w-full md:w-auto">
            <input type="text" id="buscador" placeholder="Buscar por email..." 
                   class="bg-white border border-emerald-100 rounded-xl px-4 py-2 text-sm text-slate-800 focus:border-emerald-500 focus:ring-2 focus:ring-emerald-200 outline-none w-full md:w-64 transition-all shadow-sm">
            <button onclick="cargarUsuarios(document.getElementById('buscador').value)" 
                    class="bg-emerald-600 text-white px-6 py-2 rounded-xl text-xs font-black uppercase hover:bg-emerald-700 transition-all shadow-md shadow-emerald-100"> 
                Buscar 
            </button>
        </div>
    </div>

    <div class="bg-white border border-emerald-100 rounded-3xl overflow-hidden shadow-xl shadow-emerald-900/5">
        <div class="overflow-x-auto">
            <table class="w-full text-left border-collapse">
                <thead class="bg-emerald-50/50 text-[10px] uppercase tracking-[0.2em] font-black text-emerald-800/60 border-b border-emerald-100">
                    <tr>
                        <th class="p-5">Usuario / Email</th>
                        <th class="p-5">Rol Asignado</th>
                        <th class="p-5">Estado</th>
                        <th class="p-5 text-right">Gestión</th>
                    </tr>
                </thead>
                <tbody id="tabla-usuarios" class="text-sm divide-y divide-emerald-50">
                    <tr>
                        <td colspan="4" class="p-12 text-center text-slate-400 italic animate-pulse">
                            Cargando base de datos...
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>
  </main>

  <script>
    document.addEventListener("DOMContentLoaded", () => cargarUsuarios());

    async function cargarUsuarios(criterio = "") {
        const tbody = document.getElementById('tabla-usuarios');
        
        tbody.innerHTML = '<tr><td colspan="4" class="p-12 text-center text-emerald-600/50 italic animate-pulse font-bold uppercase tracking-widest text-xs">Sincronizando...</td></tr>';
        
        try {
            const url = criterio 
                ? `http://localhost:8080/api/usuarios/buscar?criterio=${encodeURIComponent(criterio)}`
                : 'http://localhost:8080/api/usuarios';

            const response = await fetch(url, {
                headers: { 'Authorization': `Bearer ${token}` }
            });
            
            if (response.ok) {
                const usuarios = await response.json();
                tbody.innerHTML = '';
                
                if (usuarios.length === 0) {
                    tbody.innerHTML = '<tr><td colspan="4" class="p-12 text-center text-slate-400 italic font-medium">No se encontraron usuarios que coincidan con la búsqueda.</td></tr>';
                    return;
                }

                usuarios.forEach(user => {
                    // Lógica de botones de estado
                    const btnEstado = user.activo 
                        ? `<button onclick="cambiarEstado(${user.id}, false)" class="text-[10px] font-black text-red-500 hover:bg-red-50 transition-all uppercase tracking-widest border border-red-100 px-4 py-2 rounded-lg">Suspender</button>`
                        : `<button onclick="cambiarEstado(${user.id}, true)" class="text-[10px] font-black text-emerald-600 hover:bg-emerald-50 transition-all uppercase tracking-widest border border-emerald-200 px-4 py-2 rounded-lg">Activar Cuenta</button>`;
                    
                    const estadoTexto = user.activo 
                        ? `<span class="flex items-center gap-1.5 text-emerald-600 font-bold text-[10px] uppercase tracking-widest"><span class="w-2 h-2 bg-emerald-500 rounded-full animate-pulse"></span> Activo</span>`
                        : `<span class="flex items-center gap-1.5 text-slate-400 font-bold text-[10px] uppercase tracking-widest"><span class="w-2 h-2 bg-slate-300 rounded-full"></span> Suspendido</span>`;

                    tbody.innerHTML += `
                        <tr class="hover:bg-emerald-50/30 transition-all group">
                            <td class="p-5">
                                <p class="font-black text-slate-900 italic uppercase tracking-tight">${user.nombre || 'Sin nombre registrado'}</p>
                                <p class="text-xs text-emerald-700/60 font-medium">${user.email}</p>
                            </td>
                            <td class="p-5">
                                <span class="bg-white text-slate-700 px-3 py-1 rounded-full text-[10px] font-black uppercase border border-emerald-100 shadow-sm inline-block">${user.rol}</span>
                            </td>
                            <td class="p-5">${estadoTexto}</td>
                            <td class="p-5 text-right opacity-40 group-hover:opacity-100 transition-opacity">
                                ${btnEstado}
                            </td>
                        </tr>
                    `;
                });
            } else {
                tbody.innerHTML = '<tr><td colspan="4" class="p-12 text-center text-red-500 font-bold">Error 403: No tienes permisos para esta acción.</td></tr>';
            }
        } catch (e) {
            tbody.innerHTML = '<tr><td colspan="4" class="p-12 text-center text-red-500 font-bold">Error crítico: No se pudo conectar con el servidor.</td></tr>';
        }
    }

    // Evento de búsqueda con Enter
    document.getElementById('buscador').addEventListener('keypress', (e) => {
        if (e.key === 'Enter') {
            cargarUsuarios(e.target.value);
        }
    });

    async function cambiarEstado(id, activar) {
        const accion = activar ? 'activar' : 'suspender';
        if(!confirm(`¿Confirmas que deseas ${accion} este acceso?`)) return;
        
        try {
            const url = `http://localhost:8080/api/usuarios/${id}/estado?activo=${activar}`;
            
            const response = await fetch(url, {
                method: 'PUT',
                headers: { 
                    'Authorization': `Bearer ${token}`,
                    'Content-Type': 'application/json'
                }
            });

            if (response.ok) {
                alert(`Estado actualizado: Usuario ${activar ? 'habilitado' : 'deshabilitado'}.`);
                cargarUsuarios(document.getElementById('buscador').value);
            } else {
                alert("La operación fue rechazada por el servidor.");
            }
        } catch(e) {
            console.error(e);
            alert("Error de comunicación.");
        }
    }
  </script>
</body>
</html>
