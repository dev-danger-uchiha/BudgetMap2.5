<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Página No Encontrada - BudgetMap</title>
  
  <link rel="preconnect" href="https://cdn.tailwindcss.com">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;900&display=swap" rel="stylesheet">
  
  <style>
    body { font-family: 'Inter', sans-serif; }
    .glass-panel {
      background: rgba(20, 20, 20, 0.45);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid rgba(255, 255, 255, 0.1);
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
    }
    .radar-pulse {
      animation: radar-pulse 2.5s infinite cubic-bezier(0.66, 0, 0, 1);
    }
    @keyframes radar-pulse {
      0% { box-shadow: 0 0 0 0 rgba(249, 115, 22, 0.6); }
      70% { box-shadow: 0 0 0 50px rgba(249, 115, 22, 0); }
      100% { box-shadow: 0 0 0 0 rgba(249, 115, 22, 0); }
    }
  </style>
</head>
<body class="relative min-h-screen flex items-center justify-center overflow-hidden bg-black text-white">

  <!-- Background Image: Mapa o brújula perdida -->
  <div class="absolute inset-0 w-full h-full">
    <img src="https://images.unsplash.com/photo-1524661135-423995f22d0b?w=1600&q=80" alt="Lost" class="w-full h-full object-cover opacity-50 mix-blend-luminosity">
  </div>

  <!-- Overlay Gradients -->
  <div class="absolute inset-0 bg-gradient-to-t from-black via-black/80 to-transparent z-10"></div>
  <div class="absolute inset-0 bg-[radial-gradient(ellipse_at_center,_var(--tw-gradient-stops))] from-orange-900/20 via-black/50 to-black z-10"></div>

  <!-- Content -->
  <main class="relative z-20 w-full max-w-lg px-6 text-center transform transition-all duration-700 animate-[fadeInUp_1s_ease-out]">
    
    <div class="relative inline-flex items-center justify-center w-32 h-32 mb-8 rounded-full bg-orange-500/10 border border-orange-500/30 radar-pulse backdrop-blur-sm">
      <h1 class="text-6xl font-black text-transparent bg-clip-text bg-gradient-to-br from-orange-400 to-amber-600 drop-shadow-lg">404</h1>
    </div>

    <h2 class="text-4xl md:text-5xl font-black tracking-tight mb-4 text-white drop-shadow-md">
      Te saliste del <span class="text-orange-500">mapa</span>.
    </h2>
    
    <p class="text-gray-400 text-lg md:text-xl font-light mb-10 px-4 leading-relaxed">
      Nuestros radares no detectan la zona que buscas. Es un área inexplorada o la ruta ha cambiado de lugar.
    </p>

    <div class="flex flex-col sm:flex-row items-center justify-center gap-4">
      <a href="/" class="group relative px-8 py-4 w-full sm:w-auto rounded-2xl font-bold text-white overflow-hidden shadow-[0_0_20px_rgba(249,115,22,0.3)] hover:shadow-[0_0_30px_rgba(249,115,22,0.6)] transition-all duration-300">
        <div class="absolute inset-0 bg-gradient-to-r from-orange-600 to-amber-500 group-hover:scale-105 transition-transform duration-500"></div>
        <span class="relative flex items-center justify-center gap-2">
          <svg class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17.657 16.657L13.414 20.9a1.998 1.998 0 01-2.827 0l-4.244-4.243a8 8 0 1111.314 0z" />
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 11a3 3 0 11-6 0 3 3 0 016 0z" />
          </svg>
          Volver al Explorador
        </span>
      </a>
      
      <a href="javascript:history.back()" class="px-8 py-4 w-full sm:w-auto rounded-2xl font-bold text-gray-300 bg-white/5 border border-white/10 hover:bg-white/10 hover:text-white transition-all duration-300 backdrop-blur-md">
        Regresar atrás
      </a>
    </div>

    <!-- Decorative Elements -->
    <div class="absolute top-1/2 left-0 -translate-y-1/2 -translate-x-full w-64 h-64 bg-orange-600/20 rounded-full blur-[100px] pointer-events-none"></div>
    <div class="absolute top-1/2 right-0 -translate-y-1/2 translate-x-full w-64 h-64 bg-amber-500/20 rounded-full blur-[100px] pointer-events-none"></div>

  </main>

  <script>
    tailwind.config = {
      theme: {
        extend: {
          keyframes: {
            fadeInUp: {
              '0%': { opacity: '0', transform: 'translateY(30px) scale(0.95)' },
              '100%': { opacity: '1', transform: 'translateY(0) scale(1)' },
            }
          }
        }
      }
    }
  </script>
</body>
</html>
