<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Acceso Denegado - BudgetMap</title>
  
  <link rel="preconnect" href="https://cdn.tailwindcss.com">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;900&display=swap" rel="stylesheet">
  
  <style>
    body { font-family: 'Inter', sans-serif; }
    .scan-line {
      width: 100%;
      height: 4px;
      background: rgba(234, 179, 8, 0.5);
      position: absolute;
      top: 0;
      animation: scan 3s linear infinite;
      box-shadow: 0 0 10px rgba(234, 179, 8, 0.8), 0 0 20px rgba(234, 179, 8, 0.5);
    }
    @keyframes scan {
      0% { top: 0%; opacity: 0; }
      10% { opacity: 1; }
      90% { opacity: 1; }
      100% { top: 100%; opacity: 0; }
    }
  </style>
</head>
<body class="relative min-h-screen flex items-center justify-center overflow-hidden bg-black text-white">

  <!-- Background VIP / Security Door -->
  <div class="absolute inset-0 w-full h-full opacity-40 mix-blend-overlay pointer-events-none">
     <img src="https://images.unsplash.com/photo-1510525009512-ad7fc13eefab?w=1600&q=80" class="w-full h-full object-cover grayscale">
  </div>

  <div class="absolute inset-0 bg-gradient-to-tr from-black via-zinc-900 to-black z-10"></div>
  <div class="absolute inset-0 bg-[radial-gradient(ellipse_at_top,_var(--tw-gradient-stops))] from-yellow-900/10 via-black/0 to-black z-10"></div>

  <main class="relative z-20 w-full max-w-lg px-6 text-center transform transition-all duration-700 animate-[fadeInUp_1s_ease-out]">
    
    <!-- Lock Icon with Scanner -->
    <div class="relative inline-flex items-center justify-center w-32 h-32 mb-8 rounded-full bg-zinc-800/50 border border-yellow-500/30 backdrop-blur-md shadow-[0_0_30px_rgba(234,179,8,0.15)] overflow-hidden">
      <div class="scan-line"></div>
      <svg class="w-16 h-16 text-yellow-500" fill="none" viewBox="0 0 24 24" stroke="currentColor">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z" />
      </svg>
    </div>

    <h2 class="text-4xl md:text-5xl font-black tracking-tight mb-4 text-white drop-shadow-md">
      Acceso <span class="text-yellow-500">Denegado</span>.
    </h2>
    <div class="inline-block bg-yellow-500 text-black text-xs font-black tracking-widest uppercase px-3 py-1 rounded mb-4">Error 403</div>
    
    <p class="text-gray-400 text-lg font-light mb-10 px-4 leading-relaxed">
      No tienes la credencial necesaria para entrar a esta zona VIP del mapa. Si crees que esto es un error, verifica tu sesión.
    </p>

    <div class="flex flex-col sm:flex-row items-center justify-center gap-4">
      <a href="/login.html" class="group relative px-8 py-4 w-full sm:w-auto rounded-2xl font-bold text-black overflow-hidden shadow-[0_0_20px_rgba(234,179,8,0.3)] hover:shadow-[0_0_30px_rgba(234,179,8,0.6)] transition-all duration-300">
        <div class="absolute inset-0 bg-gradient-to-r from-yellow-500 to-amber-400 group-hover:scale-105 transition-transform duration-500"></div>
        <span class="relative flex items-center justify-center gap-2">
          <svg class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11 16l-4-4m0 0l4-4m-4 4h14m-5 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h7a3 3 0 013 3v1" />
          </svg>
          Iniciar Sesión
        </span>
      </a>
      
      <a href="/" class="px-8 py-4 w-full sm:w-auto rounded-2xl font-bold text-gray-300 bg-white/5 border border-white/10 hover:bg-white/10 hover:text-white transition-all duration-300 backdrop-blur-md">
        Ir al Mapa
      </a>
    </div>

  </main>

  <script>
    tailwind.config = {
      theme: {
        extend: {
          keyframes: {
            fadeInUp: {
              '0%': { opacity: '0', transform: 'translateY(30px)' },
              '100%': { opacity: '1', transform: 'translateY(0)' },
            }
          }
        }
      }
    }
  </script>
</body>
</html>
