<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Soporte y PQRS - BudgetMap</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    // Seguridad básica
    const token = localStorage.getItem('jwt_token');
    if (!token) window.location.href = '/login.html';
  </script>
</head>
<body class="bg-gray-50 dark:bg-gray-900 min-h-screen flex flex-col">

  <nav class="bg-white dark:bg-gray-800 shadow-sm p-4 flex justify-between items-center border-b border-gray-200 dark:border-gray-700">
    <button onclick="history.back()" class="text-emerald-600 font-bold flex items-center gap-2 hover:underline">
      ⬅️ Regresar
    </button>
    <span class="font-black text-gray-800 dark:text-white tracking-widest">CENTRO DE AYUDA</span>
    <div class="w-10"></div>
  </nav>

  <main class="flex-1 max-w-2xl mx-auto w-full mt-10 px-6 pb-20">
    
    <div class="text-center mb-10">
      <h1 class="text-3xl font-black text-gray-800 dark:text-white">¿Cómo podemos ayudarte?</h1>
      <p class="text-gray-500 dark:text-gray-400 mt-2">Tu opinión nos ayuda a mejorar la experiencia BudgetMap en tu ciudad.</p>
    </div>

    <div class="bg-white dark:bg-gray-800 rounded-3xl shadow-xl p-8 border border-gray-100 dark:border-gray-700">
      <form id="pqrsForm" class="space-y-6">
        
        <div>
          <label class="block text-sm font-bold text-gray-700 dark:text-gray-300 mb-3">¿Qué deseas reportar?</label>
          <div class="grid grid-cols-2 gap-3">
            <label class="cursor-pointer">
              <input type="radio" name="tipo" value="PETICION" class="peer hidden" checked>
              <div class="p-3 text-center rounded-xl border-2 border-gray-100 dark:border-gray-700 peer-checked:border-emerald-500 peer-checked:bg-emerald-50 dark:peer-checked:bg-emerald-900/20 transition">
                <span class="text-xl block">🙋‍♂️</span>
                <span class="text-[10px] font-bold uppercase dark:text-gray-300">Petición</span>
              </div>
            </label>
            <label class="cursor-pointer">
              <input type="radio" name="tipo" value="QUEJA" class="peer hidden">
              <div class="p-3 text-center rounded-xl border-2 border-gray-100 dark:border-gray-700 peer-checked:border-red-500 peer-checked:bg-red-50 dark:peer-checked:bg-red-900/20 transition">
                <span class="text-xl block">😠</span>
                <span class="text-[10px] font-bold uppercase dark:text-gray-300">Queja</span>
              </div>
            </label>
            <label class="cursor-pointer">
              <input type="radio" name="tipo" value="RECLAMO" class="peer hidden">
              <div class="p-3 text-center rounded-xl border-2 border-gray-100 dark:border-gray-700 peer-checked:border-orange-500 peer-checked:bg-orange-50 dark:peer-checked:bg-orange-900/20 transition">
                <span class="text-xl block">⚖️</span>
                <span class="text-[10px] font-bold uppercase dark:text-gray-300">Reclamo</span>
              </div>
            </label>
            <label class="cursor-pointer">
              <input type="radio" name="tipo" value="SUGERENCIA" class="peer hidden">
              <div class="p-3 text-center rounded-xl border-2 border-gray-100 dark:border-gray-700 peer-checked:border-blue-500 peer-checked:bg-blue-50 dark:peer-checked:bg-blue-900/20 transition">
                <span class="text-xl block">💡</span>
                <span class="text-[10px] font-bold uppercase dark:text-gray-300">Sugerencia</span>
              </div>
            </label>
          </div>
        </div>

        <div>
          <label for="asunto" class="block text-sm font-bold text-gray-700 dark:text-gray-300 mb-1">Asunto:</label>
          <input type="text" id="asunto" required placeholder="Ej: Problema con una reserva"
                 class="w-full px-4 py-3 bg-gray-50 dark:bg-gray-700 border border-gray-200 dark:border-gray-600 rounded-xl focus:ring-2 focus:ring-emerald-500 outline-none dark:text-white transition" />
        </div>

        <div>
          <label for="descripcion" class="block text-sm font-bold text-gray-700 dark:text-gray-300 mb-1">Detalles de tu mensaje:</label>
          <textarea id="descripcion" rows="5" required placeholder="Cuéntanos más detalles para poder ayudarte mejor..."
                    class="w-full px-4 py-3 bg-gray-50 dark:bg-gray-700 border border-gray-200 dark:border-gray-600 rounded-xl focus:ring-2 focus:ring-emerald-500 outline-none dark:text-white transition resize-none"></textarea>
        </div>

        <button type="submit" id="btn-enviar"
                class="w-full bg-emerald-600 text-white font-black py-4 rounded-2xl shadow-lg hover:bg-emerald-500 transition transform active:scale-95">
          ENVIAR SOLICITUD
        </button>
      </form>

      <div id="successState" class="hidden text-center py-10 space-y-4">
        <div class="w-20 h-20 bg-green-100 text-green-600 rounded-full flex items-center justify-center text-4xl mx-auto shadow-inner">
          ✓
        </div>
        <h2 class="text-2xl font-black text-gray-800 dark:text-white">¡Mensaje Recibido!</h2>
        <p class="text-gray-500">Hemos registrado tu PQRS con éxito. Nuestro equipo de moderación te responderá pronto en tu bandeja de notificaciones.</p>
        <button onclick="window.location.href='/explorador/dashboard.html'" class="mt-4 text-emerald-600 font-bold hover:underline">
          Volver al Inicio
        </button>
      </div>
    </div>

  </main>

  <script>
    document.getElementById('pqrsForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      
      const btn = document.getElementById('btn-enviar');
      btn.disabled = true;
      btn.textContent = "ENVIANDO...";

      const data = {
        tipo: document.querySelector('input[name="tipo"]:checked').value,
        asunto: document.getElementById('asunto').value,
        descripcion: document.getElementById('descripcion').value
      };

      try {
        const response = await fetch('http://localhost:8080/api/pqrs', {
          method: 'POST',
          headers: { 
            'Authorization': `Bearer ${token}`,
            'Content-Type': 'application/json' 
          },
          body: JSON.stringify(data)
        });

        if (response.ok) {
          document.getElementById('pqrsForm').classList.add('hidden');
          document.getElementById('successState').classList.remove('hidden');
        } else {
          alert("Hubo un problema al enviar tu solicitud. Intenta más tarde.");
          btn.disabled = false;
          btn.textContent = "ENVIAR SOLICITUD";
        }
      } catch (error) {
        alert("Error de conexión con el servidor.");
        btn.disabled = false;
        btn.textContent = "ENVIAR SOLICITUD";
      }
    });
  </script>
</body>
</html>
