<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Notificaciones | BudgetMap</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    const token = localStorage.getItem('jwt_token');
    if (!token) window.location.href = '/login.html';
  </script>
</head>
<body class="bg-slate-50 min-h-screen font-sans">

  <nav class="bg-gradient-to-r from-orange-500 to-amber-500 p-4 shadow-md text-white sticky top-0 z-50">
    <div class="w-full px-6 md:px-10 flex justify-between items-center">
      <div class="flex items-center gap-3">
        <button onclick="location.href='dashboard.html'" class="font-bold text-xs tracking-widest uppercase hover:text-amber-200 mr-2">⬅ Radar</button>
        <div class="relative bg-white rounded-full w-12 h-12 md:w-16 md:h-16 shadow-md ring-1 ring-black/5 flex items-center justify-center z-0 hidden sm:flex"><img src="/images/logo.png" alt="Logo BudgetMap" class="absolute w-16 h-16 md:w-24 md:h-24 max-w-none object-contain transform transition duration-500 hover:scale-110 top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 z-40 drop-shadow-xl" /></div>
        <span class="font-black tracking-widest text-lg uppercase drop-shadow-md"><a href="/index.html" class="hover:text-emerald-600 transition">BUDGETMAP</a></span>
      </div>
      <div class="flex items-center gap-3">
        <span class="text-xs font-bold uppercase text-orange-100 hidden sm:inline-block">Notificaciones</span>
        <button onclick="marcarTodasLeidas()" class="text-[9px] bg-white/20 hover:bg-white/30 px-3 py-1.5 rounded-full font-bold uppercase tracking-widest transition backdrop-blur-sm hidden sm:inline-block">
          Limpiar
        </button>
        <button onclick="cerrarSesion()" class="text-[12px] text-white font-bold hover:text-red-200 transition">SALIR</button>
      </div>
    </div>
  </nav>

  <script>
    function cerrarSesion() {
        localStorage.clear();
        sessionStorage.clear();
        window.location.href = '/login.html';
    }
  </script>

  <main class="w-full px-6 md:px-10 mt-6 px-4 pb-10 space-y-3">
    <!-- Filtros -->
    <div class="bg-white p-4 rounded-2xl shadow-sm border border-slate-100 mb-6 flex flex-col sm:flex-row gap-4 items-end">
        <div class="w-full sm:w-1/3">
            <label class="text-[10px] font-bold text-slate-400 uppercase tracking-widest block mb-1">Tipo</label>
            <select id="filtro-tipo" class="w-full text-xs px-3 py-2 bg-slate-50 border border-slate-200 rounded-lg outline-none focus:border-orange-500">
                <option value="">Todos</option>
                <option value="RESERVA_ESTADO">Reservas</option>
                <option value="PROMOCION_NUEVA">Promociones</option>
                <option value="ALERTA_PROXIMIDAD">Cercanía</option>
                <option value="PQRS_RESPUESTA">PQRS</option>
            </select>
        </div>
        <div class="w-full sm:w-1/3">
            <label class="text-[10px] font-bold text-slate-400 uppercase tracking-widest block mb-1">Estado</label>
            <select id="filtro-leida" class="w-full text-xs px-3 py-2 bg-slate-50 border border-slate-200 rounded-lg outline-none focus:border-orange-500">
                <option value="">Todas</option>
                <option value="false">No Leídas</option>
                <option value="true">Leídas</option>
            </select>
        </div>
        <div class="w-full sm:w-auto">
            <button onclick="cargarNotificaciones()" class="w-full sm:w-auto bg-orange-500 text-white font-black text-[10px] uppercase tracking-widest px-4 py-2.5 rounded-lg hover:bg-orange-600 shadow-md">Aplicar Filtros</button>
        </div>
    </div>

    <div id="lista-notificaciones" class="space-y-3">
      <p class="text-center text-orange-500 font-bold mt-10 animate-pulse">Cargando buzón...</p>
    </div>
  </main>

  <script>
    document.addEventListener("DOMContentLoaded", () => cargarNotificaciones());

    async function cargarNotificaciones() {
        const lista = document.getElementById('lista-notificaciones');
        const filtroTipo = document.getElementById('filtro-tipo').value;
        const filtroLeida = document.getElementById('filtro-leida').value;
        
        lista.innerHTML = '<p class="text-center text-orange-500 font-bold mt-10 animate-pulse">Cargando buzón...</p>';
        
        try {
            const params = new URLSearchParams({ size: 100 });
            if (filtroTipo) params.append('tipo', filtroTipo);
            if (filtroLeida) params.append('leida', filtroLeida);

            const res = await fetch(`http://localhost:8080/api/notificaciones/paginado?${params}`, {
                headers: { 'Authorization': `Bearer ${token}` }
            });
            if (res.ok) {
                const data = await res.json();
                const notificaciones = data.content || data || [];
                if (notificaciones.length === 0) {
                    lista.innerHTML = '<p class="text-center text-slate-400 font-bold p-8">No tienes notificaciones con estos filtros.</p>';
                    return;
                }

                lista.innerHTML = '';
                notificaciones.forEach(n => {
                    const estilo = n.leida ? 'opacity-60 border-slate-100 bg-slate-50' : 'border-l-4 border-orange-500 bg-white shadow-sm';
                    const bgIcon = obtenerIcono(n.tipo);
                    
                    lista.innerHTML += `
                        <div onclick="marcarLeida(${n.id})" class="p-5 rounded-2xl border flex items-start gap-4 cursor-pointer hover:bg-slate-50 transition ${estilo}">
                            <div class="w-10 h-10 rounded-full ${bgIcon.bg} flex items-center justify-center text-xl shrink-0">${bgIcon.emoji}</div>
                            <div class="flex-1">
                                <h4 class="font-black text-slate-800 text-sm">${n.titulo}</h4>
                                <p class="text-xs text-slate-600 mt-1 leading-relaxed">${n.mensaje}</p>
                                <span class="text-[10px] font-bold text-slate-400 mt-2 block">${formatearFecha(n.createdAt)}</span>
                            </div>
                            ${!n.leida ? '<div class="w-2 h-2 bg-orange-500 rounded-full mt-2"></div>' : ''}
                        </div>
                    `;
                });
            }
        } catch (e) { lista.innerHTML = '<p class="text-center text-red-500 font-bold p-8">Error al cargar alertas.</p>'; }
    }

    function obtenerIcono(tipo) {
        switch(tipo) {
            case 'RESERVA_ESTADO': return { emoji: '✅', bg: 'bg-emerald-100' };
            case 'PROMOCION_NUEVA': return { emoji: '🎟️', bg: 'bg-orange-100' };
            case 'ALERTA_PROXIMIDAD': return { emoji: '📍', bg: 'bg-amber-100' };
            case 'PQRS_RESPUESTA': return { emoji: '✉️', bg: 'bg-blue-100' };
            default: return { emoji: '🔔', bg: 'bg-slate-200' };
        }
    }

    function formatearFecha(fechaString) {
        if(!fechaString) return 'Reciente';
        const fecha = new Date(fechaString);
        return fecha.toLocaleDateString('es-ES', { day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit' });
    }

    async function marcarLeida(id) {
        try {
            await fetch(`http://localhost:8080/api/notificaciones/${id}/leer`, {
                method: 'PUT',
                headers: { 'Authorization': `Bearer ${token}` }
            });
            cargarNotificaciones();
        } catch (e) {}
    }

    async function marcarTodasLeidas() {
        if(!confirm("¿Deseas marcar todas las notificaciones como leídas?")) return;
        try {
            await fetch(`http://localhost:8080/api/notificaciones/leer-todas`, {
                method: 'PUT',
                headers: { 'Authorization': `Bearer ${token}` }
            });
            cargarNotificaciones();
        } catch (e) { alert("Error de red."); }
    }
  </script>
<script>
    async function checkNotificacionesBadge() {
        try {
            const res = await fetch('http://localhost:8080/api/notificaciones/contador', { headers: { 'Authorization': 'Bearer ' + token } });
            if(res.ok) {
                const data = await res.json();
                if(data.noLeidas > 0) {
                    document.getElementById('notif-badge')?.classList.remove('hidden');
                }
            }
        } catch(e) {}
    }
    checkNotificacionesBadge();
</script>
</body>
</html>
