<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Notificaciones | BudgetMap</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    const token = localStorage.getItem('jwt_token');
    if (!token) window.location.href = '/login.html';
  </script>
</head>
<body class="bg-slate-50 min-h-screen font-sans">

  <nav class="bg-gradient-to-r from-orange-500 to-amber-500 p-4 shadow-md text-white sticky top-0 z-50">
    <div class="max-w-3xl mx-auto flex justify-between items-center">
      <button onclick="location.href='dashboard.html'" class="font-bold text-sm tracking-widest uppercase hover:text-amber-200">⬅️ Radar</button>
      <span class="font-black tracking-widest text-lg uppercase">Notificaciones</span>
      <button onclick="marcarTodasLeidas()" class="text-[9px] bg-white/20 hover:bg-white/30 px-3 py-1.5 rounded-full font-bold uppercase tracking-widest transition backdrop-blur-sm">
        Limpiar
      </button>
    </div>
  </nav>

  <main class="max-w-3xl mx-auto mt-6 px-4 pb-10 space-y-3" id="lista-notificaciones">
    <p class="text-center text-orange-500 font-bold mt-10 animate-pulse">Cargando buzón...</p>
  </main>

  <script>
    document.addEventListener("DOMContentLoaded", () => cargarNotificaciones());

    async function cargarNotificaciones() {
        const lista = document.getElementById('lista-notificaciones');
        try {
            const res = await fetch('http://localhost:8080/api/notificaciones/mis-notificaciones', {
                headers: { 'Authorization': `Bearer ${token}` }
            });
            if (res.ok) {
                const notificaciones = await res.json();
                if (notificaciones.length === 0) {
                    lista.innerHTML = '<p class="text-center text-slate-400 font-bold p-8">No tienes notificaciones nuevas.</p>';
                    return;
                }

                lista.innerHTML = '';
                notificaciones.forEach(n => {
                    const estilo = n.leida ? 'opacity-60 border-slate-100 bg-slate-50' : 'border-l-4 border-orange-500 bg-white shadow-sm';
                    const bgIcon = obtenerIcono(n.tipo);
                    
                    lista.innerHTML += `
                        <div onclick="marcarLeida(${n.id})" class="p-5 rounded-2xl border flex items-start gap-4 cursor-pointer hover:bg-slate-50 transition ${estilo}">
                            <div class="w-10 h-10 rounded-full ${bgIcon.bg} flex items-center justify-center text-xl shrink-0">${bgIcon.emoji}</div>
                            <div class="flex-1">
                                <h4 class="font-black text-slate-800 text-sm">${n.titulo}</h4>
                                <p class="text-xs text-slate-600 mt-1 leading-relaxed">${n.mensaje}</p>
                                <span class="text-[10px] font-bold text-slate-400 mt-2 block">${formatearFecha(n.createdAt)}</span>
                            </div>
                            ${!n.leida ? '<div class="w-2 h-2 bg-orange-500 rounded-full mt-2"></div>' : ''}
                        </div>
                    `;
                });
            }
        } catch (e) { lista.innerHTML = '<p class="text-center text-red-500 font-bold p-8">Error al cargar alertas.</p>'; }
    }

    function obtenerIcono(tipo) {
        switch(tipo) {
            case 'RESERVA_ESTADO': return { emoji: '✅', bg: 'bg-emerald-100' };
            case 'PROMOCION_NUEVA': return { emoji: '🎟️', bg: 'bg-orange-100' };
            case 'ALERTA_PROXIMIDAD': return { emoji: '📍', bg: 'bg-amber-100' };
            case 'PQRS_RESPUESTA': return { emoji: '✉️', bg: 'bg-blue-100' };
            default: return { emoji: '🔔', bg: 'bg-slate-200' };
        }
    }

    function formatearFecha(fechaString) {
        if(!fechaString) return 'Reciente';
        const fecha = new Date(fechaString);
        return fecha.toLocaleDateString('es-ES', { day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit' });
    }

    async function marcarLeida(id) {
        try {
            await fetch(`http://localhost:8080/api/notificaciones/${id}/leer`, {
                method: 'PUT',
                headers: { 'Authorization': `Bearer ${token}` }
            });
            cargarNotificaciones();
        } catch (e) {}
    }

    async function marcarTodasLeidas() {
        if(!confirm("¿Deseas marcar todas las notificaciones como leídas?")) return;
        try {
            await fetch(`http://localhost:8080/api/notificaciones/leer-todas`, {
                method: 'PUT',
                headers: { 'Authorization': `Bearer ${token}` }
            });
            cargarNotificaciones();
        } catch (e) { alert("Error de red."); }
    }
  </script>
</body>
</html>
