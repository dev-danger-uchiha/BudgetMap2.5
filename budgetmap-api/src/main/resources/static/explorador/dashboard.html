<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mi Radar | BudgetMap</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script>
    const token = localStorage.getItem('jwt_token');
    const rol = localStorage.getItem('user_rol');
    if (!token || (rol !== 'EXPLORADOR' && rol !== 'EXPLORADOR_PRO')) {
      window.location.href = '/login.html?denied=true';
    }
  </script>
  <style>
    .pulse { animation: pulse 2s infinite; }
    @keyframes pulse {
      0% { box-shadow: 0 0 0 0 rgba(249, 115, 22, 0.7); }
      70% { box-shadow: 0 0 0 15px rgba(249, 115, 22, 0); }
      100% { box-shadow: 0 0 0 0 rgba(249, 115, 22, 0); }
    }
  </style>
</head>
<body class="h-screen flex flex-col bg-slate-900 font-sans overflow-hidden">

  <nav class="bg-gradient-to-r from-orange-500 to-amber-500 shadow-lg z-50 relative">
    <div class="px-6 py-3 flex justify-between items-center text-white">
      <div class="flex items-center gap-3">
        <div class="relative bg-white rounded-full w-12 h-12 md:w-16 md:h-16 shadow-md ring-1 ring-black/5 flex items-center justify-center z-0 hidden sm:flex"><img src="/images/logo.png" alt="Logo BudgetMap" class="absolute w-16 h-16 md:w-24 md:h-24 max-w-none object-contain transform transition duration-500 hover:scale-110 top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 z-40 drop-shadow-xl" /></div>
        <span class="text-xl font-black tracking-widest drop-shadow-md"><a href="/index.html" class="hover:text-emerald-600 transition">BUDGETMAP</a></span>
      </div>

      <div class="flex items-center gap-4">
        <div class="text-right hidden sm:block">
          <div class="flex items-center justify-end gap-2">
            <p id="user-name-display" class="text-sm font-black uppercase tracking-widest drop-shadow-sm">Cargando...</p>
            <span id="badge-pro" class="hidden bg-slate-900 text-amber-400 text-[9px] font-black px-2 py-0.5 rounded uppercase tracking-widest border border-amber-400/50">PRO</span>
          </div>
          <p class="text-xs text-amber-100 font-bold mt-0.5 flex items-center justify-end gap-1">
            <span id="user-points" class="bg-amber-600/50 px-2 py-0.5 rounded-full">🪙 0 Puntos</span>
          </p>
        </div>
        
        <div class="relative">
          <button onclick="toggleMenu(event)" class="w-10 h-10 bg-white rounded-full flex items-center justify-center text-orange-600 font-black shadow-lg border-2 border-amber-200 hover:scale-105 transition overflow-hidden">
            <img id="nav-profile-img" src="" class="w-full h-full object-cover hidden">
            <span id="user-initial">U</span>
          </button>
          <span id="notif-badge" class="hidden absolute top-0 right-0 w-3.5 h-3.5 bg-red-500 border-2 border-white rounded-full animate-pulse"></span>
          <div id="profile-menu" class="absolute right-0 mt-2 w-56 bg-white rounded-2xl shadow-2xl py-2 hidden border border-slate-100 transform origin-top-right transition-all">
            <a href="perfil.html" class="block px-5 py-3 text-sm font-bold text-slate-700 hover:bg-orange-50 hover:text-orange-600">⚙️ Mi Perfil y Radar</a>
            <a href="mis-reservas.html" class="block px-5 py-3 text-sm font-bold text-slate-700 hover:bg-orange-50 hover:text-orange-600">🎫 Mis Reservas</a>
            <a href="notificaciones.html" class="block px-5 py-3 text-sm font-bold text-slate-700 hover:bg-orange-50 hover:text-orange-600">🔔 Notificaciones</a>
            <hr class="my-2 border-slate-100">
            <button onclick="cerrarSesion()" class="w-full text-left px-5 py-3 text-sm font-black text-red-500 hover:bg-red-50">🚪 Cerrar Sesión</button>
          </div>
        </div>
      </div>
    </div>
  </nav>

  <div class="flex flex-col lg:flex-row flex-1 h-full relative overflow-y-auto lg:overflow-hidden">
    
    <!-- PANEL IZQUIERDO: LUGARES -->
    <div class="w-full lg:w-60 shrink-0 h-[45vh] lg:h-full bg-slate-900/95 backdrop-blur shadow-xl border-b lg:border-b-0 lg:border-r border-slate-700 flex flex-col z-10 order-2 lg:order-1">
      <div class="p-4 border-b border-slate-800 flex justify-between items-center">
        <h2 class="text-white font-black text-sm uppercase tracking-widest flex items-center gap-2">📍 Lugares Públicos</h2>
      </div>
      <div id="lista-lugares" class="flex-1 overflow-y-auto p-4 space-y-4 custom-scroll">
         <p class="text-xs text-slate-500 text-center mt-10">Cargando lugares...</p>
      </div>
    </div>

    <!-- CENTRO: MAPA Y EVENTOS -->
    <div class="w-full lg:flex-1 min-w-0 flex flex-col relative z-0 order-1 lg:order-2">
      
      <!-- MAPA CONTENEDOR -->
      <div class="h-[45vh] lg:h-auto lg:flex-1 relative z-0 shrink-0 lg:shrink w-full">
          <!-- MAPA -->
          <div id="mapa-radar" class="absolute inset-0 z-0"></div>
          
          <!-- CONTROLES DE FILTRO FLOTANTES -->
          <div class="absolute top-4 right-4 z-[1000] bg-white/95 backdrop-blur-md p-4 rounded-2xl shadow-xl border border-slate-200 flex flex-col gap-3 min-w-[220px]">
             <h3 class="text-[10px] font-black uppercase text-slate-800 tracking-widest flex justify-between items-center mb-1">
                Filtros
             </h3>
             <label class="flex items-center gap-2 cursor-pointer group mt-1">
                 <input type="checkbox" id="filter-destacados" class="w-4 h-4 rounded text-orange-500 focus:ring-orange-500 cursor-pointer" onchange="aplicarFiltros()">
                 <span class="text-xs font-bold text-slate-700 group-hover:text-orange-600 transition">⭐ Solo Destacados</span>
             </label>
             <div class="mt-1">
                 <input type="text" id="filter-nombre" placeholder="🔍 Buscar por nombre..." 
                        class="w-full text-xs px-3 py-2 border border-slate-200 rounded-lg focus:outline-none focus:border-orange-500 focus:ring-1 focus:ring-orange-500 bg-white" 
                        onkeyup="aplicarFiltros()">
             </div>
          </div>
      </div>
      
      <!-- PANEL INFERIOR: EVENTOS -->
      <div class="h-48 shrink-0 bg-slate-900/95 backdrop-blur shadow-[0_-10px_20px_rgba(0,0,0,0.5)] border-t border-slate-700 flex flex-col z-10 relative">
        <div class="p-3 border-b border-slate-800 flex justify-between items-center">
          <h2 class="text-white font-black text-sm uppercase tracking-widest flex items-center gap-2">🎟️ Eventos</h2>
        </div>
        <div id="lista-eventos" class="flex flex-1 overflow-x-auto p-4 gap-4 custom-scroll pb-6">
           <p class="text-xs text-slate-500 w-full text-center">Cargando eventos...</p>
        </div>
      </div>
    </div>

    <!-- PANEL DERECHO: ESTABLECIMIENTOS -->
    <div class="w-full lg:w-60 shrink-0 h-[45vh] lg:h-full bg-slate-900/95 backdrop-blur shadow-[-10px_0_20px_rgba(0,0,0,0.5)] border-t lg:border-t-0 lg:border-l border-slate-700 flex flex-col z-10 order-3">
      <div class="p-4 border-b border-slate-800 flex justify-between items-center">
        <h2 class="text-white font-black text-sm uppercase tracking-widest flex items-center gap-2">🍔 Establecimientos</h2>
      </div>
      <div id="lista-establecimientos" class="flex-1 overflow-y-auto p-4 space-y-4 custom-scroll">
         <p class="text-xs text-slate-500 text-center mt-10">Cargando establecimientos...</p>
      </div>
    </div>

  </div>

  <style>
    .custom-scroll::-webkit-scrollbar { width: 6px; height: 6px; }
    .custom-scroll::-webkit-scrollbar-track { background: transparent; }
    .custom-scroll::-webkit-scrollbar-thumb { background: #334155; border-radius: 10px; }
    .custom-scroll::-webkit-scrollbar-thumb:hover { background: #475569; }
  </style>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script>
    if (!token) window.location.href = '/login.html';

    let mapa;
    let layerGroup;
    let radarCircle;
    let todosLosPuntos = [];
    let userLocation = L.latLng(4.6097, -74.0817);
    let userRadioMetros = 2000;
    
    let allLugares = [];
    let allEstablecimientos = [];
    let allEventos = [];

    function aplicarFiltros() {
        const soloDestacados = document.getElementById('filter-destacados').checked;
        const textoFiltro = document.getElementById('filter-nombre') ? document.getElementById('filter-nombre').value.toLowerCase().trim() : '';
        
        const filtrarData = (items, isEvento) => {
            return items.filter(item => {
                if (soloDestacados && !item.destacado) return false;
                if (textoFiltro && item.nombre && !item.nombre.toLowerCase().includes(textoFiltro)) return false;
                
                let lat, lng;
                if (isEvento) {
                    if (item.lugarId) {
                        const lugar = allLugares.find(l => l.id === item.lugarId);
                        if (lugar) { lat = lugar.latitud; lng = lugar.longitud; }
                    } else if (item.establecimientoId) {
                        const est = allEstablecimientos.find(e => e.id === item.establecimientoId);
                        if (est) { lat = est.latitud; lng = est.longitud; }
                    }
                } else {
                    lat = item.latitud;
                    lng = item.longitud;
                }
                
                if (!lat || !lng) return false;
                
                item._lat = lat;
                item._lng = lng;

                return userLocation.distanceTo(L.latLng(lat, lng)) <= userRadioMetros;
            });
        };

        const lugaresFiltrados = filtrarData(allLugares, false);
        const establecimientosFiltrados = filtrarData(allEstablecimientos, false);
        const eventosFiltrados = filtrarData(allEventos, true);

        todosLosPuntos = [];
        layerGroup.clearLayers();
        
        renderLugares(lugaresFiltrados);
        renderEstablecimientos(establecimientosFiltrados);
        renderEventos(eventosFiltrados);

        agregarAlMapa(lugaresFiltrados, 'LUGAR', 'bg-blue-500', 'text-blue-600');
        agregarAlMapa(establecimientosFiltrados, 'ESTABLECIMIENTO', 'bg-amber-500', 'text-amber-600');
        agregarAlMapa(eventosFiltrados, 'EVENTO', 'bg-purple-500', 'text-purple-600');
    }

    function toggleMenu(event) {
        event.stopPropagation();
        document.getElementById('profile-menu').classList.toggle('hidden');
    }

    document.addEventListener('click', (event) => {
        const menu = document.getElementById('profile-menu');
        if (menu && !menu.classList.contains('hidden') && !event.target.closest('.relative')) {
            menu.classList.add('hidden');
        }
    });

    document.addEventListener("DOMContentLoaded", async () => {
      const nombre = localStorage.getItem('user_nombre') || 'Explorador';
      document.getElementById('user-name-display').textContent = nombre;
      document.getElementById('user-initial').textContent = nombre.charAt(0).toUpperCase();
      
      const eventosContainer = document.getElementById('lista-eventos');
      eventosContainer.addEventListener('wheel', (evt) => {
          if (evt.deltaY !== 0) {
              evt.preventDefault();
              eventosContainer.scrollLeft += evt.deltaY;
          }
      });

      try {
          const res = await fetch('https://budgetmap-api.onrender.com/api/perfil', { headers: { 'Authorization': `Bearer ${token}` }});
          if(res.ok) {
              const user = await res.json();
              document.getElementById('user-points').innerHTML = `🪙 ${user.puntosAcumulados || 0} Puntos`;
              if(user.planId || user.plan) document.getElementById('badge-pro').classList.remove('hidden');
              document.getElementById('user-name-display').innerText = user.nombre || 'Explorador';
              if(user.avatarUrl) {
                  document.getElementById('nav-profile-img').src = user.avatarUrl;
                  document.getElementById('nav-profile-img').classList.remove('hidden');
                  document.getElementById('user-initial').classList.add('hidden');
              } else {
                  document.getElementById('user-initial').innerText = (user.nombre || 'U').charAt(0).toUpperCase();
              }
          }
      } catch(e) { console.error("Error al cargar datos del usuario"); }

      iniciarMapa();
      cargarRadar();
    });

    function iniciarMapa() {
      mapa = L.map('mapa-radar', { zoomControl: false }).setView(userLocation, 14);
      L.tileLayer('https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}{r}.png').addTo(mapa);
      layerGroup = L.layerGroup().addTo(mapa);
      
      const userIcon = L.divIcon({
        className: 'custom-div-icon',
        html: `<div class="bg-orange-500 w-6 h-6 rounded-full border-4 border-white pulse shadow-xl"></div>`,
        iconSize: [24, 24],
        iconAnchor: [12, 12]
      });
      L.marker(userLocation, { icon: userIcon }).addTo(mapa).bindPopup("<b class='text-orange-600 uppercase tracking-widest text-[10px]'>Tú estás aquí</b>");
    }

    function ordenarData(arr) {
        return arr.sort((a, b) => {
            if (a.destacado && !b.destacado) return -1;
            if (!a.destacado && b.destacado) return 1;
            if (a.verificado && !b.verificado) return -1;
            if (!a.verificado && b.verificado) return 1;
            return 0;
        });
    }

    async function cargarRadar() {
      try {
        const [resLugares, resEst, resEv, resConfig] = await Promise.all([
            fetch('https://budgetmap-api.onrender.com/api/lugares/aprobados', { headers: { 'Authorization': `Bearer ${token}` }}),
            fetch('https://budgetmap-api.onrender.com/api/establecimientos/aprobados', { headers: { 'Authorization': `Bearer ${token}` }}),
            fetch('https://budgetmap-api.onrender.com/api/eventos', { headers: { 'Authorization': `Bearer ${token}` }}),
            fetch('https://budgetmap-api.onrender.com/api/config-alertas/mi-radar', { headers: { 'Authorization': `Bearer ${token}` }})
        ]);

        if (resConfig.ok) {
            const config = await resConfig.json();
            userRadioMetros = config.radioMetros || 2000;
        }

        radarCircle = L.circle(userLocation, {
            color: '#f97316',
            fillColor: '#f97316',
            fillOpacity: 0.08,
            radius: userRadioMetros,
            weight: 2,
            dashArray: '5, 5'
        }).addTo(mapa);

        if (resLugares.ok) { const d = await resLugares.json(); allLugares = ordenarData(d.content || d); }
        if (resEst.ok) { const d = await resEst.json(); allEstablecimientos = ordenarData(d.content || d); }
        if (resEv.ok) { const d = await resEv.json(); allEventos = ordenarData(d.content || d); }

        aplicarFiltros();
        
      } catch (error) {
        console.error("Error al cargar radar:", error);
      }
    }

    function agregarAlMapa(arr, tipo, colorBg, colorTexto) {
        arr.forEach(item => {
            todosLosPuntos.push({ data: item, tipo: tipo });
            const lat = item._lat || item.latitud;
            const lng = item._lng || item.longitud;
            const url = `/explorador/detalle.html?id=${item.id}&tipo=${tipo.toLowerCase()}`;
            crearMarcadorMapa(lat, lng, item.nombre, tipo, colorBg, colorTexto, url);
        });
    }

    function renderLugares(arr) {
        const div = document.getElementById('lista-lugares');
        if(!arr.length) { div.innerHTML = '<p class="text-xs text-slate-500 text-center">No hay lugares públicos disponibles</p>'; return; }
        div.innerHTML = arr.map(l => createCard(l, 'LUGAR')).join('');
    }

    function renderEstablecimientos(arr) {
        const div = document.getElementById('lista-establecimientos');
        if(!arr.length) { div.innerHTML = '<p class="text-xs text-slate-500 text-center">No hay establecimientos disponibles</p>'; return; }
        div.innerHTML = arr.map(e => createCard(e, 'ESTABLECIMIENTO')).join('');
    }

    function renderEventos(arr) {
        const div = document.getElementById('lista-eventos');
        if(!arr.length) { div.innerHTML = '<p class="text-xs text-slate-500 text-center w-full">No hay eventos disponibles</p>'; return; }
        div.innerHTML = arr.map(e => createCard(e, 'EVENTO', true)).join('');
    }

    function createCard(item, tipo, horizontal = false) {
        const isDestacado = item.destacado ? `<span class="bg-amber-500/20 text-amber-500 border border-amber-500/50 text-[9px] px-1.5 py-0.5 rounded-full font-black uppercase">⭐ Destacado</span>` : '';
        const isVerificado = item.verificado ? `<span class="bg-blue-500/20 text-blue-400 border border-blue-500/50 text-[9px] px-1.5 py-0.5 rounded-full font-black uppercase">✔️ Verificado</span>` : '';
        const stateTag = tipo === 'EVENTO' ? `<span class="bg-slate-800 text-slate-300 text-[9px] px-1.5 py-0.5 rounded uppercase font-black">${item.estadoEvento || 'ACTIVA'}</span>` : '';
        const wClass = horizontal ? 'w-64 flex-shrink-0' : 'w-full';
        const url = `/explorador/detalle.html?id=${item.id}&tipo=${tipo.toLowerCase()}`;

        return `
            <a href="${url}" class="block ${wClass} bg-slate-800/80 hover:bg-slate-800 border border-slate-700 rounded-xl p-3 shadow-sm hover:shadow-orange-500/20 hover:border-orange-500/50 transition-all group">
                <div class="w-full h-24 bg-slate-700 rounded-lg mb-3 overflow-hidden">
                    <img src="${item.imagenUrl || 'https://images.unsplash.com/photo-1517248135467-4c7edcad34c4?w=500&q=80'}" class="w-full h-full object-cover group-hover:scale-110 transition-transform duration-500">
                </div>
                <div class="flex gap-1 flex-wrap mb-2">${isDestacado}${isVerificado}${stateTag}</div>
                <h3 class="text-white font-bold text-sm truncate">${item.nombre}</h3>
                <p class="text-xs text-slate-400 mt-1 truncate">${item.descripcion || 'Sin descripción'}</p>
            </a>
        `;
    }

    function crearMarcadorMapa(lat, lng, nombre, tipo, colorBg, colorTexto, url) {
      if (!lat || !lng) return;
      const markerIcon = L.divIcon({
        className: 'custom-icon',
        html: `<div class="w-5 h-5 rounded-full border-2 border-white shadow-lg ${colorBg} hover:scale-125 transition-transform"></div>`,
        iconSize: [20, 20],
        iconAnchor: [10, 10]
      });

      L.marker([lat, lng], { icon: markerIcon }).addTo(layerGroup)
        .bindPopup(`
          <div class="text-center p-1">
            <b class="text-slate-800 uppercase tracking-tight ${colorTexto}">${nombre}</b><br>
            <span class="text-[9px] font-bold text-slate-500 uppercase">${tipo}</span><br>
            <a href="${url}" class="inline-block mt-2 bg-slate-900 text-white px-3 py-1.5 rounded-lg text-[10px] font-black uppercase tracking-widest w-full hover:bg-orange-500 transition">Ver Detalles</a>
          </div>
        `);
    }

    function cerrarSesion() {
        localStorage.clear();
        sessionStorage.clear();
        window.location.href = '/login.html';
    }
  </script>
<script>
    async function checkNotificacionesBadge() {
        try {
            const res = await fetch('https://budgetmap-api.onrender.com/api/notificaciones/contador', { headers: { 'Authorization': 'Bearer ' + token } });
            if(res.ok) {
                const data = await res.json();
                if(data.noLeidas > 0) {
                    document.getElementById('notif-badge')?.classList.remove('hidden');
                }
            }
        } catch(e) {}
    }
    checkNotificacionesBadge();
</script>
</body>
</html>
