<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mi Radar | BudgetMap</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script>
    const token = localStorage.getItem('jwt_token');
    const rol = localStorage.getItem('user_rol');
    if (!token || rol !== 'EXPLORADOR') {
      window.location.href = '/login.html?denied=true';
    }
  </script>
  <style>
    .pulse { animation: pulse 2s infinite; }
    @keyframes pulse {
      0% { box-shadow: 0 0 0 0 rgba(249, 115, 22, 0.7); }
      70% { box-shadow: 0 0 0 15px rgba(249, 115, 22, 0); }
      100% { box-shadow: 0 0 0 0 rgba(249, 115, 22, 0); }
    }
  </style>
</head>
<body class="h-screen flex flex-col bg-slate-900 font-sans overflow-hidden">

  <nav class="bg-gradient-to-r from-orange-500 to-amber-500 shadow-lg z-50 relative">
    <div class="px-6 py-3 flex justify-between items-center text-white">
      <div class="flex items-center gap-3">
        <div class="bg-white/20 backdrop-blur-md rounded-xl p-2 shadow-inner">
          <svg class="w-6 h-6 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 20l-5.447-2.724A1 1 0 013 16.382V5.618a1 1 0 011.447-.894L9 7m0 13l6-3m-6 3V7m6 10l4.553 2.276A1 1 0 0021 18.382V7.618a1 1 0 00-.553-.894L15 4m0 13V4m0 0L9 7"></path></svg>
        </div>
        <span class="text-xl font-black tracking-widest drop-shadow-md">BUDGETMAP</span>
      </div>

      <div class="flex items-center gap-4">
        <div class="text-right hidden sm:block">
          <div class="flex items-center justify-end gap-2">
            <p id="user-name-display" class="text-sm font-black uppercase tracking-widest drop-shadow-sm">Cargando...</p>
            <span id="badge-pro" class="hidden bg-slate-900 text-amber-400 text-[9px] font-black px-2 py-0.5 rounded uppercase tracking-widest border border-amber-400/50">PRO</span>
          </div>
          <p class="text-xs text-amber-100 font-bold mt-0.5 flex items-center justify-end gap-1">
            <span id="user-points" class="bg-amber-600/50 px-2 py-0.5 rounded-full">🪙 0 Puntos</span>
          </p>
        </div>
        
        <div class="relative group">
          <button class="w-10 h-10 bg-white rounded-full flex items-center justify-center text-orange-600 font-black shadow-lg border-2 border-amber-200 hover:scale-105 transition">
            <span id="user-initial">U</span>
          </button>
          <div class="absolute right-0 mt-2 w-56 bg-white rounded-2xl shadow-2xl py-2 hidden group-hover:block border border-slate-100 transform origin-top-right transition-all">
            <a href="perfil.html" class="block px-5 py-3 text-sm font-bold text-slate-700 hover:bg-orange-50 hover:text-orange-600">⚙️ Mi Perfil y Radar</a>
            <a href="mis-reservas.html" class="block px-5 py-3 text-sm font-bold text-slate-700 hover:bg-orange-50 hover:text-orange-600">🎫 Mis Reservas</a>
            <a href="notificaciones.html" class="block px-5 py-3 text-sm font-bold text-slate-700 hover:bg-orange-50 hover:text-orange-600">🔔 Notificaciones</a>
            <hr class="my-2 border-slate-100">
            <button onclick="cerrarSesion()" class="w-full text-left px-5 py-3 text-sm font-black text-red-500 hover:bg-red-50">🚪 Cerrar Sesión</button>
          </div>
        </div>
      </div>
    </div>
  </nav>

  <div class="flex flex-1 h-full relative">
    <div id="mapa-radar" class="absolute inset-0 z-0"></div>

    <div class="absolute bottom-6 left-4 right-4 md:left-1/2 md:-translate-x-1/2 md:w-auto z-40 flex justify-center gap-3">
        <button onclick="filtrarMapa('TODOS')" class="bg-slate-900/90 backdrop-blur-md text-white px-6 py-3 rounded-full text-xs font-black uppercase tracking-widest shadow-xl border border-slate-700 hover:bg-orange-500 transition">🌐 Todo</button>
        <button onclick="filtrarMapa('ESTABLECIMIENTOS')" class="bg-slate-900/90 backdrop-blur-md text-white px-6 py-3 rounded-full text-xs font-black uppercase tracking-widest shadow-xl border border-slate-700 hover:bg-amber-500 transition">🍔 Locales</button>
        <button onclick="filtrarMapa('EVENTOS')" class="bg-slate-900/90 backdrop-blur-md text-white px-6 py-3 rounded-full text-xs font-black uppercase tracking-widest shadow-xl border border-slate-700 hover:bg-purple-500 transition">🎟️ Eventos</button>
    </div>
  </div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script>
    let mapa;
    let layerGroup;
    let todosLosPuntos = [];

    document.addEventListener("DOMContentLoaded", async () => {
      const nombre = localStorage.getItem('user_nombre') || 'Explorador';
      document.getElementById('user-name-display').textContent = nombre;
      document.getElementById('user-initial').textContent = nombre.charAt(0).toUpperCase();
      
      try {
          const res = await fetch('http://localhost:8080/api/usuarios/me', { headers: { 'Authorization': `Bearer ${token}` }});
          if(res.ok) {
              const user = await res.json();
              document.getElementById('user-points').innerHTML = `🪙 ${user.puntosAcumulados || 0} Puntos`;
              if(user.planId) document.getElementById('badge-pro').classList.remove('hidden');
          }
      } catch(e) { console.error("Error al cargar datos del usuario"); }

      iniciarMapa();
      cargarRadar();
    });

    function iniciarMapa() {
      mapa = L.map('mapa-radar', { zoomControl: false }).setView([4.6097, -74.0817], 14);
      L.tileLayer('https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}{r}.png').addTo(mapa);
      layerGroup = L.layerGroup().addTo(mapa);
      
      const userIcon = L.divIcon({
        className: 'custom-div-icon',
        html: `<div class="bg-orange-500 w-6 h-6 rounded-full border-4 border-white pulse"></div>`,
        iconSize: [24, 24]
      });
      L.marker([4.6097, -74.0817], { icon: userIcon }).addTo(mapa).bindPopup("<b class='text-orange-600'>Tu ubicación</b>");
    }

    async function cargarRadar() {
      try {
        const urlEst = 'http://localhost:8080/api/establecimientos/aprobados';
        const resEst = await fetch(urlEst, { headers: { 'Authorization': `Bearer ${token}` }});
        if (resEst.ok) {
          const establecimientos = await resEst.json();
          establecimientos.forEach(est => {
             todosLosPuntos.push({ data: est, tipo: 'ESTABLECIMIENTO' });
          });
        }

        const urlEv = 'http://localhost:8080/api/eventos/activos';
        const resEv = await fetch(urlEv, { headers: { 'Authorization': `Bearer ${token}` }});
        if (resEv.ok) {
          const eventos = await resEv.json();
          eventos.forEach(ev => {
             todosLosPuntos.push({ data: ev, tipo: 'EVENTO' });
          });
        }
        
        filtrarMapa('TODOS');
      } catch (error) {
        console.error("Error al cargar radar:", error);
      }
    }

    function filtrarMapa(filtro) {
        layerGroup.clearLayers();
        todosLosPuntos.forEach(punto => {
            if (filtro === 'TODOS' || punto.tipo === filtro) {
                const colorBg = punto.tipo === 'ESTABLECIMIENTO' ? 'bg-amber-500' : 'bg-purple-500';
                const colorTexto = punto.tipo === 'ESTABLECIMIENTO' ? 'text-amber-600' : 'text-purple-600';
                const lat = punto.tipo === 'ESTABLECIMIENTO' ? punto.data.latitud : (punto.data.lugar ? punto.data.lugar.latitud : 4.6097);
                const lng = punto.tipo === 'ESTABLECIMIENTO' ? punto.data.longitud : (punto.data.lugar ? punto.data.lugar.longitud : -74.0817);
                const url = `/explorador/detalle.html?id=${punto.data.id}&tipo=${punto.tipo.toLowerCase()}`;
                
                crearMarcadorMapa(lat, lng, punto.data.nombre, punto.tipo, colorBg, colorTexto, url);
            }
        });
    }

    function crearMarcadorMapa(lat, lng, nombre, tipo, colorBg, colorTexto, url) {
      if (!lat || !lng) return;
      const markerIcon = L.divIcon({
        className: 'custom-icon',
        html: `<div class="w-5 h-5 rounded-full border-2 border-white shadow-lg ${colorBg}"></div>`,
        iconSize: [20, 20],
        iconAnchor: [10, 10]
      });

      L.marker([lat, lng], { icon: markerIcon }).addTo(layerGroup)
        .bindPopup(`
          <div class="text-center p-1">
            <b class="text-slate-800 uppercase tracking-tight ${colorTexto}">${nombre}</b><br>
            <span class="text-[9px] font-bold text-slate-500 uppercase">${tipo}</span><br>
            <a href="${url}" class="inline-block mt-2 bg-slate-900 text-white px-3 py-1.5 rounded-lg text-[10px] font-black uppercase tracking-widest w-full hover:bg-orange-500 transition">Ver Detalles</a>
          </div>
        `);
    }

    function cerrarSesion() {
        localStorage.clear();
        sessionStorage.clear();
        window.location.href = '/login.html';
    }
  </script>
</body>
</html>
