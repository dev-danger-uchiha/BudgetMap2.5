<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mi Perfil y Radar | BudgetMap</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    const token = localStorage.getItem('jwt_token');
    if (!token) window.location.href = '/login.html';
  </script>
</head>
<body class="bg-slate-50 min-h-screen pb-10 font-sans">

  <nav class="bg-gradient-to-r from-orange-500 to-amber-500 p-4 shadow-md text-white sticky top-0 z-50">
    <div class="max-w-3xl mx-auto flex justify-between items-center">
        <button onclick="location.href='dashboard.html'" class="font-bold text-sm tracking-widest uppercase hover:text-amber-200">⬅️ Radar</button>
        <span class="font-black tracking-widest uppercase text-lg">Mi Cuenta</span>
        <div class="w-10"></div>
    </div>
  </nav>

  <main class="max-w-3xl mx-auto mt-8 px-6 grid grid-cols-1 md:grid-cols-2 gap-8">

    <div class="bg-slate-900 rounded-3xl p-8 text-white shadow-xl relative overflow-hidden flex flex-col justify-between">
        <div class="absolute top-0 right-0 w-32 h-32 bg-orange-500 rounded-full blur-3xl opacity-20 pointer-events-none"></div>
        <div>
            <h3 class="font-black text-amber-400 uppercase tracking-widest text-[10px] mb-2">Tu Membresía Actual</h3>
            <div class="flex items-center gap-3 mb-6">
                <span id="plan-actual" class="text-4xl font-black italic tracking-tighter uppercase">FREE</span>
                <span id="saldo-puntos" class="bg-amber-500/20 text-amber-300 px-3 py-1 rounded-full text-xs font-bold border border-amber-500/30">0 Pts</span>
            </div>
            <ul class="text-xs text-slate-400 space-y-2 mb-8">
                <li class="flex items-center gap-2">✅ Radar estándar (2km)</li>
                <li class="flex items-center gap-2">✅ Reservas limitadas</li>
                <li class="flex items-center gap-2 text-slate-600">❌ Cupones exclusivos PRO</li>
                <li class="flex items-center gap-2 text-slate-600">❌ Experiencia sin Anuncios</li>
            </ul>
        </div>
        <button id="btn-upgrade-pro" onclick="iniciarPagoPro()" class="w-full bg-gradient-to-r from-orange-500 to-amber-500 text-white font-black py-4 rounded-xl text-xs uppercase tracking-widest hover:scale-[1.02] transition shadow-lg shadow-orange-500/30 disabled:opacity-50 disabled:cursor-not-allowed">
            Hacer Upgrade a PRO ⭐
        </button>
    </div>

    <div class="bg-white p-8 rounded-3xl border border-slate-100 shadow-sm flex flex-col justify-between">
        <div>
            <h3 class="font-black text-slate-800 uppercase tracking-tighter text-xl mb-6">Ajustes del Radar</h3>
            
            <div class="mb-6">
                <div class="flex justify-between items-center mb-2">
                    <label class="text-[10px] font-bold text-slate-400 uppercase tracking-widest">Alcance del Escáner</label>
                    <span id="radio-display" class="text-sm font-black text-orange-600">2000m</span>
                </div>
                <input type="range" id="radio-slider" min="500" max="5000" step="500" value="2000" class="w-full accent-orange-500">
                <p class="text-[9px] text-slate-400 mt-2">*Los usuarios PRO pueden ampliar el radar hasta 10km.</p>
            </div>

            <div class="space-y-4">
                <label class="flex items-center justify-between cursor-pointer">
                    <span class="text-sm font-bold text-slate-700">Notificar Promociones</span>
                    <input type="checkbox" id="check-promo" class="sr-only peer" checked>
                    <div class="w-11 h-6 bg-slate-200 peer-focus:outline-none rounded-full peer peer-checked:after:translate-x-full peer-checked:after:border-white after:content-[''] after:absolute after:top-[2px] after:left-[2px] after:bg-white after:border-gray-300 after:border after:rounded-full after:h-5 after:w-5 after:transition-all peer-checked:bg-orange-500 relative"></div>
                </label>
                <label class="flex items-center justify-between cursor-pointer">
                    <span class="text-sm font-bold text-slate-700">Notificar Eventos</span>
                    <input type="checkbox" id="check-evento" class="sr-only peer" checked>
                    <div class="w-11 h-6 bg-slate-200 peer-focus:outline-none rounded-full peer peer-checked:after:translate-x-full peer-checked:after:border-white after:content-[''] after:absolute after:top-[2px] after:left-[2px] after:bg-white after:border-gray-300 after:border after:rounded-full after:h-5 after:w-5 after:transition-all peer-checked:bg-orange-500 relative"></div>
                </label>
            </div>
        </div>
        <button id="btn-guardar-config" class="w-full mt-8 bg-slate-900 text-white font-black py-4 rounded-xl text-xs uppercase tracking-widest hover:bg-slate-800 transition shadow-md">
            Guardar Cambios
        </button>
    </div>
  </main>

  <script>
    document.addEventListener("DOMContentLoaded", async () => {
      try {
        const resUser = await fetch('http://localhost:8080/api/usuarios/me', { headers: { 'Authorization': `Bearer ${token}` }});
        if(resUser.ok) {
            const user = await resUser.json();
            document.getElementById('saldo-puntos').innerText = `${user.puntosAcumulados || 0} Pts`;
            if(user.planId) document.getElementById('plan-actual').innerText = 'PRO';
        }

        const resConfig = await fetch('http://localhost:8080/api/config-alertas/me', { headers: { 'Authorization': `Bearer ${token}` }});
        if (resConfig.ok) {
          const config = await resConfig.json();
          document.getElementById('radio-slider').value = config.radioMetros;
          document.getElementById('radio-display').textContent = `${config.radioMetros}m`;
          document.getElementById('check-promo').checked = config.notificarPromociones;
          document.getElementById('check-evento').checked = config.notificarEventos;
        }
      } catch (e) { console.error("Error cargando perfil", e); }
    });

    const slider = document.getElementById('radio-slider');
    const display = document.getElementById('radio-display');
    slider.addEventListener('input', () => display.textContent = `${slider.value}m`);

    document.getElementById('btn-guardar-config').addEventListener('click', async () => {
      const btn = document.getElementById('btn-guardar-config');
      btn.innerText = 'Guardando...';
      try {
        const response = await fetch(`http://localhost:8080/api/config-alertas/radio`, {
          method: 'PUT',
          headers: {
            'Authorization': `Bearer ${token}`,
            'Content-Type': 'application/json'
          },
          body: JSON.stringify({
            radioMetros: document.getElementById('radio-slider').value,
            notificarPromociones: document.getElementById('check-promo').checked,
            notificarEventos: document.getElementById('check-evento').checked
          })
        });

        if (response.ok) {
          alert("¡Configuración de Radar actualizada correctamente!");
        } else {
          alert("Error al actualizar la configuración.");
        }
      } catch (e) {
        alert("Error de conexión al servidor.");
      } finally {
        btn.innerText = 'GUARDAR CAMBIOS';
      }
    });

    async function iniciarPagoPro() {
        const btn = document.getElementById('btn-upgrade-pro');
        const originalText = btn.innerText;
        btn.innerText = 'PROCESANDO PAGO...';
        btn.disabled = true;

        try {
            const response = await fetch('http://localhost:8080/api/pasarela/test-link', {
                method: 'POST',
                headers: {
                    'Authorization': `Bearer ${token}`
                }
            });

            if (response.ok) {
                const data = await response.json();
                // Redirigir al usuario al link del Sandbox de Mercado Pago
                window.location.href = data.urlPago;
            } else {
                try {
                    const errorData = await response.json();
                    alert("Error en pasarela: " + (errorData.error || "Intenta de nuevo."));
                } catch (e) {
                    alert("No se pudo generar el enlace de pago. Revisa la consola del Backend.");
                }
                btn.innerText = originalText;
                btn.disabled = false;
            }
        } catch (error) {
            console.error("Error de conexión con la pasarela:", error);
            alert("Error de red al conectar con la pasarela de pagos.");
            btn.innerText = originalText;
            btn.disabled = false;
        }
    }
  </script>
</body>
</html>
