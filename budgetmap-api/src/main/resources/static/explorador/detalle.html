<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Detalle del Sitio - BudgetMap</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    // Seguridad: Solo exploradores
    const token = localStorage.getItem('jwt_token');
    if (!token) window.location.href = '/login.html';
  </script>
</head>
<body class="bg-gray-50 dark:bg-gray-900 min-h-screen pb-20">

  <nav class="bg-emerald-600 p-4 shadow-md text-white flex justify-between items-center">
    <button onclick="history.back()" class="flex items-center gap-2 font-bold hover:text-lime-200">
      ⬅️ Volver al Mapa
    </button>
    <span class="font-extrabold tracking-widest">BUDGETMAP</span>
    <div class="w-8"></div> </nav>

  <main class="max-w-4xl mx-auto mt-6 px-4">
    
    <div class="bg-white dark:bg-gray-800 rounded-3xl shadow-xl overflow-hidden border border-gray-100 dark:border-gray-700">
      <div class="h-64 md:h-80 bg-gray-200 relative">
        <img id="detalle-imagen" src="" alt="Imagen del sitio" class="w-full h-full object-cover">
        <div id="badge-categoria" class="absolute top-6 left-6 bg-lime-500 text-white px-4 py-1 rounded-full font-bold text-sm shadow-lg">
          CATEGORÍA
        </div>
      </div>

      <div class="p-8">
        <div class="flex justify-between items-start">
          <div>
            <h1 id="detalle-nombre" class="text-3xl md:text-4xl font-black text-gray-800 dark:text-white">Cargando...</h1>
            <p id="detalle-direccion" class="text-gray-500 dark:text-gray-400 mt-2 flex items-center gap-1">
              📍 <span>Ubicación</span>
            </p>
          </div>
          <div class="text-right">
            <span id="detalle-precio" class="text-2xl font-black text-emerald-600">$0.00</span>
            <p class="text-xs text-gray-400">Precio base / entrada</p>
          </div>
        </div>

        <div class="grid grid-cols-2 gap-4 mt-8">
          <div class="bg-emerald-50 dark:bg-emerald-900/30 p-4 rounded-2xl border border-emerald-100 dark:border-emerald-800">
            <p class="text-xs text-emerald-600 dark:text-emerald-400 font-bold uppercase">Aforo Actual</p>
            <p class="text-2xl font-black text-emerald-800 dark:text-emerald-200"><span id="aforo-actual">0</span> / <span id="aforo-max">0</span></p>
            <div class="w-full bg-emerald-200 dark:bg-emerald-800 h-2 rounded-full mt-2 overflow-hidden">
                <div id="aforo-bar" class="bg-emerald-500 h-full transition-all duration-500" style="width: 0%"></div>
            </div>
          </div>
          <div class="bg-blue-50 dark:bg-blue-900/30 p-4 rounded-2xl border border-blue-100 dark:border-blue-800">
            <p class="text-xs text-blue-600 dark:text-blue-400 font-bold uppercase">Horario / Fecha</p>
            <p id="detalle-horario" class="text-sm font-bold text-blue-800 dark:text-blue-200 mt-1">Cargando horario...</p>
          </div>
        </div>

        <div class="mt-8">
          <h2 class="font-bold text-gray-800 dark:text-white mb-2">Sobre este lugar</h2>
          <p id="detalle-descripcion" class="text-gray-600 dark:text-gray-300 leading-relaxed">
            Cargando descripción detallada...
          </p>
        </div>
      </div>
    </div>

    <section class="mt-10">
        <h2 class="text-2xl font-black text-gray-800 dark:text-white mb-6 flex items-center gap-2">
            🏷️ Promociones Disponibles
        </h2>
        <div id="contenedor-promociones" class="grid grid-cols-1 md:grid-cols-2 gap-4">
            <p class="text-gray-400 italic">No hay promociones activas en este momento.</p>
        </div>
    </section>

    <div class="fixed bottom-0 left-0 right-0 p-4 bg-white/80 dark:bg-gray-900/80 backdrop-blur-md border-t border-gray-200 dark:border-gray-700 z-50">
        <div class="max-w-4xl mx-auto">
            <button id="btn-reservar" class="w-full bg-gradient-to-r from-emerald-600 to-lime-500 text-white font-black py-4 rounded-2xl shadow-xl hover:shadow-2xl transition transform hover:scale-[1.01] active:scale-95">
                RESERVAR CUPO AHORA
            </button>
        </div>
    </div>

  </main>

  <script>
    // 1. Obtener parámetros de la URL (?id=1&tipo=establecimiento)
    const params = new URLSearchParams(window.location.search);
    const id = params.get('id');
    const tipo = params.get('tipo'); // 'establecimiento' o 'evento'

    document.addEventListener("DOMContentLoaded", () => {
        if (!id || !tipo) {
            alert("Información insuficiente");
            window.location.href = '/explorador/dashboard.html';
            return;
        }
        cargarDatosDetalle();
    });

    async function cargarDatosDetalle() {
        const endpoint = `http://localhost:8080/api/${tipo}s/${id}`;
        
        try {
            const response = await fetch(endpoint, {
                headers: { 'Authorization': `Bearer ${token}` }
            });

            if (response.ok) {
                const data = await response.json();
                pintarInterfaz(data);
                cargarPromociones();
            }
        } catch (error) {
            console.error("Error cargando detalle:", error);
        }
    }

    function pintarInterfaz(data) {
        document.getElementById('detalle-nombre').textContent = data.nombre;
        document.getElementById('detalle-descripcion').textContent = data.descripcion;
        document.getElementById('detalle-direccion').textContent = data.direccion || 'Lugar del evento';
        document.getElementById('badge-categoria').textContent = data.categoria || data.tipoEvento;
        document.getElementById('detalle-imagen').src = data.imagenUrl || 'https://via.placeholder.com/800x400?text=Sin+Imagen';
        document.getElementById('detalle-precio').textContent = data.precio ? `$${data.precio}` : 'Gratis';
        
        // Aforo
        const actual = data.aforoActual || 0;
        const max = data.aforoMaximo || 100;
        document.getElementById('aforo-actual').textContent = actual;
        document.getElementById('aforo-max').textContent = max;
        const porcentaje = (actual / max) * 100;
        document.getElementById('aforo-bar').style.width = `${porcentaje}%`;

        // Horario/Fecha
        if(tipo === 'establecimiento') {
            document.getElementById('detalle-horario').textContent = data.horarioAtencion || 'Consulta disponibilidad';
        } else {
            document.getElementById('detalle-horario').textContent = `${data.fechaInicio} | ${data.horaInicio}`;
        }
    }

    async function cargarPromociones() {
        const promoEndpoint = `http://localhost:8080/api/promociones/${tipo}/${id}/activas`;
        const contenedor = document.getElementById('contenedor-promociones');

        try {
            const response = await fetch(promoEndpoint, {
                headers: { 'Authorization': `Bearer ${token}` }
            });
            if (response.ok) {
                const promociones = await response.json();
                if(promociones.length > 0) {
                    contenedor.innerHTML = '';
                    promociones.forEach(p => {
                        contenedor.innerHTML += `
                            <div class="bg-white dark:bg-gray-800 p-5 rounded-2xl border-2 border-dashed border-lime-400 flex justify-between items-center shadow-sm">
                                <div>
                                    <h4 class="font-black text-emerald-600 dark:text-lime-400 text-lg">${p.titulo}</h4>
                                    <p class="text-xs text-gray-500">${p.descripcion}</p>
                                    <span class="inline-block mt-2 bg-lime-100 text-lime-700 text-[10px] font-bold px-2 py-0.5 rounded uppercase">CÓDIGO: ${p.codigoCupon}</span>
                                </div>
                                <div class="text-center">
                                    <span class="block text-2xl font-black text-gray-800 dark:text-white">-${p.descuentoPorcentaje}%</span>
                                    <button class="mt-2 text-[10px] bg-gray-800 text-white px-3 py-1 rounded-full font-bold">COPIAR</button>
                                </div>
                            </div>
                        `;
                    });
                }
            }
        } catch (e) {}
    }
  </script>
</body>
</html>
