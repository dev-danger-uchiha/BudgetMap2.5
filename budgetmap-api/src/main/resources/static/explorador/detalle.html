<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Detalles | BudgetMap</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    const token = localStorage.getItem('jwt_token');
    if (!token) window.location.href = '/login.html';
  </script>
</head>
<body class="bg-slate-50 font-sans pb-28">

  <header class="relative h-72 md:h-96 bg-slate-900">
    <img id="det-img" src="https://via.placeholder.com/800x400" class="w-full h-full object-cover opacity-50">
    <div class="absolute inset-0 bg-gradient-to-t from-slate-900 via-transparent to-transparent"></div>
    
    <button onclick="history.back()" class="absolute top-6 left-6 bg-white/20 backdrop-blur-md text-white px-4 py-2 rounded-full font-bold hover:bg-white/40 transition">
        ⬅️ Volver
    </button>
    
    <div class="absolute bottom-6 left-6 right-6">
        <span id="det-cat" class="bg-orange-500 text-white px-3 py-1 rounded-full text-[10px] font-black uppercase tracking-widest shadow-lg">CATEGORÍA</span>
        <h1 id="det-nombre" class="text-4xl md:text-5xl font-black text-white uppercase italic tracking-tighter mt-2 drop-shadow-md">Cargando...</h1>
        <p id="det-dir" class="text-amber-200 text-sm font-bold mt-2">📍 Ubicación</p>
    </div>
  </header>

  <main class="max-w-3xl mx-auto px-6 mt-8">
    <div class="grid grid-cols-2 gap-4 mb-8">
        <div class="bg-white p-5 rounded-3xl shadow-sm border border-orange-100 text-center">
            <p class="text-[10px] font-black text-slate-400 uppercase tracking-widest">Aforo Disponible</p>
            <p class="text-3xl font-black text-orange-500 mt-1"><span id="det-aforo">--</span></p>
        </div>
        <div class="bg-white p-5 rounded-3xl shadow-sm border border-orange-100 text-center">
            <p class="text-[10px] font-black text-slate-400 uppercase tracking-widest">Precio / Costo</p>
            <p id="det-precio" class="text-2xl font-black text-slate-800 mt-2">Gratis</p>
        </div>
    </div>

    <div class="bg-white p-6 rounded-3xl shadow-sm border border-slate-100 mb-8">
        <h3 class="font-black text-slate-800 uppercase tracking-tight mb-2 text-lg">Acerca de</h3>
        <p id="det-desc" class="text-sm text-slate-600 leading-relaxed">Cargando información detallada del sitio...</p>
    </div>

    <h3 class="font-black text-slate-800 uppercase tracking-tight mb-4 text-lg">🎟️ Promociones y Cupones</h3>
    <div id="contenedor-promos" class="space-y-4 mb-8">
        <p class="text-sm text-slate-400 font-bold italic p-4 text-center">Buscando promociones activas...</p>
    </div>
  </main>

  <div class="fixed bottom-0 left-0 right-0 p-4 bg-white/90 backdrop-blur-md border-t border-slate-200 z-50">
      <div class="max-w-3xl mx-auto flex gap-4">
          <select id="reserva-personas" class="bg-slate-100 border border-slate-200 text-slate-800 font-bold rounded-2xl px-4 outline-none w-24 text-center">
              <option value="1">1 Pax</option><option value="2">2 Pax</option><option value="3">3 Pax</option><option value="4">4 Pax</option>
              <option value="5">5 Pax</option><option value="6">6 Pax</option>
          </select>
          <button onclick="procesarReserva()" id="btn-reservar" class="flex-1 bg-gradient-to-r from-orange-500 to-amber-500 text-white font-black text-sm uppercase tracking-widest py-4 rounded-2xl shadow-xl shadow-orange-500/30 transform hover:scale-[1.02] transition-all">
              Asegurar Cupo Ahora
          </button>
      </div>
  </div>

  <script>
    const params = new URLSearchParams(window.location.search);
    const id = params.get('id');
    const tipo = params.get('tipo'); 

    document.addEventListener("DOMContentLoaded", async () => {
        if (!id || !tipo) return;

        try {
            const url = tipo === 'establecimiento' 
                ? `http://localhost:8080/api/establecimientos/${id}`
                : `http://localhost:8080/api/eventos/${id}`;
            
            const response = await fetch(url, { headers: { 'Authorization': `Bearer ${token}` } });
            if (response.ok) {
                const data = await response.json();
                document.getElementById('det-nombre').innerText = data.nombre;
                document.getElementById('det-cat').innerText = data.categoria || data.tipoEvento || 'PÚBLICO';
                document.getElementById('det-desc').innerText = data.descripcion || 'Sin descripción disponible.';
                document.getElementById('det-aforo').innerText = data.aforoActual !== undefined ? data.aforoMaximo - data.aforoActual : '--';
                document.getElementById('det-dir').innerText = `📍 ${data.direccion || (data.lugar ? data.lugar.direccion : 'Ubicación')}`;
                
                if(tipo === 'evento') {
                    document.getElementById('det-precio').innerText = data.precio > 0 ? `$${data.precio}` : 'Gratis';
                }

                if (tipo === 'establecimiento') cargarPromos(id);
                else document.getElementById('contenedor-promos').innerHTML = '<p class="text-sm text-slate-400 font-bold italic p-4">Los eventos no aplican cupones por ahora.</p>';
            }
        } catch (error) { console.error("Error al cargar detalle", error); }
    });

    async function cargarPromos(estId) {
        const contenedor = document.getElementById('contenedor-promos');
        try {
            const response = await fetch(`http://localhost:8080/api/promociones/establecimiento/${estId}`, {
                headers: { 'Authorization': `Bearer ${token}` }
            });
            if (response.ok) {
                const promociones = await response.json();
                if(promociones.length > 0) {
                    contenedor.innerHTML = '';
                    promociones.forEach(p => {
                        contenedor.innerHTML += `
                            <div class="bg-white p-5 rounded-2xl border-2 border-dashed border-orange-300 flex justify-between items-center shadow-sm">
                                <div>
                                    <h4 class="font-black text-orange-600 text-lg">${p.titulo}</h4>
                                    <p class="text-xs text-slate-500">${p.descripcion}</p>
                                    <span class="inline-block mt-2 bg-amber-100 text-amber-700 text-[10px] font-bold px-2 py-0.5 rounded uppercase">CÓDIGO: ${p.codigoCupon}</span>
                                </div>
                                <div class="text-center bg-slate-50 px-4 py-2 rounded-xl">
                                    <span class="block text-2xl font-black text-slate-800">-${p.descuentoPorcentaje}%</span>
                                </div>
                            </div>
                        `;
                    });
                } else {
                    contenedor.innerHTML = '<p class="text-sm text-slate-400 font-bold italic p-4">No hay promociones activas en este momento.</p>';
                }
            }
        } catch (e) { contenedor.innerHTML = '<p class="text-red-500 text-sm">Error al cargar cupones.</p>'; }
    }

    async function procesarReserva() {
        const btn = document.getElementById('btn-reservar');
        btn.innerText = "PROCESANDO...";
        btn.disabled = true;

        const personas = document.getElementById('reserva-personas').value;
        const payload = { numeroPersonas: parseInt(personas) };
        if(tipo === 'establecimiento') payload.establecimientoId = parseInt(id);
        else payload.eventoId = parseInt(id);

        try {
            const res = await fetch(`http://localhost:8080/api/reservas`, {
                method: 'POST',
                headers: { 'Authorization': `Bearer ${token}`, 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
            });
            
            if(res.ok) {
                alert("¡Reserva confirmada! Tu código digital ha sido generado.");
                window.location.href = '/explorador/mis-reservas.html';
            } else { 
                const errorData = await res.json();
                alert(`Error: ${errorData.message || "No hay aforo suficiente para esta cantidad de personas."}`); 
                btn.innerText = "Asegurar Cupo Ahora";
                btn.disabled = false;
            }
        } catch(e) { 
            alert("Error crítico de red.");
            btn.innerText = "Asegurar Cupo Ahora";
            btn.disabled = false;
        }
    }
  </script>
</body>
</html>
