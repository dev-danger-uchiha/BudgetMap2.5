<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Recuperar Contraseña - BudgetMap</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="manifest" href="/manifest.json">
  <meta name="theme-color" content="#f97316">
  <link rel="apple-touch-icon" href="/images/pwa-icon.png">
</head>
<body class="relative min-h-screen flex items-center justify-center overflow-hidden font-sans bg-orange-50 dark:bg-stone-900">

  <div class="relative z-20 w-full max-w-md px-6">
    <div class="text-center mb-8">
      <a href="/" class="inline-block mb-4">
        <img src="/images/logo.png" alt="Logo BudgetMap" class="w-24 h-24 mx-auto object-contain drop-shadow-xl hover:scale-110 transition">
      </a>
      <h2 class="text-3xl font-black text-gray-800 dark:text-white tracking-tight">Recuperar Contraseña</h2>
      <p class="text-gray-500 dark:text-gray-400 mt-2 text-sm font-medium">Te enviaremos un enlace para restablecerla</p>
    </div>

    <div id="alertContainer" class="hidden mb-4 p-4 rounded-xl text-sm font-bold text-center transition-all shadow-inner">
      <span id="alertText"></span>
    </div>

    <main class="bg-white dark:bg-gray-900/70 p-8 rounded-3xl shadow-xl border border-gray-100 dark:border-white/10">
      <form id="recuperarForm" class="space-y-6">
        <div class="space-y-1.5">
          <label for="email" class="block text-sm font-bold text-gray-700 dark:text-gray-300 ml-1">Correo Electrónico</label>
          <input type="email" id="email" required autofocus 
                 class="w-full pl-4 pr-4 py-3 bg-gray-50 dark:bg-gray-800/50 border border-gray-300 dark:border-gray-600 rounded-xl focus:ring-2 focus:ring-emerald-500 focus:border-emerald-500 text-gray-900 dark:text-white outline-none transition" 
                 placeholder="ejemplo@correo.com" />
        </div>

        <button type="submit" 
                class="w-full py-3.5 px-4 rounded-xl shadow-lg shadow-emerald-500/30 text-base font-extrabold text-white bg-gradient-to-r from-emerald-500 to-lime-500 hover:from-emerald-400 hover:to-lime-400 focus:outline-none transition duration-300 transform hover:-translate-y-1">
          Enviar enlace de recuperación
        </button>
      </form>

      <div class="mt-6 text-center">
        <a href="/login.html" class="text-sm text-emerald-600 hover:text-emerald-500 font-bold hover:underline">Volver a iniciar sesión</a>
      </div>
    </main>
  </div>

  <script>
    document.getElementById('recuperarForm').addEventListener('submit', async function (e) {
      e.preventDefault();
      const email = document.getElementById('email').value;
      const submitBtn = document.querySelector('button[type="submit"]');
      
      submitBtn.disabled = true;
      submitBtn.innerText = 'Enviando correo...';
      submitBtn.classList.add('opacity-70', 'cursor-not-allowed');

      try {
        const response = await fetch('https://budgetmap-api.onrender.com/api/auth/recuperar-password', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email: email })
        });

        // Siempre mostramos un mensaje de éxito por seguridad, así no se puede enumerar qué correos existen en la base de datos.
        mostrarAlerta("Si el correo está registrado, recibirás un enlace de recuperación pronto.", "success");
        document.getElementById('email').value = '';
        
      } catch (error) {
        mostrarAlerta("Error de conexión. Intenta de nuevo más tarde.", "error");
      } finally {
        submitBtn.disabled = false;
        submitBtn.innerText = 'Enviar enlace de recuperación';
        submitBtn.classList.remove('opacity-70', 'cursor-not-allowed');
      }
    });

    function mostrarAlerta(mensaje, tipo) {
      const alertContainer = document.getElementById('alertContainer');
      const alertText = document.getElementById('alertText');
      alertText.textContent = mensaje;
      alertContainer.classList.remove('hidden', 'bg-red-500/10', 'text-red-600', 'bg-emerald-500/10', 'text-emerald-600');
      if (tipo === "error") {
        alertContainer.classList.add('bg-red-500/10', 'text-red-600', 'border', 'border-red-500/30');
      } else {
        alertContainer.classList.add('bg-emerald-500/10', 'text-emerald-600', 'border', 'border-emerald-500/30');
      }
    }
  </script>
</body>
</html>
