<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Recuperar Contraseña - BudgetMap</title>
  
  <!-- Preconnect para recursos críticos -->
  <link rel="preconnect" href="https://cdn.tailwindcss.com">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;900&display=swap" rel="stylesheet">
  <link rel="manifest" href="/manifest.json">
  <meta name="theme-color" content="#f97316">
  <link rel="apple-touch-icon" href="/images/pwa-icon.png">

  <style>
    body {
      font-family: 'Inter', sans-serif;
    }
    .glass-panel {
      background: rgba(20, 20, 20, 0.45);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.1);
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
    }
    /* Input autofill fix for dark glass */
    input:-webkit-autofill,
    input:-webkit-autofill:hover, 
    input:-webkit-autofill:focus, 
    input:-webkit-autofill:active{
        -webkit-box-shadow: 0 0 0 30px rgba(0,0,0,0.5) inset !important;
        -webkit-text-fill-color: white !important;
        transition: background-color 5000s ease-in-out 0s;
    }
  </style>
</head>
<body class="relative min-h-screen flex items-center justify-center overflow-hidden bg-black text-white">

  <!-- Video Background -->
  <video autoplay loop muted playsinline class="absolute inset-0 w-full h-full object-cover z-0 opacity-80 mix-blend-screen pointer-events-none">
    <source src="/images/video%20luz.mp4" type="video/mp4">
  </video>

  <!-- Overlay para oscurecer el video y mejorar legibilidad -->
  <div class="absolute inset-0 bg-gradient-to-b from-black/60 via-black/40 to-black/80 z-10"></div>

  <!-- Contenedor Principal -->
  <div class="relative z-20 w-full max-w-md px-6 py-10 animate-fade-in-up">
    
    <!-- Logo y Título -->
    <div class="text-center mb-10">
      <a href="/" class="inline-block relative group">
        <div class="absolute inset-0 bg-orange-500 rounded-full blur-2xl opacity-20 group-hover:opacity-40 transition duration-500"></div>
        <img src="/images/logo.png" alt="Logo BudgetMap" class="relative w-28 h-28 mx-auto object-contain drop-shadow-[0_0_15px_rgba(249,115,22,0.5)] transform transition duration-500 hover:scale-110 hover:-translate-y-2">
      </a>
      <h2 class="text-4xl font-black text-white tracking-tight mt-6 drop-shadow-md">Budget<span class="text-orange-500">Map</span></h2>
      <p class="text-gray-300 mt-3 text-sm font-light tracking-wide px-4">Ingresa tu correo y te enviaremos la magia para recuperar tu cuenta.</p>
    </div>

    <!-- Alertas -->
    <div id="alertContainer" class="hidden mb-6 p-4 rounded-2xl text-sm font-medium text-center transition-all duration-300 shadow-lg border backdrop-blur-md">
      <span id="alertText"></span>
    </div>

    <!-- Panel Glassmorphism -->
    <main class="glass-panel p-8 sm:p-10 rounded-[2rem] transform transition-all duration-500 hover:shadow-orange-500/10">
      <form id="recuperarForm" class="space-y-6">
        
        <!-- Input Group -->
        <div class="space-y-2 relative group">
          <label for="email" class="block text-xs font-semibold text-gray-300 uppercase tracking-widest ml-1 group-focus-within:text-orange-400 transition-colors">Correo Electrónico</label>
          <div class="relative">
            <div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none">
              <svg class="h-5 w-5 text-gray-400 group-focus-within:text-orange-400 transition-colors" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 12a4 4 0 10-8 0 4 4 0 008 0zm0 0v1.5a2.5 2.5 0 005 0V12a9 9 0 10-9 9m4.5-1.206a8.959 8.959 0 01-4.5 1.207" />
              </svg>
            </div>
            <input type="email" id="email" required autofocus 
                   class="w-full pl-11 pr-4 py-3.5 bg-black/20 border border-white/10 rounded-2xl focus:ring-2 focus:ring-orange-500/50 focus:border-orange-500 text-white placeholder-gray-500 outline-none transition-all duration-300 hover:bg-black/30" 
                   placeholder="ejemplo@correo.com" />
          </div>
        </div>

        <!-- Botón Submit -->
        <button type="submit" 
                class="relative w-full py-4 px-4 rounded-2xl text-sm font-bold text-white overflow-hidden group">
          <!-- Fondo gradiente animado -->
          <div class="absolute inset-0 bg-gradient-to-r from-orange-600 via-amber-500 to-orange-600 bg-[length:200%_auto] animate-[gradient_2s_linear_infinite] group-hover:scale-105 transition-transform duration-500"></div>
          <!-- Contenido del botón -->
          <span class="relative flex items-center justify-center gap-2 drop-shadow-md">
            <span>Enviar enlace</span>
            <svg class="w-5 h-5 group-hover:translate-x-1 transition-transform" fill="none" viewBox="0 0 24 24" stroke="currentColor">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14 5l7 7m0 0l-7 7m7-7H3" />
            </svg>
          </span>
        </button>
      </form>
    </main>

    <!-- Footer Links -->
    <div class="mt-8 text-center">
      <a href="/login.html" class="inline-flex items-center gap-2 text-sm text-gray-400 hover:text-white font-medium transition-colors duration-300">
        <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18" />
        </svg>
        Volver a Iniciar Sesión
      </a>
    </div>
  </div>

  <script>
    // Configuración Tailwind Custom Animations
    tailwind.config = {
      theme: {
        extend: {
          animation: {
            'fade-in-up': 'fadeInUp 0.8s cubic-bezier(0.16, 1, 0.3, 1)',
            'gradient': 'gradient 3s linear infinite',
          },
          keyframes: {
            fadeInUp: {
              '0%': { opacity: '0', transform: 'translateY(20px)' },
              '100%': { opacity: '1', transform: 'translateY(0)' },
            },
            gradient: {
              '0%': { backgroundPosition: '0% 50%' },
              '50%': { backgroundPosition: '100% 50%' },
              '100%': { backgroundPosition: '0% 50%' },
            }
          }
        }
      }
    }

    // Lógica del Formulario
    document.getElementById('recuperarForm').addEventListener('submit', async function (e) {
      e.preventDefault();
      const email = document.getElementById('email').value;
      const submitBtn = document.querySelector('button[type="submit"]');
      const btnText = submitBtn.querySelector('span span');
      const originalText = btnText.innerText;
      
      submitBtn.disabled = true;
      btnText.innerText = 'Enviando...';
      submitBtn.classList.add('opacity-70', 'cursor-wait');

      try {
        const response = await fetch('https://budgetmap-api.onrender.com/api/auth/recuperar-password', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email: email })
        });

        mostrarAlerta("¡Magia enviada! Revisa tu bandeja de entrada o spam.", "success");
        document.getElementById('email').value = '';
        
      } catch (error) {
        mostrarAlerta("Error de red. Intenta de nuevo más tarde.", "error");
      } finally {
        submitBtn.disabled = false;
        btnText.innerText = originalText;
        submitBtn.classList.remove('opacity-70', 'cursor-wait');
      }
    });

    function mostrarAlerta(mensaje, tipo) {
      const alertContainer = document.getElementById('alertContainer');
      const alertText = document.getElementById('alertText');
      alertText.textContent = mensaje;
      
      // Reiniciar clases
      alertContainer.className = 'mb-6 p-4 rounded-2xl text-sm font-medium text-center transition-all duration-500 shadow-lg border backdrop-blur-md animate-fade-in-up';
      
      if (tipo === "error") {
        alertContainer.classList.add('bg-red-500/20', 'text-red-200', 'border-red-500/40');
      } else {
        alertContainer.classList.add('bg-emerald-500/20', 'text-emerald-200', 'border-emerald-500/40');
      }
    }
  </script>
</body>
</html>
