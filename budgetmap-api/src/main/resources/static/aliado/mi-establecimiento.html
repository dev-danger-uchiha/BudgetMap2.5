<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mi Establecimiento - BudgetMap Aliados</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    const token = localStorage.getItem('jwt_token');
    const rol = localStorage.getItem('user_rol');
    if (!token || rol !== 'LOCAL_ALIADO') window.location.href = '/login.html?denied=true';
  </script>
</head>
<body class="bg-gray-50 dark:bg-gray-900 min-h-screen pb-20">

  <nav class="bg-emerald-700 p-4 shadow-lg text-white flex justify-between items-center sticky top-0 z-50">
    <div class="flex items-center gap-2">
       <span class="bg-white text-emerald-700 px-2 py-0.5 rounded text-[10px] font-black uppercase">Aliado</span>
       <span class="font-bold tracking-widest">BUDGETMAP</span>
    </div>
    <div class="flex gap-4 text-xs font-bold uppercase">
        <a href="/aliado/dashboard.html" class="hover:text-lime-300">Resumen</a>
        <a href="/aliado/mi-establecimiento.html" class="text-lime-300 border-b-2 border-lime-300">Mi Local</a>
    </div>
  </nav>

  <main class="max-w-4xl mx-auto mt-8 px-4">
    
    <div class="flex flex-col md:flex-row justify-between items-end mb-8 gap-4">
        <div>
            <h1 class="text-3xl font-black text-gray-800 dark:text-white">Gestionar mi Local</h1>
            <p class="text-gray-500 text-sm mt-1">Completa la información para que los exploradores te encuentren.</p>
        </div>
        <div id="status-badge" class="px-4 py-2 rounded-full font-black text-xs uppercase shadow-sm bg-gray-200 text-gray-600">
            Estado: Sin Registro
        </div>
    </div>

    <div class="mb-6 text-center">
        <img id="previewImagen" 
            src="https://via.placeholder.com/300" 
            class="w-full max-w-md mx-auto h-56 object-cover rounded-2xl shadow-lg border">
    </div>

    <form id="establecimientoForm" class="grid grid-cols-1 md:grid-cols-2 gap-6 bg-white dark:bg-gray-800 p-8 rounded-3xl shadow-xl border border-gray-100 dark:border-gray-700">
      
      <div class="space-y-4">
        <div>
            <label class="block text-xs font-black uppercase text-gray-400 mb-1">Nombre del Negocio:</label>
            <input type="text" id="nombre" required class="w-full px-4 py-2 rounded-xl border dark:bg-gray-700 dark:border-gray-600 dark:text-white outline-none focus:ring-2 focus:ring-emerald-500 transition">
        </div>
        <div>
            <label class="block text-xs font-black uppercase text-gray-400 mb-1">Categoría:</label>
            <select id="categoria" class="w-full px-4 py-2 rounded-xl border dark:bg-gray-700 dark:border-gray-600 dark:text-white outline-none focus:ring-2 focus:ring-emerald-500 transition">
                <option value="RESTAURANTE">Restaurante</option>
                <option value="BAR">Bar / Discoteca</option>
                <option value="PARQUEADERO">Parqueadero</option>
                <option value="PANADERIA">Panaderia</option>
                <option value="TIENDA">Tienda / Comercio</option>
            </select>
        </div>
      </div>

      <div class="space-y-4">
        <div>
            <label class="block text-xs font-black uppercase text-gray-400 mb-1">NIT del Negocio:</label>
            <input type="text" id="nit" required placeholder="Ej: 900.123.456-1" class="w-full px-4 py-2 rounded-xl border dark:bg-gray-700 dark:border-gray-600 dark:text-white outline-none focus:ring-2 focus:ring-emerald-500 transition">
        </div>
        <div>
            <label class="block text-xs font-black uppercase text-gray-400 mb-1">Teléfono de Contacto:</label>
            <input type="text" id="telefono" required placeholder="Ej: 3101234567" class="w-full px-4 py-2 rounded-xl border dark:bg-gray-700 dark:border-gray-600 dark:text-white outline-none focus:ring-2 focus:ring-emerald-500 transition">
        </div>
      </div>

      <div>
        <label class="block text-xs font-black uppercase text-gray-400 mb-1">URL de Imagen (Link):</label>
        <input type="url" id="imagenUrl" placeholder="https://..." class="w-full px-4 py-2 rounded-xl border dark:bg-gray-700 dark:border-gray-600 dark:text-white outline-none focus:ring-2 focus:ring-emerald-500 transition">
      </div>

      <div>
        <label class="block text-xs font-black uppercase text-gray-400 mb-1">Dirección Física:</label>
        <div class="flex gap-2">
            <input type="text" id="direccion" required placeholder="Ej: Carrera 7 # 65-8" class="w-full px-4 py-2 rounded-xl border dark:bg-gray-700 dark:border-gray-600 dark:text-white outline-none focus:ring-2 focus:ring-emerald-500 transition">
            <button type="button" onclick="buscarCoordenadas()" class="bg-emerald-100 dark:bg-emerald-900/30 text-emerald-700 dark:text-emerald-400 px-4 rounded-xl font-bold hover:bg-emerald-200 dark:hover:bg-emerald-800 transition">
                📍
            </button>
        </div>
      </div>

      <div class="p-4 bg-lime-50 dark:bg-gray-900/50 rounded-2xl border space-y-4">
        <h4 class="text-xs font-black uppercase">Ubicación en Mapa</h4>
        <div class="grid grid-cols-2 gap-2">
            <input type="number" id="latitud" step="any" placeholder="Latitud" required class="px-3 py-2 text-sm rounded-lg border dark:bg-gray-700 dark:text-white">
            <input type="number" id="longitud" step="any" placeholder="Longitud" required class="px-3 py-2 text-sm rounded-lg border dark:bg-gray-700 dark:text-white">
        </div>
      </div>

      <div class="p-4 bg-emerald-50 dark:bg-gray-900/50 rounded-2xl border space-y-4">
        <h4 class="text-xs font-black uppercase">Capacidad y Tiempo</h4>
        <input type="number" id="aforoMaximo" required placeholder="Aforo máximo" class="w-full px-3 py-2 text-sm rounded-lg border dark:bg-gray-700 dark:text-white">
        <input type="text" id="horarioAtencion" placeholder="Ej: Lun-Vie 8am-8pm" class="w-full px-3 py-2 text-sm rounded-lg border dark:bg-gray-700 dark:text-white">
      </div>

      <div class="md:col-span-2">
        <textarea id="descripcion" rows="3" placeholder="Descripción..." class="w-full px-4 py-2 rounded-xl border dark:bg-gray-700 dark:text-white"></textarea>
      </div>

      <div class="md:col-span-2 pt-4">
        <button type="submit" class="w-full bg-emerald-600 text-white font-black py-4 rounded-2xl shadow-xl hover:bg-emerald-500">
            GUARDAR Y SOLICITAR APROBACIÓN
        </button>
      </div>
    </form>

  </main>

<script>
let establecimientoId = null;

document.addEventListener("DOMContentLoaded", () => {
    cargarDatos();

    // ✅ PREVIEW EN TIEMPO REAL
    const inputImagen = document.getElementById('imagenUrl');
    const preview = document.getElementById('previewImagen');

    inputImagen.addEventListener('input', (e) => {
        const url = e.target.value;
        preview.src = url;

        preview.onerror = () => {
            preview.src = 'https://via.placeholder.com/300';
        };
    });
});

async function cargarDatos() {
    try {
        const response = await fetch('http://localhost:8080/api/establecimientos/mi-establecimiento', {
            headers: { 'Authorization': `Bearer ${token}` }
        });

        if (response.ok) {
            const data = await response.json();

            if (data) {
                establecimientoId = data.id;

                nombre.value = data.nombre || "";
                nit.value = data.nit || "";
                telefono.value = data.telefono || "";
                categoria.value = data.categoria || "RESTAURANTE";
                direccion.value = data.direccion || "";
                latitud.value = data.latitud || "";
                longitud.value = data.longitud || "";
                aforoMaximo.value = data.aforoMaximo || 0;
                horarioAtencion.value = data.horarioAtencion || "";
                descripcion.value = data.descripcion || "";
                imagenUrl.value = data.imagenUrl || "";

                previewImagen.src = data.imagenUrl || 'https://via.placeholder.com/300';

                actualizarBadgeEstado(data.estado);
            }
        }
    } catch (e) {
        console.error(e);
    }
}

document.getElementById('establecimientoForm').addEventListener('submit', async (e) => {
    e.preventDefault();

    const data = {
        nombre: nombre.value,
        nit: nit.value,
        telefono: telefono.value,
        categoria: categoria.value,
        direccion: direccion.value,
        latitud: parseFloat(latitud.value),
        longitud: parseFloat(longitud.value),
        aforoMaximo: parseInt(aforoMaximo.value),
        horarioAtencion: horarioAtencion.value,
        descripcion: descripcion.value,
        imagenUrl: imagenUrl.value
    };

    const method = establecimientoId ? 'PUT' : 'POST';
    const url = establecimientoId 
        ? `http://localhost:8080/api/establecimientos/${establecimientoId}`
        : `http://localhost:8080/api/establecimientos`;

    const response = await fetch(url, {
        method,
        headers: {
            'Authorization': `Bearer ${token}`,
            'Content-Type': 'application/json'
        },
        body: JSON.stringify(data)
    });

    if (response.ok) {
        alert("Guardado correctamente");
        location.reload();
    } else {
        alert("Error al guardar");
    }
});

function actualizarBadgeEstado(estado) {
    const badge = document.getElementById('status-badge');
    badge.textContent = `Estado: ${estado}`;
}
</script>

</body>
</html>
