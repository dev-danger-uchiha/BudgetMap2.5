<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mi Local - BudgetMap</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    const token = localStorage.getItem('jwt_token');
    if (!token || localStorage.getItem('user_rol') !== 'LOCAL_ALIADO') window.location.href = '/login.html';
  </script>
</head>
<body class="bg-slate-50 min-h-screen text-slate-800 font-sans pb-20">

  <nav class="bg-white border-b border-emerald-100 p-4 sticky top-0 z-50 shadow-sm">
    <div class="max-w-7xl mx-auto flex justify-between items-center">
      <div class="flex items-center gap-4">
        <span class="bg-emerald-600 text-white px-3 py-1 rounded-full font-black text-[10px] uppercase tracking-tighter">ALIADO</span>
        <h1 class="font-black tracking-widest text-emerald-900">PANEL DE GESTIÓN</h1>
      </div>
      <div class="flex gap-6 text-[10px] font-black uppercase tracking-widest text-slate-400">
        <a href="dashboard.html" class="hover:text-emerald-600 transition">Resumen</a>
        <a href="mi-establecimiento.html" class="text-emerald-600 border-b-2 border-emerald-600 pb-1">Mi Local</a>
        <a href="promociones.html" class="hover:text-emerald-600 transition">Promociones</a>
      </div>
    </div>
  </nav>

  <main class="max-w-6xl mx-auto mt-8 px-6">
    <div class="grid grid-cols-1 lg:grid-cols-3 gap-8">
      
      <div class="lg:col-span-1 flex flex-col gap-6">
        <div class="bg-emerald-900 p-8 rounded-3xl text-white shadow-lg relative overflow-hidden">
            <h3 class="font-black text-emerald-300 uppercase tracking-widest text-[10px] mb-4">Estado de Aprobación</h3>
            <div id="badge-estado" class="inline-block px-4 py-2 rounded-full bg-emerald-800 font-bold text-xs shadow-inner">CARGANDO...</div>
            <p class="text-xs text-emerald-100 mt-6 leading-relaxed opacity-80">
                Asegúrate de que tus coordenadas y aforo sean correctos. La moderación puede tardar hasta 24 horas.
            </p>
        </div>
      </div>

      <div class="lg:col-span-2 bg-white p-8 rounded-3xl border border-emerald-100 shadow-sm">
        <h3 class="text-xl font-black text-slate-900 uppercase tracking-tighter mb-6">Ficha Técnica del Negocio</h3>
        
        <form id="establecimientoForm" class="grid grid-cols-1 md:grid-cols-2 gap-5">
            <input type="hidden" id="est-id">
            
            <div class="md:col-span-2">
                <label class="text-[10px] font-bold text-slate-400 uppercase tracking-widest">Nombre Comercial</label>
                <input type="text" id="nombre" required class="w-full mt-1 bg-slate-50 border border-slate-200 rounded-xl p-3 text-sm outline-none focus:border-emerald-500 focus:bg-white transition-all">
            </div>
            
            <div>
                <label class="text-[10px] font-bold text-slate-400 uppercase tracking-widest">NIT</label>
                <input type="text" id="nit" required class="w-full mt-1 bg-slate-50 border border-slate-200 rounded-xl p-3 text-sm outline-none focus:border-emerald-500 focus:bg-white transition-all">
            </div>

            <div>
                <label class="text-[10px] font-bold text-slate-400 uppercase tracking-widest">Categoría</label>
                <select id="categoria" required class="w-full mt-1 bg-slate-50 border border-slate-200 rounded-xl p-3 text-sm outline-none focus:border-emerald-500 focus:bg-white transition-all">
                    <option value="RESTAURANTE">Restaurante</option>
                    <option value="BAR">Bar / Discoteca</option>
                    <option value="PANADERIA">Panadería / Café</option>
                    <option value="OTRO">Otro</option>
                </select>
            </div>

            <div class="md:col-span-2">
                <label class="text-[10px] font-bold text-slate-400 uppercase tracking-widest">Dirección Física</label>
                <input type="text" id="direccion" required class="w-full mt-1 bg-slate-50 border border-slate-200 rounded-xl p-3 text-sm outline-none focus:border-emerald-500 focus:bg-white transition-all">
            </div>

            <div>
                <label class="text-[10px] font-bold text-slate-400 uppercase tracking-widest">Latitud</label>
                <input type="number" step="any" id="latitud" required class="w-full mt-1 bg-slate-50 border border-slate-200 rounded-xl p-3 text-sm outline-none focus:border-emerald-500 focus:bg-white transition-all">
            </div>

            <div>
                <label class="text-[10px] font-bold text-slate-400 uppercase tracking-widest">Longitud</label>
                <input type="number" step="any" id="longitud" required class="w-full mt-1 bg-slate-50 border border-slate-200 rounded-xl p-3 text-sm outline-none focus:border-emerald-500 focus:bg-white transition-all">
            </div>

            <div>
                <label class="text-[10px] font-bold text-slate-400 uppercase tracking-widest">Aforo Máximo</label>
                <input type="number" id="aforoMaximo" required class="w-full mt-1 bg-slate-50 border border-slate-200 rounded-xl p-3 text-sm outline-none focus:border-emerald-500 focus:bg-white transition-all">
            </div>

            <div>
                <label class="text-[10px] font-bold text-slate-400 uppercase tracking-widest">Teléfono</label>
                <input type="text" id="telefono" required class="w-full mt-1 bg-slate-50 border border-slate-200 rounded-xl p-3 text-sm outline-none focus:border-emerald-500 focus:bg-white transition-all">
            </div>

            <div class="md:col-span-2">
                <label class="text-[10px] font-bold text-slate-400 uppercase tracking-widest">Descripción</label>
                <textarea id="descripcion" rows="3" class="w-full mt-1 bg-slate-50 border border-slate-200 rounded-xl p-3 text-sm outline-none focus:border-emerald-500 focus:bg-white transition-all resize-none"></textarea>
            </div>

            <button type="submit" id="btn-guardar" class="md:col-span-2 mt-4 bg-emerald-600 text-white font-black py-4 rounded-xl text-xs uppercase tracking-widest hover:bg-emerald-700 shadow-md transition-all">
                Guardar Información
            </button>
        </form>
      </div>
    </div>
  </main>

  <script>
    document.addEventListener("DOMContentLoaded", async () => {
        try {
            const res = await fetch('http://localhost:8080/api/establecimientos/mi-establecimiento', {
                headers: { 'Authorization': `Bearer ${token}` }
            });
            if(res.ok) {
                const est = await res.json();
                document.getElementById('est-id').value = est.id;
                document.getElementById('nombre').value = est.nombre;
                document.getElementById('nit').value = est.nit;
                document.getElementById('categoria').value = est.categoria;
                document.getElementById('direccion').value = est.direccion;
                document.getElementById('latitud').value = est.latitud;
                document.getElementById('longitud').value = est.longitud;
                document.getElementById('aforoMaximo').value = est.aforoMaximo;
                document.getElementById('telefono').value = est.telefono;
                document.getElementById('descripcion').value = est.descripcion;

                const badge = document.getElementById('badge-estado');
                badge.innerText = est.estado;
                if(est.estado === 'APROBADO') badge.className = 'inline-block px-4 py-2 rounded-full bg-lime-400 text-emerald-900 font-black text-xs shadow-md';
                if(est.estado === 'RECHAZADO') badge.className = 'inline-block px-4 py-2 rounded-full bg-red-500 text-white font-black text-xs shadow-md';
            }
        } catch(e) { console.warn("Nuevo establecimiento. Por favor, llena los datos."); }
    });

    document.getElementById('establecimientoForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        const btn = document.getElementById('btn-guardar');
        btn.innerText = 'GUARDANDO...'; btn.disabled = true;

        const id = document.getElementById('est-id').value;
        const payload = {
            nombre: document.getElementById('nombre').value,
            nit: document.getElementById('nit').value,
            categoria: document.getElementById('categoria').value,
            direccion: document.getElementById('direccion').value,
            latitud: parseFloat(document.getElementById('latitud').value),
            longitud: parseFloat(document.getElementById('longitud').value),
            aforoMaximo: parseInt(document.getElementById('aforoMaximo').value),
            telefono: document.getElementById('telefono').value,
            descripcion: document.getElementById('descripcion').value
        };

        const method = id ? 'PUT' : 'POST';
        const url = id ? `http://localhost:8080/api/establecimientos/${id}` : `http://localhost:8080/api/establecimientos`;

        try {
            const response = await fetch(url, {
                method: method,
                headers: { 'Authorization': `Bearer ${token}`, 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
            });
            if(response.ok) {
                alert("¡Información guardada exitosamente!");
                location.reload();
            } else { alert("Error al guardar. Verifica los datos."); }
        } catch(err) { alert("Error de red."); }
        finally { btn.innerText = 'GUARDAR INFORMACIÓN'; btn.disabled = false; }
    });
  </script>
</body>
</html>
