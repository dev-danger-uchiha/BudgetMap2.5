<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Promociones - BudgetMap Aliados</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    const token = localStorage.getItem('jwt_token');
    if (!token || localStorage.getItem('user_rol') !== 'LOCAL_ALIADO') window.location.href = '/login.html';
  </script>
</head>
<body class="bg-gray-50 dark:bg-gray-900 min-h-screen pb-20">

  <nav class="bg-emerald-700 p-4 shadow-md text-white flex justify-between items-center sticky top-0 z-50">
    <button onclick="location.href='/aliado/dashboard.html'" class="flex items-center gap-2 font-bold hover:text-lime-200 transition">
      ⬅️ Panel Principal
    </button>
    <span class="font-black tracking-widest uppercase text-sm">Gestión de Promociones</span>
    <div class="w-8"></div>
  </nav>

  <main class="max-w-6xl mx-auto mt-8 px-4 grid grid-cols-1 lg:grid-cols-3 gap-8">
    
    <div class="lg:col-span-1">
      <div class="bg-white dark:bg-gray-800 p-6 rounded-3xl shadow-xl border border-gray-100 dark:border-gray-700 sticky top-24">
        <h2 class="text-xl font-black text-gray-800 dark:text-white mb-6 flex items-center gap-2">
          ✨ Nueva Promo
        </h2>
        <form id="promoForm" class="space-y-4">
          <div>
            <label class="block text-[10px] font-black uppercase text-gray-400 mb-1">Título de la Oferta:</label>
            <input type="text" id="titulo" placeholder="Ej: 2x1 en Hamburguesas" required 
                   class="w-full px-4 py-2 rounded-xl border dark:bg-gray-700 dark:border-gray-600 dark:text-white outline-none focus:ring-2 focus:ring-emerald-500 transition text-sm">
          </div>
          <div>
            <label class="block text-[10px] font-black uppercase text-gray-400 mb-1">Descripción corta:</label>
            <textarea id="descripcion" rows="2" placeholder="Válido solo por hoy..." 
                      class="w-full px-4 py-2 rounded-xl border dark:bg-gray-700 dark:border-gray-600 dark:text-white outline-none focus:ring-2 focus:ring-emerald-500 transition text-sm resize-none"></textarea>
          </div>
          <div class="grid grid-cols-2 gap-3">
            <div>
              <label class="block text-[10px] font-black uppercase text-gray-400 mb-1">% Descuento:</label>
              <input type="number" id="descuento" min="1" max="100" required 
                     class="w-full px-4 py-2 rounded-xl border dark:bg-gray-700 dark:border-gray-600 dark:text-white outline-none focus:ring-2 focus:ring-emerald-500 transition text-sm">
            </div>
            <div>
              <label class="block text-[10px] font-black uppercase text-gray-400 mb-1">Código:</label>
              <input type="text" id="codigo" placeholder="PROMO20" required 
                     class="w-full px-4 py-2 rounded-xl border dark:bg-gray-700 dark:border-gray-600 dark:text-white outline-none focus:ring-2 focus:ring-emerald-500 transition text-sm uppercase">
            </div>
          </div>
          <div>
            <label class="block text-[10px] font-black uppercase text-gray-400 mb-1">Válido hasta:</label>
            <input type="date" id="fechaFin" required 
                   class="w-full px-4 py-2 rounded-xl border dark:bg-gray-700 dark:border-gray-600 dark:text-white outline-none focus:ring-2 focus:ring-emerald-500 transition text-sm">
          </div>
          <button type="submit" class="w-full bg-emerald-600 text-white font-black py-3 rounded-xl shadow-lg hover:bg-emerald-500 transition transform active:scale-95 mt-4">
            PUBLICAR PROMO
          </button>
        </form>
      </div>
    </div>

    <div class="lg:col-span-2">
      <h3 class="text-2xl font-black text-gray-800 dark:text-white mb-6">Promociones Activas</h3>
      <div id="lista-promos" class="grid grid-cols-1 md:grid-cols-2 gap-4">
        <div class="animate-pulse bg-gray-200 dark:bg-gray-800 h-32 rounded-3xl"></div>
      </div>
    </div>

  </main>
    <script>
      let establecimientoId = null;

      document.addEventListener("DOMContentLoaded", async () => {
        await obtenerMiLocal();
        configurarFormulario();
      });

      async function obtenerMiLocal() {
        try {
          const res = await fetch('http://localhost:8080/api/establecimientos/mi-establecimiento', {
            headers: { 'Authorization': `Bearer ${token}` }
          });
          if (res.ok) {
            const est = await res.json();
            establecimientoId = est.id;
            cargarPromos();
          }
        } catch (e) { console.error("Error al obtener local", e); }
      }

      function configurarFormulario() {
        document.getElementById('promoForm').addEventListener('submit', async (e) => {
          e.preventDefault();
          if (!establecimientoId) return alert("Error: No se detectó tu establecimiento.");

          const data = {
            titulo: document.getElementById('titulo').value,
            descripcion: document.getElementById('descripcion').value,
            descuentoPorcentaje: parseInt(document.getElementById('descuento').value),
            codigoCupon: document.getElementById('codigo').value.toUpperCase(),
            fechaInicio: new Date().toISOString().split('T')[0], // Hoy
            fechaFin: document.getElementById('fechaFin').value,
            establecimientoId: establecimientoId
          };

          const response = await fetch('http://localhost:8080/api/promociones', {
            method: 'POST',
            headers: {
              'Authorization': `Bearer ${token}`,
              'Content-Type': 'application/json'
            },
            body: JSON.stringify(data)
          });

          if (response.ok) {
            alert("¡Promoción publicada!");
            location.reload();
          }
        });
      }

      async function cargarPromos() {
        const contenedor = document.getElementById('lista-promos');
        try {
          const response = await fetch(`http://localhost:8080/api/promociones/mis-promociones`, {
            headers: { 'Authorization': `Bearer ${token}` }
          });

          if (response.ok) {
            const promos = await response.json();
            contenedor.innerHTML = promos.length ? '' : '<p class="text-gray-400 italic">Sin promociones.</p>';
            
            promos.forEach(p => {
              contenedor.innerHTML += `
                <div class="bg-white dark:bg-gray-800 p-5 rounded-3xl border border-gray-100 dark:border-gray-700 shadow-sm">
                  <div class="flex justify-between items-start">
                    <div>
                      <h4 class="font-black text-gray-800 dark:text-white">${p.titulo}</h4>
                      <p class="text-xs text-gray-500">${p.descripcion}</p>
                    </div>
                    <span class="bg-emerald-100 text-emerald-700 text-[10px] font-bold px-2 py-1 rounded-lg">-${p.descuentoPorcentaje}%</span>
                  </div>
                  <div class="mt-4 pt-4 border-t border-gray-50 flex justify-between items-center">
                    <code class="text-[10px] bg-gray-100 px-2 py-1 rounded font-bold">${p.codigoCupon}</code>
                    <button onclick="eliminarPromo(${p.id})" class="text-red-400 hover:text-red-600 text-xs font-bold">Eliminar</button>
                  </div>
                </div>`;
            });
          }
        } catch (e) { console.error("Error al cargar promos", e); }
      }

      async function eliminarPromo(id) {
        if (!confirm("¿Eliminar promoción?")) return;
        const res = await fetch(`http://localhost:8080/api/promociones/${id}`, {
          method: 'DELETE',
          headers: { 'Authorization': `Bearer ${token}` }
        });
        if (res.ok) cargarPromos();
      }
    </script>
  
</body>
</html>
