<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Promociones - BudgetMap</title>
    <script src="https://cdn.tailwindcss.com">
        function cerrarSesion() {
            localStorage.clear();
            sessionStorage.clear();
            window.location.href = '/login.html';
        }
    </script>
    <script>
        const token = localStorage.getItem('jwt_token');
        if (!token || localStorage.getItem('user_rol') !== 'LOCAL_ALIADO') window.location.href = '/login.html';

        function cerrarSesion() {
            localStorage.clear();
            sessionStorage.clear();
            window.location.href = '/login.html';
        }
    </script>
</head>

<body class="bg-slate-50 h-screen overflow-hidden text-slate-800 font-sans flex flex-col">

    <nav class="bg-white border-b border-emerald-100 p-4 sticky top-0 z-50 shadow-sm">
        <div class="w-full px-6 md:px-10 flex justify-between items-center">
            <div class="flex items-center gap-4">
                <div
                    class="relative bg-white rounded-full w-12 h-12 md:w-16 md:h-16 shadow-md ring-1 ring-black/5 flex items-center justify-center z-0 hidden sm:flex">
                    <img src="/images/logo.png" alt="Logo BudgetMap"
                        class="absolute w-16 h-16 md:w-24 md:h-24 max-w-none object-contain transform transition duration-500 hover:scale-110 top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 z-40 drop-shadow-xl" />
                </div><span class="text-xl font-black tracking-widest drop-shadow-md mx-2"><a href="/index.html"
                        class="hover:text-emerald-600 transition">BUDGETMAP</a></span>
                <span
                    class="bg-emerald-600 text-white px-3 py-1 rounded-full font-black text-[10px] uppercase tracking-tighter">ALIADO</span>
                <h1 class="font-black tracking-widest text-emerald-900">PANEL DE GESTIÓN</h1>
            </div>
            <div class="flex gap-6 text-xs font-bold uppercase tracking-widest hidden md:flex">
                <a href="dashboard.html" class="hover:text-emerald-600 transition">Resumen</a>
                <a href="mi-establecimiento.html" class="hover:text-emerald-600 transition">Mi Local</a>
                <a href="promociones.html" class="text-emerald-600 border-b-2 border-emerald-600 pb-1">Promociones</a>
            </div>
            <button onclick="cerrarSesion()"
                class="text-[12px] text-slate-400 font-bold hover:text-red-500 transition">SALIR</button>
        </div>
    </nav>

    <main class="flex-1 w-full px-6 md:px-10 w-full p-4 md:p-6 grid grid-cols-1 lg:grid-cols-12 gap-4 md:gap-6 min-h-0">

        <div
            class="lg:col-span-4 bg-white p-5 rounded-2xl border border-emerald-100 shadow-sm flex flex-col min-h-0 overflow-y-auto">
            <h3 class="font-black text-slate-900 uppercase tracking-tighter mb-4 border-b border-emerald-50 pb-3">Lanzar
                Nueva Promo</h3>
            <form id="form-promo" class="flex flex-col gap-3">
                <div class="grid grid-cols-2 gap-3">
                    <div class="col-span-2 sm:col-span-1">
                        <label class="text-[10px] font-bold text-slate-400 uppercase">Título (Ej: 2x1 en
                            Cervezas)</label>
                        <input type="text" id="titulo" required
                            class="w-full mt-1 bg-slate-50 border border-slate-200 rounded-lg px-3 py-2 text-xs outline-none focus:border-emerald-500 focus:bg-white transition-colors">
                    </div>
                    <div class="col-span-2 sm:col-span-1">
                        <label class="text-[10px] font-bold text-slate-400 uppercase">Código Promocional</label>
                        <input type="text" id="codigo" required
                            class="w-full mt-1 bg-slate-50 border border-slate-200 rounded-lg px-3 py-2 text-xs outline-none focus:border-emerald-500 focus:bg-white transition-colors uppercase"
                            placeholder="Ej: VERANO2026">
                    </div>
                </div>
                <div class="grid grid-cols-2 gap-3">
                    <div>
                        <label class="text-[10px] font-bold text-slate-400 uppercase">% Descuento</label>
                        <input type="number" id="descuento" required
                            class="w-full mt-1 bg-slate-50 border border-slate-200 rounded-lg px-3 py-2 text-xs outline-none focus:border-emerald-500 focus:bg-white transition-colors">
                    </div>
                    <div>
                        <label class="text-[10px] font-bold text-slate-400 uppercase">Límite de Usos</label>
                        <input type="number" id="usos" required
                            class="w-full mt-1 bg-slate-50 border border-slate-200 rounded-lg px-3 py-2 text-xs outline-none focus:border-emerald-500 focus:bg-white transition-colors">
                    </div>
                </div>
                <div class="grid grid-cols-2 gap-3">
                    <div>
                        <label class="text-[10px] font-bold text-slate-400 uppercase">Fecha Inicio</label>
                        <input type="datetime-local" id="fecha-inicio" required
                            class="w-full mt-1 bg-slate-50 border border-slate-200 rounded-lg px-3 py-2 text-xs outline-none focus:border-emerald-500 focus:bg-white transition-colors">
                    </div>
                    <div>
                        <label class="text-[10px] font-bold text-slate-400 uppercase">Fecha Fin</label>
                        <input type="datetime-local" id="fecha-fin" required
                            class="w-full mt-1 bg-slate-50 border border-slate-200 rounded-lg px-3 py-2 text-xs outline-none focus:border-emerald-500 focus:bg-white transition-colors">
                    </div>
                </div>
                <div>
                    <label class="text-[10px] font-bold text-slate-400 uppercase">Descripción / Términos</label>
                    <textarea id="desc-promo" rows="2"
                        class="w-full mt-1 bg-slate-50 border border-slate-200 rounded-lg px-3 py-2 text-xs outline-none resize-none focus:border-emerald-500 focus:bg-white transition-colors"></textarea>
                </div>
                <button type="submit"
                    class="w-full mt-2 bg-emerald-600 text-white font-black py-3 rounded-xl text-[10px] tracking-widest uppercase hover:bg-emerald-700 shadow-md transition-all">Lanzar
                    Campaña</button>
            </form>
        </div>

        <div class="lg:col-span-8 bg-white border border-emerald-100 rounded-2xl p-5 shadow-sm flex flex-col min-h-0">
            <div
                class="flex flex-col sm:flex-row justify-between items-start sm:items-center mb-4 pb-3 border-b border-emerald-50 gap-4">
                <div>
                    <h3 class="text-xl font-black text-slate-900 italic tracking-tighter uppercase">Inventario Activo
                    </h3>
                    <p class="text-[9px] font-bold text-slate-400 uppercase tracking-widest mt-0.5">Control de Campañas
                    </p>
                </div>
                <div
                    class="flex gap-2 items-center bg-slate-50 p-1.5 rounded-lg border border-slate-100 w-full sm:w-auto">
                    <input type="text" id="filtro-titulo" placeholder="Filtrar..."
                        class="w-full sm:w-auto bg-white border border-slate-200 rounded-md px-3 py-1.5 text-xs outline-none focus:border-emerald-500 transition-colors"
                        onchange="cargarPromos(0)">
                    <select id="filtro-estado"
                        class="bg-white border border-slate-200 rounded-md px-3 py-1.5 text-xs outline-none focus:border-emerald-500 transition-colors"
                        onchange="cargarPromos(0)">
                        <option value="">Todas</option>
                        <option value="ACTIVA">Activa</option>
                        <option value="VENCIDA">Vencida</option>
                        <option value="AGOTADA">Agotada</option>
                    </select>
                </div>
            </div>

            <div id="grid-promos"
                class="flex-1 overflow-y-auto grid grid-cols-1 xl:grid-cols-2 gap-3 pr-2 content-start">
            </div>

            <div class="mt-4 pt-3 border-t border-emerald-50 flex justify-between items-center bg-white">
                <button id="btn-prev" onclick="cargarPromos(paginaActual-1)"
                    class="text-[10px] font-black uppercase tracking-widest text-emerald-600 px-3 py-1.5 rounded-lg border border-emerald-200 hover:bg-emerald-100 disabled:opacity-50 disabled:cursor-not-allowed transition-all">Ant</button>
                <span id="info-pag" class="text-[10px] text-slate-500 font-black tracking-widest uppercase">Pág
                    1/1</span>
                <button id="btn-next" onclick="cargarPromos(paginaActual+1)"
                    class="text-[10px] font-black uppercase tracking-widest text-emerald-600 px-3 py-1.5 rounded-lg border border-emerald-200 hover:bg-emerald-100 disabled:opacity-50 disabled:cursor-not-allowed transition-all">Sig</button>
            </div>
        </div>
    </main>

    <script>
        let paginaActual = 0;
        let paginasTotales = 0;

        document.addEventListener("DOMContentLoaded", () => cargarPromos(0));

        async function cargarPromos(page) {
            paginaActual = page;
            const grid = document.getElementById('grid-promos');
            grid.innerHTML = '<p class="p-4 text-emerald-600 text-sm font-bold animate-pulse">Cargando...</p>';

            const filtroTitulo = document.getElementById('filtro-titulo').value;
            const filtroEstado = document.getElementById('filtro-estado').value;

            try {
                const params = new URLSearchParams({
                    page: paginaActual,
                    size: 4
                });
                if (filtroEstado) params.append('estado', filtroEstado);
                if (filtroTitulo) params.append('titulo', filtroTitulo);

                const res = await fetch(`http://localhost:8080/api/promociones/mis-promociones?${params}`, {
                    headers: { 'Authorization': `Bearer ${token}` }
                });
                if (res.ok) {
                    const data = await res.json();
                    const promos = data.content || data;
                    paginasTotales = data.totalPages || 1;

                    document.getElementById('info-pag').innerText = `Pág ${paginaActual + 1} de ${paginasTotales}`;
                    document.getElementById('btn-prev').disabled = paginaActual === 0;
                    document.getElementById('btn-next').disabled = paginaActual >= paginasTotales - 1;

                    if (promos.length === 0) {
                        grid.innerHTML = '<p class="text-slate-400 text-sm">No tienes promociones activas.</p>';
                        return;
                    }

                    grid.innerHTML = promos.map(p => {
                        let estadoVirtual = 'ACTIVA';
                        if (p.activo === false) {
                            estadoVirtual = 'INACTIVA';
                        } else if (p.usosMaximos > 0 && (p.usosActuales || 0) >= p.usosMaximos) {
                            estadoVirtual = 'AGOTADA';
                        } else if (p.fechaFin && new Date(p.fechaFin + 'T23:59:59') < new Date()) {
                            estadoVirtual = 'VENCIDA';
                        }

                        let badgeEstilo = "bg-emerald-100 text-emerald-800";
                        let badgeTexto = "ACTIVA";

                        if (estadoVirtual === 'VENCIDA') {
                            badgeEstilo = "bg-slate-200 text-slate-500"; badgeTexto = "VENCIDA";
                        } else if (estadoVirtual === 'AGOTADA') {
                            badgeEstilo = "bg-orange-100 text-orange-700"; badgeTexto = "AGOTADA";
                        } else if (estadoVirtual === 'INACTIVA') {
                            badgeEstilo = "bg-red-100 text-red-700"; badgeTexto = "DESACTIVADA";
                        }

                        return `
                        <div class="bg-slate-50 p-4 rounded-xl border ${estadoVirtual === 'ACTIVA' ? 'border-emerald-200' : 'border-slate-200 opacity-80'} flex flex-col justify-between group hover:shadow-md transition-all">
                            <div>
                                <div class="flex justify-between items-start mb-1 gap-2">
                                    <h4 class="font-black text-slate-800 text-sm leading-tight line-clamp-1" title="${p.titulo}">${p.titulo}</h4>
                                    <div class="flex gap-1 items-center shrink-0">
                                        ${p.codigoCupon ? `<span class="text-[9px] font-black text-emerald-600 bg-emerald-50 px-1.5 py-0.5 rounded border border-emerald-100 uppercase tracking-widest" title="Código">${p.codigoCupon}</span>` : ''}
                                        <span class="${badgeEstilo} font-black text-[8px] px-2 py-0.5 rounded uppercase tracking-widest border border-white/20">${badgeTexto}</span>
                                    </div>
                                </div>
                                <p class="text-[10px] text-slate-500 line-clamp-2 leading-relaxed mb-3">${p.descripcion}</p>
                            </div>
                            <div class="mt-auto pt-3 border-t border-slate-200 flex justify-between items-center">
                                <div class="flex gap-2">
                                    <span class="text-[10px] font-black text-emerald-700 bg-white px-2 py-1 rounded border border-emerald-100 shadow-sm" title="Descuento">-${p.descuentoPorcentaje}%</span>
                                    <span class="text-[10px] font-bold text-slate-500 flex items-center bg-white px-2 py-1 rounded border border-slate-200 shadow-sm" title="Usos Actuales">👤 ${p.usosActuales || 0}/${p.usosMaximos}</span>
                                </div>
                                ${estadoVirtual === 'ACTIVA' ? `<button onclick="eliminarPromo(${p.id})" class="text-[9px] font-black tracking-widest text-red-500 hover:bg-red-50 px-2 py-1.5 rounded transition-colors uppercase border border-transparent hover:border-red-100">Desactivar</button>` : `<span class="text-[9px] text-slate-400 font-bold tracking-widest uppercase">FIN</span>`}
                            </div>
                        </div>
                    `;
                    }).join('');
                }
            } catch (e) { grid.innerHTML = '<p class="text-red-500">Error al cargar.</p>'; }
        }

        document.getElementById('form-promo').addEventListener('submit', async (e) => {
            e.preventDefault();
            const payload = {
                titulo: document.getElementById('titulo').value,
                codigoCupon: document.getElementById('codigo').value.toUpperCase(),
                descripcion: document.getElementById('desc-promo').value,
                descuentoPorcentaje: parseInt(document.getElementById('descuento').value),
                usosMaximos: parseInt(document.getElementById('usos').value),
                fechaInicio: document.getElementById('fecha-inicio').value,
                fechaFin: document.getElementById('fecha-fin').value
            };
            try {
                const res = await fetch('http://localhost:8080/api/promociones', {
                    method: 'POST',
                    headers: { 'Authorization': `Bearer ${token}`, 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });
                if (res.ok) {
                    alert("Promoción lanzada con éxito.");
                    document.getElementById('form-promo').reset();
                    cargarPromos(0);
                }
            } catch (err) { alert("Error al crear promo."); }
        });

        async function eliminarPromo(id) {
            if (!confirm("¿Desactivar esta promoción?")) return;
            const res = await fetch(`http://localhost:8080/api/promociones/${id}`, {
                method: 'DELETE', headers: { 'Authorization': `Bearer ${token}` }
            });
            if (res.ok) cargarPromos(paginaActual);
        }

        function cerrarSesion() {
            localStorage.clear();
            sessionStorage.clear();
            window.location.href = '/login.html';
        }
    </script>
</body>

</html>
