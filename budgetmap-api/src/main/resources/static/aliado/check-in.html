<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Check-in Rápido | BudgetMap</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    const token = localStorage.getItem('jwt_token');
    if (!token || localStorage.getItem('user_rol') !== 'LOCAL_ALIADO') window.location.href = '/login.html';
  </script>
</head>
<body class="bg-slate-900 min-h-screen text-white font-sans flex flex-col justify-center items-center p-6">

  <button onclick="location.href='dashboard.html'" class="absolute top-6 left-6 text-emerald-400 text-xs font-bold uppercase tracking-widest hover:text-white transition">
    ◀ Volver al Panel
  </button>

  <div class="w-full max-w-sm bg-slate-800 p-8 rounded-3xl border border-emerald-900 shadow-2xl text-center">
    <div class="w-16 h-16 bg-emerald-900/50 rounded-full flex items-center justify-center mx-auto mb-6 border border-emerald-500/30">
        <svg class="w-8 h-8 text-emerald-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v1m6 11h2m-6 0h-2v4m0-11v3m0 0h.01M12 12h4.01M16 20h4M4 12h4m12 0h.01M5 8h2a1 1 0 001-1V5a1 1 0 00-1-1H5a1 1 0 00-1 1v2a1 1 0 001 1zm14 0h2a1 1 0 001-1V5a1 1 0 00-1-1h-2a1 1 0 00-1 1v2a1 1 0 001 1zM5 20h2a1 1 0 001-1v-2a1 1 0 00-1-1H5a1 1 0 00-1 1v2a1 1 0 001 1z"></path></svg>
    </div>

    <h2 class="text-xl font-black uppercase tracking-widest mb-2">Ingreso de Clientes</h2>
    <p class="text-xs text-slate-400 mb-8">Digita el código de reserva proporcionado por el explorador.</p>

    <input type="text" id="codigo-reserva" placeholder="EJ: RES-12345" class="w-full bg-slate-900 border border-slate-700 text-center rounded-xl p-4 text-xl font-black text-emerald-400 uppercase tracking-widest outline-none focus:border-emerald-500 transition-all mb-4">
    
    <button onclick="validarReserva()" id="btn-validar" class="w-full bg-emerald-600 text-white font-black py-4 rounded-xl text-sm uppercase tracking-widest hover:bg-emerald-500 transition-all shadow-lg shadow-emerald-900/50">
        Validar Acceso
    </button>
  </div>

  <div id="modal-resultado" class="fixed inset-0 bg-slate-900/90 hidden flex items-center justify-center z-50 p-6 backdrop-blur-sm">
    <div class="bg-slate-800 p-8 rounded-3xl border border-slate-700 text-center max-w-sm w-full">
        <div id="modal-icon" class="text-5xl mb-4">✅</div>
        <h3 id="modal-title" class="text-xl font-black uppercase mb-2">Aprobado</h3>
        <p id="modal-msg" class="text-sm text-slate-400 mb-8">Reserva válida para 2 personas.</p>
        <button onclick="cerrarModal()" class="w-full bg-slate-700 text-white font-bold py-3 rounded-xl uppercase text-xs hover:bg-slate-600">Siguiente Cliente</button>
    </div>
  </div>

  <script>
    async function validarReserva() {
        const codigo = document.getElementById('codigo-reserva').value.trim();
        if(!codigo) return;
        
        const btn = document.getElementById('btn-validar');
        btn.innerText = 'VERIFICANDO...';
        
        try {
            // Llama a tu endpoint de confirmación
            const res = await fetch(`https://budgetmap-api.onrender.com/api/reservas/confirmar/${codigo}`, {
                method: 'PUT',
                headers: { 'Authorization': `Bearer ${token}` }
            });
            
            if (res.ok) {
                mostrarModal("✅", "ACCESO APROBADO", "La reserva ha sido redimida correctamente en el sistema.");
            } else {
                mostrarModal("❌", "CÓDIGO INVÁLIDO", "La reserva no existe, ya fue usada o no pertenece a este local.");
            }
        } catch (e) {
            mostrarModal("⚠️", "ERROR DE RED", "No se pudo conectar con el servidor.");
        } finally {
            btn.innerText = 'Validar Acceso';
            document.getElementById('codigo-reserva').value = '';
        }
    }

    function mostrarModal(icon, title, msg) {
        document.getElementById('modal-icon').innerHTML = icon;
        document.getElementById('modal-title').textContent = title;
        document.getElementById('modal-msg').innerHTML = msg;
        document.getElementById('modal-resultado').classList.remove('hidden');
    }

    function cerrarModal() {
        document.getElementById('modal-resultado').classList.add('hidden');
        document.getElementById('codigo-reserva').focus();
    }
  </script>
</body>
</html>
