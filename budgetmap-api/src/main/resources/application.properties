# ==============================================================
# CONFIGURACIÓN LOCAL BUDGETMAP (WORKBENCH 8.2 CON SRID)
# ==============================================================
spring.application.name=budgetmap-api
server.port=8080

# --- 1. Base de Datos Local ---
# Cambiamos 'localhost' por '127.0.0.1' para evitar la latencia de resolución de DNS (IPv6 vs IPv4)
# Las variables de entorno (ej: ${DB_URL}) permiten usar la DB de la nube en producción y localhost en local
spring.datasource.url=${DB_URL:jdbc:mysql://127.0.0.1:3306/budgetmap?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=America/Bogota&allowPublicKeyRetrieval=true}
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:2612}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# --- Pool de Conexiones Optimizado (HikariCP) ---
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.max-lifetime=1200000

# --- 2. JPA / Hibernate ---
spring.jpa.hibernate.ddl-auto= update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.type.descriptor.sql.enum.jakarta_persistence_enum_type=string

# --- 3. Seguridad JWT ---
jwt.secret=${JWT_SECRET:miClaveSecretaMuyLargaYParaBudgetMap2024SeguraConMasCaracteres1234567890}
jwt.expiration=86400000

# --- 4. Microservicio Python (Flask) ---
python.service.url=${PYTHON_SERVICE_URL:http://localhost:5000}

# --- 5. Configuración Web y Formatos ---
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
spring.jackson.date-format=yyyy-MM-dd HH:mm:ss
spring.jackson.time-zone=America/Bogota

# --- 6. CORS (Permisivo para desarrollo local) ---
cors.allowed-origins=*

# --- 7. Rate Limiting ---
rate.limiting.enabled=true
rate.limiting.max-requests-per-minute=1000
rate.limiting.auth-max-requests-per-minute=500

# --- 8. Feign Client & Resiliencia ---
feign.client.config.default.connectTimeout=5000
feign.client.config.default.readTimeout=10000

# --- 9. PASARELA DE PAGOS (SIMULADOR) ---
budgetmap.url.webhook=${WEBHOOK_URL:https://tu-dominio-ngrok.com/api/pagos/webhook}

resilience4j.circuitbreaker.instances.pythonService.failureRateThreshold=50
resilience4j.circuitbreaker.instances.pythonService.waitDurationInOpenState=30s
resilience4j.circuitbreaker.instances.pythonService.permittedNumberOfCallsInHalfOpenState=3

resilience4j.retry.instances.pythonService.maxAttempts=3
resilience4j.retry.instances.pythonService.waitDuration=1s

logging.level.root=WARN
logging.level.com.budgetmap=INFO
logging.level.com.budgetmap.service=DEBUG

# Formato profesional para la consola
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} - %logger{36} - %msg%n

# Guardar los logs en un archivo fisico
logging.file.name=logs/budgetmap.log
logging.file.max-size=10MB
logging.file.max-history=10

# --- 10. REDIS CACHE ---
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.password=${REDIS_PASSWORD:}
spring.cache.type=none
spring.cache.redis.time-to-live=3600000
