# ==============================================================
# CONFIGURACIÓN LOCAL BUDGETMAP (WORKBENCH 8.2 CON SRID)
# ==============================================================
spring.application.name=budgetmap-api
server.port=8080

# --- 1. Base de Datos Local ---
# Conexión directa a tu Workbench
spring.datasource.url=jdbc:mysql://localhost:3306/budgetmap?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=America/Bogota&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# --- 2. JPA / Hibernate ---
# ¡CRÍTICO!: En 'none' para proteger tus métricas SRID 4326 y los índices espaciales.
# Spring Boot NO alterará la estructura que ya creaste con tu script SQL.
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.type.descriptor.sql.enum.jakarta_persistence_enum_type=string

# --- 3. Seguridad JWT ---
jwt.secret=${JWT_SECRET}
jwt.expiration=86400000

# --- 4. Microservicio Python (Flask) ---
python.service.url=http://localhost:5000

# --- 5. Configuración Web y Formatos ---
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
spring.jackson.date-format=yyyy-MM-dd HH:mm:ss
spring.jackson.time-zone=America/Bogota

# --- 6. CORS (Permisivo para desarrollo local) ---
cors.allowed-origins=*

# --- 7. Rate Limiting ---
rate.limiting.enabled=true
rate.limiting.max-requests-per-minute=100
rate.limiting.auth-max-requests-per-minute=5

# --- 8. Feign Client & Resiliencia ---
feign.client.config.default.connectTimeout=5000
feign.client.config.default.readTimeout=10000

# --- 9. PASARELA DE PAGOS (MERCADO PAGO) ---
mercadopago.access-token=${MP_ACCESS_TOKEN}
budgetmap.url.webhook=budgetmap.url.webhook=http://localhost:8080/api/pagos/webhook

resilience4j.circuitbreaker.instances.pythonService.failureRateThreshold=50
resilience4j.circuitbreaker.instances.pythonService.waitDurationInOpenState=30s
resilience4j.circuitbreaker.instances.pythonService.permittedNumberOfCallsInHalfOpenState=3

resilience4j.retry.instances.pythonService.maxAttempts=3
resilience4j.retry.instances.pythonService.waitDuration=1s

logging.level.root=WARN
logging.level.com.budgetmap=INFO
logging.level.com.budgetmap.service=DEBUG

# Formato profesional para la consola
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} - %logger{36} - %msg%n

# Guardar los logs en un archivo fisico
logging.file.name=logs/budgetmap.log
logging.file.max-size=10MB
logging.file.max-history=10