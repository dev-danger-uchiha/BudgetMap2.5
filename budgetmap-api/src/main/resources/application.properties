# Application
spring.application.name=budgetmap-api
server.port=8080

# Configuración de JDBC (Render usará las variables de entorno si las dejas así)
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=org.mariadb.jdbc.Driver
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

# JPA Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Database
spring.datasource.url=jdbc:mysql://localhost:3306/budgetmap?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=America/Bogota&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=2612
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update   
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.type.descriptor.sql.enum.jakarta_persistence_enum_type=string

# JWT   miClaveSecretaMuyLargaYParaBudgetMap2024SeguraConMasCaracteres1234567890   Windows PowerShell: $env:JWT_SECRET = -join ((48..57) + (65..90) + (97..122) | Get-Random -Count 64 | % {[char]$_})
jwt.secret=miClaveSecretaMuyLargaYParaBudgetMap2024SeguraConMasCaracteres1234567890 
jwt.expiration=86400000

# PYTHON SERVICE - NUEVO: URL configurable
python.service.url=${PYTHON_URL:http://localhost:5000}

# Logging
logging.level.org.springframework.security=INFO
logging.level.com.budgetmap=INFO

# File Upload (if needed)
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# Jackson
spring.jackson.date-format=yyyy-MM-dd HH:mm:ss
spring.jackson.time-zone=America/Bogota

# CORS
# cors.allowed-origins=${CORS_ALLOWED_ORIGINS: CORS_ALLOWED_ORIGINS=http://localhost:8080,http://localhost:3000}http://localhost:8080,http://localhost:3000}
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:*}

# RATE LIMITING
rate.limiting.enabled=true
rate.limiting.max-requests-per-minute=100
rate.limiting.auth-max-requests-per-minute=5

# Feign Client Timeouts
feign.client.config.default.connectTimeout=5000
feign.client.config.default.readTimeout=10000
 
# Circuit Breaker
resilience4j.circuitbreaker.instances.pythonService.failureRateThreshold=50
resilience4j.circuitbreaker.instances.pythonService.waitDurationInOpenState=30s
resilience4j.circuitbreaker.instances.pythonService.permittedNumberOfCallsInHalfOpenState=3
 
# Retry
resilience4j.retry.instances.pythonService.maxAttempts=3
resilience4j.retry.instances.pythonService.waitDuration=1s

