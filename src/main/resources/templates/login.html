<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Iniciar sesión</title>
</head>
<body>
  <!-- Logo -->
  <div>
    <img src="/tu-logo.png" alt="Logo">
  </div>

  <main>
    <h2>Login</h2>

    <!-- Formulario de login -->
    <form th:action="@{/login}" method="post">
      <!-- CSRF token -->
      <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />

      <!-- Usuario -->
      <div>
        <label for="username">Usuario:</label>
        <input type="text" name="username" id="username" required autofocus />
      </div>

      <!-- Contraseña -->
      <div>
        <label for="password">Contraseña:</label>
        <input type="password" name="password" id="password" required />
      </div>

      <!-- Botón ingresar -->
      <div>
        <button type="submit">Ingresar</button>
      </div>
    </form>

    <!-- Enlaces adicionales -->
    <div>
      <a th:href="@{/password/request}">¿Olvidaste tu contraseña?</a>
    </div>
    <div>
      <a th:href="@{/rol}">¿No tienes cuenta? Regístrate aquí</a>
    </div>

    <!-- Mensajes dinámicos -->
    <div th:if="${param.error}">
      <p style="color:red;">Usuario o contraseña incorrectos</p>
    </div>

    <div id="mensajeLogout" th:if="${param.logout}">
      <p style="color:green;">Sesión cerrada correctamente</p>
    </div>

    <div id="mensajeDenied" th:if="${param.denied}">
      <p style="color:red;">Acceso denegado. No tienes permisos para ver esta página.</p>
    </div>
  </main>

  <!-- JavaScript: Ocultar mensajes después de 2 segundos -->
  <script>
    setTimeout(function () {
      const logoutMsg = document.getElementById("mensajeLogout");
      const deniedMsg = document.getElementById("mensajeDenied");
      if (logoutMsg) logoutMsg.style.display = "none";
      if (deniedMsg) deniedMsg.style.display = "none";
    }, 2000);
  </script>
</body>
</html>
