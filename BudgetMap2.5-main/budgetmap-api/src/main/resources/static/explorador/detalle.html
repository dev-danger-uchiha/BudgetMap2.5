<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Detalles | BudgetMap</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    const token = localStorage.getItem('jwt_token');
    if (!token) window.location.href = '/login.html';
  </script>
</head>
<body class="bg-slate-50 font-sans pb-32 text-slate-800">

  <!-- BARRA DE NAVEGACIÓN -->
  <nav class="w-full p-6 md:px-12 lg:px-20 flex justify-between items-center">
    <button onclick="history.back()" class="bg-white text-slate-700 px-5 py-2.5 rounded-full font-bold text-sm shadow-sm border border-slate-200 hover:shadow-md hover:-translate-x-1 hover:text-orange-600 transition-all flex items-center gap-2">
        <span>←</span> Volver al Mapa
    </button>
  </nav>

  <main class="w-full px-6 md:px-12 lg:px-20 grid grid-cols-1 md:grid-cols-12 gap-10 mt-2">
    
    <!-- COLUMNA IZQUIERDA: IMAGEN -->
    <div class="md:col-span-5 lg:col-span-5 relative group">
       <div class="relative w-full aspect-square md:aspect-[4/5] rounded-[2.5rem] overflow-hidden shadow-2xl bg-slate-900 ring-1 ring-slate-900/5">
           <img id="det-img" src="https://images.unsplash.com/photo-1517248135467-4c7edcad34c4?w=800&q=80" class="w-full h-full object-cover transition-transform duration-700 group-hover:scale-105 opacity-90 group-hover:opacity-100">
           <div class="absolute inset-0 bg-gradient-to-t from-slate-900/80 via-transparent to-transparent pointer-events-none"></div>
       </div>
       <div class="absolute top-6 left-6 z-10">
           <span id="det-cat" class="bg-white/90 backdrop-blur-md text-slate-900 px-5 py-2.5 rounded-2xl text-[10px] font-black uppercase tracking-widest shadow-xl">CATEGORÍA</span>
       </div>
    </div>

    <!-- COLUMNA DERECHA: INFORMACIÓN -->
    <div class="md:col-span-7 lg:col-span-7 flex flex-col justify-center py-4">
        
        <h1 id="det-nombre" class="text-4xl md:text-5xl lg:text-6xl font-black text-slate-900 uppercase tracking-tighter leading-none mb-5 drop-shadow-sm">Cargando...</h1>
        
        <div class="flex items-center gap-2 text-slate-500 font-bold mb-10 bg-white w-max px-5 py-2.5 rounded-full shadow-sm border border-slate-100">
            <span class="text-orange-500 text-lg">📍</span>
            <span id="det-dir">Buscando ubicación...</span>
        </div>

        <div class="grid grid-cols-2 gap-5 mb-10">
            <div class="bg-gradient-to-br from-white to-slate-50 p-6 rounded-3xl shadow-sm border border-slate-200 hover:border-orange-200 transition-colors group">
                <p class="text-[10px] font-black text-slate-400 uppercase tracking-widest mb-1 group-hover:text-orange-400 transition-colors">Aforo Disponible</p>
                <p class="text-4xl font-black text-orange-500"><span id="det-aforo">--</span> <span class="text-sm text-slate-400 font-bold">Cupos</span></p>
            </div>
            <div class="bg-gradient-to-br from-white to-slate-50 p-6 rounded-3xl shadow-sm border border-slate-200 hover:border-orange-200 transition-colors group">
                <p class="text-[10px] font-black text-slate-400 uppercase tracking-widest mb-1 group-hover:text-orange-400 transition-colors">Precio / Costo</p>
                <p id="det-precio" class="text-3xl font-black text-slate-800 mt-1">Gratis</p>
            </div>
        </div>

        <div class="mb-10">
            <h3 class="font-black text-slate-800 uppercase tracking-widest text-xs mb-4 flex items-center gap-3">
                <span class="w-8 h-1 bg-gradient-to-r from-orange-500 to-amber-400 rounded-full"></span> ACERCA DEL LUGAR
            </h3>
            <p id="det-desc" class="text-base md:text-lg text-slate-600 leading-relaxed font-medium">Obteniendo información detallada del sitio...</p>
        </div>

        <div>
            <h3 class="font-black text-slate-800 uppercase tracking-widest text-xs mb-5 flex items-center gap-3">
                <span class="w-8 h-1 bg-gradient-to-r from-orange-500 to-amber-400 rounded-full"></span> 🎟️ PROMOCIONES Y CUPONES
            </h3>
            <div id="contenedor-promos" class="space-y-4">
                <p class="text-sm text-slate-400 font-bold italic py-4">Buscando promociones activas...</p>
            </div>
        </div>

    </div>
  </main>

  <!-- BARRA INFERIOR FLOTANTE DE RESERVAS -->
  <div id="reserva-bar" class="fixed bottom-6 left-1/2 -translate-x-1/2 w-[calc(100%-1rem)] max-w-4xl bg-slate-900/95 backdrop-blur-xl border border-white/10 p-3 rounded-[2.5rem] shadow-2xl z-50 flex flex-wrap md:flex-nowrap justify-center items-center gap-3">
      <input type="date" id="reserva-fecha" class="bg-white/10 hover:bg-white/20 border-none text-white text-sm font-bold rounded-2xl px-4 py-3 outline-none cursor-pointer transition-colors w-full md:w-auto" required>
      <input type="time" id="reserva-hora" class="bg-white/10 hover:bg-white/20 border-none text-white text-sm font-bold rounded-2xl px-4 py-3 outline-none cursor-pointer transition-colors w-full md:w-auto" required>
      <select id="reserva-personas" class="bg-white/10 hover:bg-white/20 border-none text-white text-sm font-bold rounded-2xl px-4 py-3 outline-none cursor-pointer appearance-none transition-colors w-full md:w-auto text-center">
          <option value="1" class="text-slate-800">1 Persona</option>
          <option value="2" class="text-slate-800">2 Personas</option>
          <option value="3" class="text-slate-800">3 Personas</option>
          <option value="4" class="text-slate-800">4 Personas</option>
          <option value="5" class="text-slate-800">5 Personas</option>
          <option value="6" class="text-slate-800">6 Personas</option>
      </select>
      <button onclick="procesarReserva()" id="btn-reservar" class="w-full md:flex-1 bg-gradient-to-r from-orange-500 to-amber-500 text-white font-black text-sm uppercase tracking-widest py-3 px-6 rounded-2xl shadow-lg transform hover:scale-[1.02] hover:shadow-orange-500/50 transition-all flex justify-center items-center gap-2">
          Asegurar Cupo <span class="text-lg leading-none">🚀</span>
      </button>
  </div>

  <script>
    const params = new URLSearchParams(window.location.search);
    const id = params.get('id');
    const tipo = params.get('tipo'); 

    document.addEventListener("DOMContentLoaded", async () => {
        if (!id || !tipo) return;

        // Ocultar la barra de reservas si es un lugar público (no aplica)
        if (tipo === 'lugar') {
            const reservaBar = document.querySelector('#reserva-bar');
            if(reservaBar) reservaBar.style.display = 'none';
        } else {
            // Inicializar fecha para mañana (regla: la fecha debe ser futura)
            const tomorrow = new Date();
            tomorrow.setDate(tomorrow.getDate() + 1);
            const dateString = tomorrow.toISOString().split('T')[0];
            const inputFecha = document.getElementById('reserva-fecha');
            if(inputFecha) {
                inputFecha.min = dateString;
                inputFecha.value = dateString;
                document.getElementById('reserva-hora').value = '19:00';
            }
        }

        try {
            let url;
            if (tipo === 'establecimiento') {
                url = `https://budgetmap-api.onrender.com/api/establecimientos/${id}`;
            } else if (tipo === 'lugar') {
                url = `https://budgetmap-api.onrender.com/api/lugares/${id}`;
            } else {
                url = `https://budgetmap-api.onrender.com/api/eventos/${id}`;
            }
            
            const response = await fetch(url, { headers: { 'Authorization': `Bearer ${token}` } });
            if (response.ok) {
                const data = await response.json();
                document.getElementById('det-nombre').innerText = data.nombre;
                document.getElementById('det-cat').innerText = data.categoria || data.tipoEvento || 'PÚBLICO';
                document.getElementById('det-desc').innerText = data.descripcion || 'Sin descripción disponible.';
                
                if (data.imagenUrl) {
                    document.getElementById('det-img').src = data.imagenUrl;
                }

                // Aforo
                if (tipo === 'lugar') {
                    document.getElementById('det-aforo').innerText = data.aforoMaximo ? data.aforoMaximo : '--';
                } else {
                    document.getElementById('det-aforo').innerText = data.aforoActual !== undefined ? data.aforoMaximo - data.aforoActual : '--';
                }

                // Ubicación
                let dir = data.direccion;
                if (!dir && data.lugar) dir = data.lugar.direccion;
                if (!dir && data.establecimiento) dir = data.establecimiento.direccion;
                document.getElementById('det-dir').innerText = `📍 ${dir || 'Ubicación'}`;
                
                // Precio
                if(tipo === 'evento') {
                    document.getElementById('det-precio').innerText = data.precio > 0 ? `$${data.precio}` : 'Gratis';
                }

                // Promociones
                if (tipo === 'establecimiento') cargarPromos(id);
                else document.getElementById('contenedor-promos').innerHTML = '<p class="text-sm text-slate-400 font-bold italic p-4">Los eventos y lugares no aplican cupones por ahora.</p>';
            }
        } catch (error) { console.error("Error al cargar detalle", error); }
    });

    async function cargarPromos(estId) {
        const contenedor = document.getElementById('contenedor-promos');
        try {
            const response = await fetch(`https://budgetmap-api.onrender.com/api/promociones/establecimiento/${estId}`, {
                headers: { 'Authorization': `Bearer ${token}` }
            });
            if (response.ok) {
                const promociones = await response.json();
                if(promociones.length > 0) {
                    contenedor.innerHTML = '';
                    promociones.forEach(p => {
                        contenedor.innerHTML += `
                            <div class="bg-white p-5 rounded-3xl border border-orange-200 flex justify-between items-center shadow-sm">
                                <div>
                                    <h4 class="font-black text-orange-600 text-lg">${p.titulo}</h4>
                                    <p class="text-xs text-slate-500">${p.descripcion}</p>
                                    <span class="inline-block mt-2 bg-amber-100 text-amber-700 text-[10px] font-bold px-2 py-0.5 rounded uppercase">CÓDIGO: ${p.codigoCupon}</span>
                                </div>
                                <div class="text-center bg-slate-50 px-4 py-2 rounded-xl">
                                    <span class="block text-2xl font-black text-slate-800">-${p.descuentoPorcentaje}%</span>
                                </div>
                            </div>
                        `;
                    });
                } else {
                    contenedor.innerHTML = '<p class="text-sm text-slate-400 font-bold italic p-4">No hay promociones activas en este momento.</p>';
                }
            }
        } catch (e) { contenedor.innerHTML = '<p class="text-red-500 text-sm">Error al cargar cupones.</p>'; }
    }

    async function procesarReserva() {
        if (tipo === 'lugar') return; // Seguridad extra
        
        const fecha = document.getElementById('reserva-fecha').value;
        const hora = document.getElementById('reserva-hora').value;
        if (!fecha || !hora) {
            alert("Por favor, selecciona una fecha y una hora.");
            return;
        }

        const btn = document.getElementById('btn-reservar');
        btn.innerHTML = "PROCESANDO... ⏳";
        btn.disabled = true;

        const personas = document.getElementById('reserva-personas').value;
        const payload = { 
            numeroPersonas: parseInt(personas),
            fechaReserva: fecha,
            horaInicio: hora + ":00" // Backend espera formato LocalTime (HH:mm:ss)
        };
        
        if(tipo === 'establecimiento') payload.establecimientoId = parseInt(id);
        else payload.eventoId = parseInt(id);

        try {
            const res = await fetch(`https://budgetmap-api.onrender.com/api/reservas`, {
                method: 'POST',
                headers: { 'Authorization': `Bearer ${token}`, 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
            });
            
            if(res.ok) {
                alert("¡Reserva confirmada! Tu código digital ha sido generado.");
                window.location.href = '/explorador/mis-reservas.html';
            } else { 
                const errorData = await res.json();
                alert(`Error: ${errorData.message || "No hay aforo suficiente o datos inválidos."}`); 
                btn.innerHTML = 'Asegurar Cupo <span class="text-lg leading-none">🚀</span>';
                btn.disabled = false;
            }
        } catch(e) { 
            alert("Error crítico de red.");
            btn.innerHTML = 'Asegurar Cupo <span class="text-lg leading-none">🚀</span>';
            btn.disabled = false;
        }
    }
  </script>
</body>
</html>
