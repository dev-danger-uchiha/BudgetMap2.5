<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestión de Eventos | BudgetMap</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        const token = localStorage.getItem('jwt_token');
        if (!token || localStorage.getItem('user_rol') !== 'ANFITRION') window.location.href = '/login.html';
    </script>
</head>

<body class="bg-slate-50 min-h-screen text-slate-800 font-sans pb-20">

    <nav class="bg-white border-b border-blue-100 p-4 sticky top-0 z-50 shadow-sm">
        <div class="w-full px-4 md:px-10 flex flex-col md:flex-row justify-between items-center gap-4 md:gap-0">
            <div class="flex items-center gap-2 md:gap-4 w-full md:w-auto justify-between md:justify-start">
                <div class="flex items-center gap-2 md:gap-4">
                    <div class="relative bg-white rounded-full w-12 h-12 md:w-16 md:h-16 shadow-md ring-1 ring-black/5 flex items-center justify-center z-0 hidden sm:flex">
                        <img src="/images/logo.png" alt="Logo BudgetMap" class="absolute w-16 h-16 md:w-24 md:h-24 max-w-none object-contain transform transition duration-500 hover:scale-110 top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 z-40 drop-shadow-xl" />
                    </div>
                    <span class="text-xl font-black tracking-widest drop-shadow-md mx-2"><a href="/index.html" class="hover:text-emerald-600 transition">BUDGETMAP</a></span>
                    <span class="bg-blue-600 text-white px-3 py-1 rounded-full font-black text-[10px] uppercase tracking-tighter">ANFITRIÓN</span>
                    <h1 class="font-black tracking-widest text-blue-900 uppercase hidden sm:block">PANEL DE CONTROL</h1>
                </div>
                <button onclick="cerrarSesion()" class="text-[10px] font-bold text-red-500 hover:text-red-700 md:hidden bg-red-50 px-3 py-1.5 rounded-lg border border-red-100">SALIR</button>
            </div>
            
            <div class="flex gap-4 md:gap-6 text-[10px] md:text-xs font-bold uppercase tracking-widest overflow-x-auto whitespace-nowrap w-full md:w-auto pb-2 md:pb-0 no-scrollbar" style="-ms-overflow-style:none; scrollbar-width:none;">
                <style> .no-scrollbar::-webkit-scrollbar { display: none; } </style>
                <a href="/anfitrion/dashboard.html" class="text-slate-400 hover:text-blue-600 transition">Resumen</a>
                <a href="/anfitrion/mis-eventos.html" class="text-blue-600 border-b-2 border-blue-600 pb-1">Mis Eventos</a>
            </div>
            
            <button onclick="cerrarSesion()" class="text-[12px] text-slate-400 font-bold hover:text-red-500 transition hidden md:block">SALIR</button>
        </div>
    </nav>

    <main class="w-full px-6 md:px-10 mt-8 grid grid-cols-1 lg:grid-cols-3 gap-8">

        <div class="lg:col-span-1 bg-white p-6 rounded-3xl border border-blue-100 shadow-sm h-fit sticky top-24">
            <h3 class="font-black text-slate-900 uppercase tracking-tighter mb-6 border-b border-blue-50 pb-4">Programar
                Evento</h3>
            <form id="eventoForm" class="flex flex-col gap-4">
                <div>
                    <label class="text-[10px] font-bold text-slate-400 uppercase">Nombre del Evento</label>
                    <input type="text" id="nombre" required
                        class="w-full mt-1 bg-slate-50 border rounded-xl p-3 text-sm outline-none focus:border-blue-500">
                </div>

                <div>
                    <label class="text-[10px] font-bold text-slate-400 uppercase">Lugar Físico</label>
                    <select id="lugarId" required
                        class="w-full mt-1 bg-slate-50 border rounded-xl p-3 text-sm outline-none focus:border-blue-500">
                        <option value="">Cargando lugares...</option>
                    </select>
                    <p class="text-[9px] text-emerald-600 font-bold mt-1">Solo sitios verificados.</p>
                </div>

                <div class="grid grid-cols-2 gap-4">
                    <div>
                        <label class="text-[10px] font-bold text-slate-400 uppercase">Categoría</label>
                        <select id="tipo" class="w-full mt-1 bg-slate-50 border rounded-xl p-3 text-xs outline-none">
                            <option value="ARTISTICO">Artístico/Concierto</option>
                            <option value="CULTURAL">Cultural/Teatro</option>
                            <option value="DEPORTIVO">Deportivo</option>
                            <option value="RECREATIVO">Feria/Social</option>
                        </select>
                    </div>
                    <div>
                        <label class="text-[10px] font-bold text-slate-400 uppercase">Boletas (Aforo)</label>
                        <input type="number" id="aforo" required
                            class="w-full mt-1 bg-slate-50 border rounded-xl p-3 text-xs outline-none">
                    </div>
                </div>

                <div class="grid grid-cols-2 gap-4">
                    <div>
                        <label class="text-[10px] font-bold text-slate-400 uppercase">Inicio</label>
                        <input type="date" id="fecha" required
                            class="w-full mt-1 bg-slate-50 border rounded-xl p-3 text-xs outline-none">
                    </div>
                    <div>
                        <label class="text-[10px] font-bold text-slate-400 uppercase">Fin</label>
                        <input type="date" id="fecha-fin" required
                            class="w-full mt-1 bg-slate-50 border rounded-xl p-3 text-xs outline-none">
                    </div>
                </div>

                <div class="grid grid-cols-2 gap-4">
                    <div class="col-span-2">
                        <label class="text-[10px] font-bold text-slate-400 uppercase">Hora de Inicio</label>
                        <input type="time" id="hora" required
                            class="w-full mt-1 bg-slate-50 border rounded-xl p-3 text-xs outline-none">
                    </div>
                </div>

                <div>
                    <label class="text-[10px] font-bold text-slate-400 uppercase">Costo de Entrada ($)</label>
                    <input type="number" id="precio" placeholder="Dejar en 0 si es Gratis"
                        class="w-full mt-1 bg-slate-50 border rounded-xl p-3 text-sm outline-none focus:border-blue-500">
                </div>

                <button type="submit" id="btn-submit"
                    class="w-full mt-4 bg-blue-600 text-white font-black py-4 rounded-xl text-xs uppercase hover:bg-blue-700 transition shadow-md">Publicar
                    Evento</button>
            </form>
        </div>

        <div class="lg:col-span-2">
            <div class="flex justify-between items-end mb-6">
                <h3 class="text-2xl font-black text-slate-900 italic tracking-tighter uppercase">Cartelera Activa</h3>
                <span id="info-pag" class="text-xs font-bold text-slate-400">Pág 1</span>
            </div>

            <div class="bg-white border border-blue-100 rounded-3xl p-4 shadow-sm mb-4">
                <div class="grid grid-cols-1 md:grid-cols-2 gap-3">
                    <div class="flex flex-col gap-1">
                        <label class="text-[10px] font-bold text-slate-400 uppercase tracking-widest">Búsqueda
                            (Nombre)</label>
                        <input type="text" id="filtro-nombre" placeholder="Ej: Concierto..."
                            class="bg-slate-50 border border-slate-100 rounded-xl px-3 py-2 text-sm outline-none focus:border-blue-500"
                            onchange="cargarEventos(0)">
                    </div>
                    <div class="flex flex-col gap-1">
                        <label class="text-[10px] font-bold text-slate-400 uppercase tracking-widest">Tipo</label>
                        <select id="filtro-tipo"
                            class="bg-slate-50 border border-slate-100 rounded-xl px-3 py-2 text-sm outline-none focus:border-blue-500"
                            onchange="cargarEventos(0)">
                            <option value="">Todos</option>
                            <option value="ARTISTICO">Artístico/Concierto</option>
                            <option value="CULTURAL">Cultural/Teatro</option>
                            <option value="DEPORTIVO">Deportivo</option>
                            <option value="RECREATIVO">Feria/Social</option>
                        </select>
                    </div>
                    <div class="flex flex-col gap-1 md:col-span-2">
                        <label class="text-[10px] font-bold text-slate-400 uppercase tracking-widest">Estado</label>
                        <select id="filtro-estado"
                            class="bg-slate-50 border border-slate-100 rounded-xl px-3 py-2 text-sm outline-none focus:border-blue-500"
                            onchange="cargarEventos(0)">
                            <option value="">Todos</option>
                            <option value="ACTIVA">Activa</option>
                            <option value="INACTIVA">Vencida</option>
                        </select>
                    </div>
                </div>
            </div>

            <div id="grid-eventos" class="grid grid-cols-1 md:grid-cols-2 gap-4">
                <p class="text-blue-600 font-bold animate-pulse text-sm">Cargando cartelera...</p>
            </div>

            <div class="mt-6 flex gap-2">
                <button id="btn-prev" onclick="cargarEventos(paginaActual-1)"
                    class="px-4 py-2 border border-blue-200 text-blue-700 rounded-lg text-xs font-bold hover:bg-blue-50 disabled:opacity-50">Anterior</button>
                <button id="btn-next" onclick="cargarEventos(paginaActual+1)"
                    class="px-4 py-2 bg-blue-600 text-white rounded-lg text-xs font-bold hover:bg-blue-700 disabled:opacity-50">Siguiente</button>
            </div>
        </div>
    </main>

    <script>
        let paginaActual = 0;
        let paginasTotales = 0;

        document.addEventListener("DOMContentLoaded", () => {
            const today = new Date().toISOString().split('T')[0];
            document.getElementById('fecha').min = today;
            document.getElementById('fecha-fin').min = today;

            cargarLugares();
            cargarEventos(0);
        });

        async function cargarLugares() {
            try {
                const res = await fetch('https://budgetmap-api.onrender.com/api/lugares/aprobados', { headers: { 'Authorization': `Bearer ${token}` } });
                if (res.ok) {
                    const lugares = await res.json();
                    const sel = document.getElementById('lugarId');
                    sel.innerHTML = '<option value="">Selecciona la locación...</option>';
                    lugares.forEach(l => sel.innerHTML += `<option value="${l.id}">${l.nombre} (${l.categoria})</option>`);
                }
            } catch (e) { console.error("Error cargando locaciones"); }
        }

        async function cargarEventos(page) {
            paginaActual = page;
            const grid = document.getElementById('grid-eventos');

            const filtroNombre = document.getElementById('filtro-nombre').value;
            const filtroTipo = document.getElementById('filtro-tipo').value;
            const filtroEstado = document.getElementById('filtro-estado').value;

            try {
                const params = new URLSearchParams({
                    page: paginaActual,
                    size: 4
                });
                if (filtroTipo) params.append('tipo', filtroTipo);
                if (filtroNombre) params.append('nombre', filtroNombre);
                if (filtroEstado) params.append('estado', filtroEstado);

                const res = await fetch(`https://budgetmap-api.onrender.com/api/eventos/mis-eventos?${params}`, { headers: { 'Authorization': `Bearer ${token}` } });
                if (res.ok) {
                    const data = await res.json();
                    const eventos = data.content || data;
                    paginasTotales = data.totalPages || 1;

                    document.getElementById('info-pag').innerText = `Pág ${paginaActual + 1} de ${paginasTotales}`;
                    document.getElementById('btn-prev').disabled = paginaActual === 0;
                    document.getElementById('btn-next').disabled = paginaActual >= paginasTotales - 1;

                    if (eventos.length === 0) { grid.innerHTML = '<p class="text-slate-400 text-sm p-4">No tienes eventos en cartelera.</p>'; return; }

                    grid.innerHTML = eventos.map(ev => {
                        let estadoVirtual = 'ACTIVA';
                        if (ev.activo === false) {
                            estadoVirtual = 'INACTIVA';
                        } else if (ev.aforoMaximo > 0 && (ev.aforoActual || 0) >= ev.aforoMaximo) {
                            estadoVirtual = 'AGOTADA';
                        } else if (ev.fechaFin && new Date(ev.fechaFin + 'T' + (ev.horaFin || '23:59:59')) < new Date()) {
                            estadoVirtual = 'VENCIDA';
                        }

                        let badgeEstilo = "bg-blue-100 text-blue-800";
                        let badgeTexto = "ACTIVA";

                        if (estadoVirtual === 'VENCIDA') {
                            badgeEstilo = "bg-slate-200 text-slate-500"; badgeTexto = "VENCIDA";
                        } else if (estadoVirtual === 'AGOTADA') {
                            badgeEstilo = "bg-orange-100 text-orange-700"; badgeTexto = "AGOTADA";
                        } else if (estadoVirtual === 'INACTIVA') {
                            badgeEstilo = "bg-red-100 text-red-700"; badgeTexto = "CANCELADA";
                        }

                        return `
                        <div class="bg-white p-5 rounded-2xl border ${estadoVirtual === 'ACTIVA' ? 'border-blue-200' : 'border-slate-200 opacity-90'} shadow-sm relative group hover:shadow-md transition flex flex-col justify-between">
                            <div>
                                <div class="flex justify-between items-start mb-2">
                                    <div class="flex gap-2">
                                        <span class="bg-blue-50 text-blue-700 font-black text-[9px] px-2 py-1 rounded uppercase tracking-widest">${ev.tipoEvento}</span>
                                        <span class="${badgeEstilo} font-black text-[9px] px-2 py-1 rounded uppercase tracking-widest">${badgeTexto}</span>
                                    </div>
                                    <span class="text-emerald-600 font-black text-sm">$${ev.precio || 'Gratis'}</span>
                                </div>
                                <h4 class="font-black text-slate-800 text-lg uppercase tracking-tight leading-tight">${ev.nombre}</h4>
                                <p class="text-xs text-slate-500 font-bold mt-2">📍 Locación Asignada ID: ${ev.lugarId}</p>
                                <p class="text-[10px] text-slate-400 mt-1">📅 Inicio: ${ev.fechaInicio} ${ev.horaInicio ? '⏰ ' + ev.horaInicio : ''}</p>
                                <p class="text-[10px] text-slate-400">🏁 Fin: ${ev.fechaFin || 'N/A'}</p>
                            </div>
                            <div class="mt-4 pt-4 border-t border-slate-50 flex justify-between items-center">
                                <span class="text-[10px] font-bold text-slate-500 uppercase">Boletas: <span class="text-blue-600">${ev.aforoActual || 0}</span> / ${ev.aforoMaximo}</span>
                                ${estadoVirtual === 'ACTIVA' ? `<button onclick="verReservas(${ev.id})" class="text-[10px] font-bold text-blue-500 hover:text-blue-700 bg-blue-50 px-2 py-1 rounded uppercase tracking-widest mr-1">Reservas</button><button onclick="eliminarEvento(${ev.id})" class="text-[10px] font-bold text-red-500 hover:text-red-700 bg-red-50 px-2 py-1 rounded uppercase tracking-widest">Cancelar</button>` : `<span class="text-[9px] text-slate-400 font-bold tracking-widest uppercase">CERRADO</span>`}
                            </div>
                        </div>
                        `;
                    }).join('');
                }
            } catch (e) { grid.innerHTML = '<p class="text-red-500">Error al cargar.</p>'; }
        }

        document.getElementById('eventoForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = document.getElementById('btn-submit');
            btn.disabled = true; btn.innerText = "Publicando...";

            let horaVal = document.getElementById('hora').value;
            if (horaVal.length === 5) horaVal += ":00";

            const payload = {
                nombre: document.getElementById('nombre').value,
                tipoEvento: document.getElementById('tipo').value,
                aforoMaximo: parseInt(document.getElementById('aforo').value),
                fechaInicio: document.getElementById('fecha').value,
                fechaFin: document.getElementById('fecha-fin').value,
                horaInicio: horaVal,
                precio: parseFloat(document.getElementById('precio').value || 0),
                lugarId: parseInt(document.getElementById('lugarId').value)
            };

            try {
                const res = await fetch('https://budgetmap-api.onrender.com/api/eventos', {
                    method: 'POST',
                    headers: { 'Authorization': `Bearer ${token}`, 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });
                if (res.ok) {
                    alert("¡Evento agregado a la cartelera!");
                    document.getElementById('eventoForm').reset();
                    cargarEventos(0);
                } else { alert("Verifica los datos del evento."); }
            } catch (err) { alert("Error de red."); }
            finally { btn.disabled = false; btn.innerText = "Publicar Evento"; }
        });

        async function verReservas(eventoId) {
            document.getElementById('modal-reservas').classList.remove('hidden');
            const lista = document.getElementById('lista-reservas-modal');
            lista.innerHTML = '<p class="text-sm text-center">Cargando reservas...</p>';
            try {
                const res = await fetch(`https://budgetmap-api.onrender.com/api/mis-reservas/evento/${eventoId}`, { headers: { 'Authorization': `Bearer ${token}` } });
                if (res.ok) {
                    const reservas = await res.json();
                    if(reservas.length === 0) {
                        lista.innerHTML = '<p class="text-xs text-center text-slate-500">No hay reservas aún.</p>';
                    } else {
                        lista.innerHTML = reservas.map(r => `
                            <div class="border-b py-2 flex justify-between items-center">
                                <div>
                                    <p class="text-xs font-bold">${r.codigoReserva} <span class="bg-slate-200 text-slate-600 px-1 rounded">${r.estado}</span></p>
                                    <p class="text-[10px] text-slate-500">${r.numeroPersonas} personas - ${new Date(r.fechaReserva).toLocaleDateString()}</p>
                                </div>
                            </div>
                        `).join('');
                    }
                }
            } catch(e) { lista.innerHTML = '<p class="text-red-500 text-sm">Error de conexión</p>'; }
        }
        function cerrarModalReservas() { document.getElementById('modal-reservas').classList.add('hidden'); }

        async function eliminarEvento(id) {
            if (!confirm("¿Deseas cancelar y borrar este evento?")) return;
            const res = await fetch(`https://budgetmap-api.onrender.com/api/eventos/${id}`, { method: 'DELETE', headers: { 'Authorization': `Bearer ${token}` } });
            if (res.ok) cargarEventos(paginaActual);
        }

        function cerrarSesion() {
            localStorage.clear(); sessionStorage.clear(); window.location.href = '/login.html';
        }
    </script>
    <!-- Modal Reservas -->
    <div id="modal-reservas" class="fixed inset-0 bg-slate-900/50 backdrop-blur-sm z-50 hidden flex justify-center items-center p-4">
        <div class="bg-white w-full max-w-md rounded-2xl p-6 shadow-2xl">
            <div class="flex justify-between items-center mb-4">
                <h3 class="text-lg font-black text-slate-800 uppercase tracking-widest">Reservas del Evento</h3>
                <button onclick="cerrarModalReservas()" class="text-slate-400 hover:text-red-500 font-bold">&#10005;</button>
            </div>
            <div id="lista-reservas-modal" class="max-h-60 overflow-y-auto space-y-2"></div>
        </div>
    </div>
</body>

</html>
