<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin - Usuarios | BudgetMap</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        // 1. SEGURIDAD TOTAL: Validación inmediata
        const token = localStorage.getItem('jwt_token');
        const rol = localStorage.getItem('user_rol');
        if (!token || !rol || !rol.includes('ADMINISTRADOR')) {
            window.location.href = '/login.html?denied=true';
        }
    </script>
</head>

<body class="bg-emerald-50 min-h-screen text-slate-800 font-sans flex flex-col">

    <nav class="bg-white border-b border-emerald-100 p-4 sticky top-0 z-50 shadow-sm">
        <div class="w-full px-4 md:px-10 flex flex-col md:flex-row justify-between items-center gap-4 md:gap-0">
            <div class="flex items-center gap-2 md:gap-4 w-full md:w-auto justify-between md:justify-start">
                <div class="flex items-center gap-2 md:gap-4">
                    <div class="relative bg-white rounded-full w-12 h-12 md:w-16 md:h-16 shadow-md ring-1 ring-black/5 flex items-center justify-center z-0 hidden sm:flex">
                        <img src="/images/logo.png" alt="Logo BudgetMap" class="absolute w-16 h-16 md:w-24 md:h-24 max-w-none object-contain transform transition duration-500 hover:scale-110 top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 z-40 drop-shadow-xl" />
                    </div>
                    <span class="text-xl font-black tracking-widest drop-shadow-md mx-2"><a href="/index.html" class="hover:text-emerald-600 transition">BUDGETMAP</a></span>
                    <span class="bg-emerald-600 text-white px-3 py-1 rounded-full font-black text-[10px] uppercase tracking-tighter">ADMIN</span>
                    <h1 class="font-black tracking-widest text-emerald-900 hidden sm:block">CONTROL CENTER</h1>
                </div>
                <button onclick="cerrarSesion()" class="text-[10px] font-bold text-red-500 hover:text-red-700 md:hidden bg-red-50 px-3 py-1.5 rounded-lg border border-red-100">SALIR</button>
            </div>
            <div class="flex gap-4 md:gap-6 text-[10px] md:text-xs font-bold uppercase tracking-widest overflow-x-auto whitespace-nowrap w-full md:w-auto pb-2 md:pb-0 no-scrollbar" style="-ms-overflow-style:none; scrollbar-width:none;">
                <style> .no-scrollbar::-webkit-scrollbar { display: none; } </style>
                <a href="/admin/usuarios.html" class="text-emerald-600 border-b-2 border-emerald-600 pb-1">Usuarios</a>
                <a href="/admin/aprobaciones.html" class="text-slate-400 hover:text-emerald-600 transition">Aprobaciones</a>
                <a href="/admin/pqrs.html" class="text-slate-400 hover:text-emerald-600 transition">Soporte</a>
                <a href="/admin/estadisticas.html" class="text-slate-400 hover:text-emerald-600 transition">Estadísticas</a>
                <a href="/admin/base-datos.html" class="text-slate-400 hover:text-emerald-600 transition">Base de Datos</a>
            </div>
            <button onclick="cerrarSesion()" class="text-[12px] text-slate-400 font-bold hover:text-red-500 transition hidden md:block">SALIR</button>
        </div>
    </nav>

    <main class="flex-1 w-full px-6 md:px-10 w-full mt-8 px-6 pb-12">

        <div class="bg-white border border-emerald-100 rounded-3xl p-6 shadow-sm mb-6">
            <div
                class="flex flex-col md:flex-row justify-between items-start md:items-center gap-4 mb-6 border-b border-emerald-50 pb-6">
                <div>
                    <h2 class="text-3xl font-black text-slate-900 italic uppercase tracking-tighter">Directorio de
                        Usuarios</h2>
                    <p class="text-emerald-600/70 text-sm font-medium">Gestión integral, roles, planes y estado de
                        cuentas.</p>
                </div>
                <button onclick="abrirModalCrearUsuario()"
                    class="bg-emerald-600 text-white px-6 py-2.5 rounded-xl text-xs font-black uppercase hover:bg-emerald-700 shadow-md transition-all">
                    ➕ Crear Usuario
                </button>
            </div>

            <form id="form-filtros" class="grid grid-cols-1 md:grid-cols-4 gap-4"
                onsubmit="event.preventDefault(); cargarUsuarios(0);">
                <div class="flex flex-col gap-1">
                    <label class="text-[10px] font-bold text-slate-400 uppercase tracking-widest">Búsqueda
                        (Email/Nombre)</label>
                    <input type="text" id="filtro-texto" placeholder="Ej: Juan, admin@..."
                        class="bg-emerald-50/50 border border-emerald-100 rounded-xl px-4 py-2.5 text-sm focus:border-emerald-500 focus:bg-white outline-none transition-all">
                </div>
                <div class="flex flex-col gap-1">
                    <label class="text-[10px] font-bold text-slate-400 uppercase tracking-widest">Rol</label>
                    <select id="filtro-rol"
                        class="bg-emerald-50/50 border border-emerald-100 rounded-xl px-4 py-2.5 text-sm focus:border-emerald-500 outline-none">
                        <option value="">Todos los Roles</option>
                        <option value="EXPLORADOR">Explorador</option>
                        <option value="LOCAL_ALIADO">Local Aliado</option>
                        <option value="ANFITRION">Anfitrión</option>
                        <option value="MODERADOR">Moderador</option>
                        <option value="ADMINISTRADOR">Administrador</option>
                    </select>
                </div>
                <div class="flex flex-col gap-1">
                    <label class="text-[10px] font-bold text-slate-400 uppercase tracking-widest">Estado</label>
                    <select id="filtro-estado"
                        class="bg-emerald-50/50 border border-emerald-100 rounded-xl px-4 py-2.5 text-sm focus:border-emerald-500 outline-none">
                        <option value="">Todos</option>
                        <option value="true">Activos</option>
                        <option value="false">Suspendidos</option>
                    </select>
                </div>
                <div class="flex items-end gap-2">
                    <button type="button" onclick="limpiarFiltros()"
                        class="w-1/3 bg-slate-200 text-slate-700 px-4 py-2.5 rounded-xl text-xs font-black uppercase hover:bg-slate-300 transition-all"
                        title="Limpiar Filtros">
                        Limpiar
                    </button>
                    <button type="submit"
                        class="w-2/3 bg-emerald-600 text-white px-6 py-2.5 rounded-xl text-xs font-black uppercase hover:bg-emerald-700 shadow-md transition-all">
                        Filtrar
                    </button>
                </div>
            </form>
        </div>

        <div class="bg-white border border-emerald-100 rounded-3xl overflow-hidden shadow-sm">
            <div class="overflow-x-auto">
                <table class="w-full text-left border-collapse">
                    <thead
                        class="bg-emerald-50/50 text-[10px] uppercase tracking-[0.2em] font-black text-emerald-800/60 border-b border-emerald-100">
                        <tr>
                            <th class="p-5">Usuario / Contacto</th>
                            <th class="p-5">Rol / Plan</th>
                            <th class="p-5">Métricas</th>
                            <th class="p-5 text-center">Estado</th>
                            <th class="p-5 text-right">Gestión</th>
                        </tr>
                    </thead>
                    <tbody id="tabla-usuarios" class="text-sm divide-y divide-emerald-50">
                    </tbody>
                </table>
            </div>

            <div class="p-4 border-t border-emerald-100 bg-emerald-50/30 flex justify-between items-center">
                <p class="text-xs text-slate-500 font-bold" id="info-paginacion">Mostrando página 1 de 1</p>
                <div class="flex gap-2">
                    <button id="btn-prev" onclick="cambiarPagina(-1)"
                        class="px-4 py-2 rounded-lg border border-emerald-200 text-emerald-700 text-xs font-bold hover:bg-emerald-100 disabled:opacity-50 transition-all">Anterior</button>
                    <button id="btn-next" onclick="cambiarPagina(1)"
                        class="px-4 py-2 rounded-lg bg-emerald-600 text-white text-xs font-bold hover:bg-emerald-700 disabled:opacity-50 shadow-sm transition-all">Siguiente</button>
                </div>
            </div>
        </div>
    </main>

    <!-- Modal Crear Usuario -->
    <div id="modalCrearUsuario" class="hidden fixed inset-0 bg-black/50 flex items-center justify-center z-50 p-4">
        <div class="bg-white rounded-3xl p-6 shadow-2xl max-w-md w-full">
            <h3 class="text-2xl font-black text-slate-900 uppercase tracking-tighter mb-6">Crear Nuevo Usuario</h3>

            <form id="formCrearUsuario" onsubmit="guardarNuevoUsuario(event)" class="flex flex-col gap-4">
                <div>
                    <label class="text-[10px] font-bold text-slate-400 uppercase tracking-widest">Nombre</label>
                    <input type="text" id="nuevoNombre" required
                        class="w-full mt-1 bg-slate-50 border border-slate-200 rounded-xl p-3 text-sm outline-none focus:border-emerald-500">
                </div>

                <div>
                    <label class="text-[10px] font-bold text-slate-400 uppercase tracking-widest">Apellido</label>
                    <input type="text" id="nuevoApellido" required
                        class="w-full mt-1 bg-slate-50 border border-slate-200 rounded-xl p-3 text-sm outline-none focus:border-emerald-500">
                </div>

                <div>
                    <label class="text-[10px] font-bold text-slate-400 uppercase tracking-widest">Email</label>
                    <input type="email" id="nuevoEmail" required
                        class="w-full mt-1 bg-slate-50 border border-slate-200 rounded-xl p-3 text-sm outline-none focus:border-emerald-500">
                </div>

                <div>
                    <label class="text-[10px] font-bold text-slate-400 uppercase tracking-widest">Contraseña</label>
                    <input type="password" id="nuevoPassword" required
                        class="w-full mt-1 bg-slate-50 border border-slate-200 rounded-xl p-3 text-sm outline-none focus:border-emerald-500">
                </div>

                <div>
                    <label class="text-[10px] font-bold text-slate-400 uppercase tracking-widest">Rol</label>
                    <select id="nuevoRol" required
                        class="w-full mt-1 bg-slate-50 border border-slate-200 rounded-xl p-3 text-sm outline-none focus:border-emerald-500">
                        <option value="">Selecciona un rol</option>
                        <option value="EXPLORADOR">Explorador</option>
                        <option value="LOCAL_ALIADO">Local Aliado</option>
                        <option value="ANFITRION">Anfitrión</option>
                        <option value="MODERADOR">Moderador</option>
                        <option value="ADMINISTRADOR">Administrador</option>
                    </select>
                </div>

                <div class="flex gap-3 mt-4">
                    <button type="button" onclick="cerrarModalCrearUsuario()"
                        class="flex-1 bg-slate-200 text-slate-700 px-4 py-3 rounded-xl text-xs font-black uppercase hover:bg-slate-300 transition">
                        Cancelar
                    </button>
                    <button type="submit"
                        class="flex-1 bg-emerald-600 text-white px-4 py-3 rounded-xl text-xs font-black uppercase hover:bg-emerald-700 transition">
                        Crear
                    </button>
                </div>
            </form>
        </div>
    </div>

    <script>
        // Variables de paginación
        let paginaActual = 0;
        const size = 10;
        let paginasTotales = 0;
        let usuarioActualId = null;

        document.addEventListener("DOMContentLoaded", () => {
            obtenerUsuarioActual();
            cargarUsuarios(0);
        });

        async function obtenerUsuarioActual() {
            try {
                const res = await fetch('https://budgetmap-api.onrender.com/api/perfil', {
                    headers: { 'Authorization': `Bearer ${token}` }
                });
                if (res.ok) {
                    const user = await res.json();
                    usuarioActualId = user.id;
                }
            } catch (e) {
                console.error("Error obteniendo usuario actual");
            }
        }

        function cerrarSesion() {
            localStorage.clear();
            window.location.href = '/login.html';
        }

        function abrirModalCrearUsuario() {
            document.getElementById('modalCrearUsuario').classList.remove('hidden');
        }

        function cerrarModalCrearUsuario() {
            document.getElementById('modalCrearUsuario').classList.add('hidden');
            document.getElementById('formCrearUsuario').reset();
        }

        async function guardarNuevoUsuario(event) {
            event.preventDefault();

            const payload = {
                nombre: document.getElementById('nuevoNombre').value,
                apellido: document.getElementById('nuevoApellido').value,
                email: document.getElementById('nuevoEmail').value,
                password: document.getElementById('nuevoPassword').value,
                rol: document.getElementById('nuevoRol').value
            };

            try {
                const res = await fetch('https://budgetmap-api.onrender.com/api/usuarios/crear', {
                    method: 'POST',
                    headers: {
                        'Authorization': `Bearer ${token}`,
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(payload)
                });

                if (res.ok) {
                    alert('Usuario creado exitosamente');
                    cerrarModalCrearUsuario();
                    cargarUsuarios(0);
                } else {
                    const error = await res.text();
                    alert('Error: ' + error);
                }
            } catch (e) {
                alert('Error de comunicación: ' + e.message);
            }
        }

        async function cargarUsuarios(pagina = 0) {
            paginaActual = pagina;
            const tbody = document.getElementById('tabla-usuarios');

            // Recoger filtros
            const texto = document.getElementById('filtro-texto').value;
            const rolFiltro = document.getElementById('filtro-rol').value;
            const estado = document.getElementById('filtro-estado').value;

            tbody.innerHTML = '<tr><td colspan="5" class="p-12 text-center text-emerald-600/50 italic animate-pulse font-bold uppercase tracking-widest text-xs">Sincronizando con Base de Datos...</td></tr>';

            try {
                const params = new URLSearchParams({
                    page: paginaActual,
                    size: size
                });
                if (texto) params.append('criterio', texto);
                if (rolFiltro) params.append('rol', rolFiltro);
                if (estado) params.append('activo', estado);

                const response = await fetch(`https://budgetmap-api.onrender.com/api/usuarios/paginado?${params}`, {
                    headers: { 'Authorization': `Bearer ${token}` }
                });

                if (response.ok) {
                    // Spring Boot devuelve un objeto "Page" { content: [], totalPages: X, number: Y }
                    const data = await response.json();

                    // Si tu API no está paginada aún y devuelve un Array directo, 
                    // usa esto como fallback: const usuarios = Array.isArray(data) ? data : data.content;
                    const usuarios = data.content || data;
                    paginasTotales = data.totalPages || 1;

                    tbody.innerHTML = '';

                    if (usuarios.length === 0) {
                        tbody.innerHTML = '<tr><td colspan="5" class="p-12 text-center text-slate-400 italic font-medium">No se encontraron registros.</td></tr>';
                        actualizarControlesPaginacion(0, 0);
                        return;
                    }

                    usuarios.forEach(user => {
                        const btnEstado = user.activo
                            ? `<button onclick="cambiarEstado(${user.id}, false)" class="text-[10px] font-black text-red-500 hover:bg-red-50 transition-all uppercase tracking-widest border border-red-100 px-3 py-1.5 rounded-lg">Suspender</button>`
                            : `<button onclick="cambiarEstado(${user.id}, true)" class="text-[10px] font-black text-emerald-600 hover:bg-emerald-50 transition-all uppercase tracking-widest border border-emerald-200 px-3 py-1.5 rounded-lg">Activar</button>`;

                        const estadoTexto = user.activo
                            ? `<span class="inline-flex items-center gap-1.5 bg-emerald-50 text-emerald-700 px-2.5 py-1 rounded-full font-bold text-[9px] uppercase tracking-widest"><span class="w-1.5 h-1.5 bg-emerald-500 rounded-full animate-pulse"></span> Activo</span>`
                            : `<span class="inline-flex items-center gap-1.5 bg-red-50 text-red-600 px-2.5 py-1 rounded-full font-bold text-[9px] uppercase tracking-widest"><span class="w-1.5 h-1.5 bg-red-500 rounded-full"></span> Suspendido</span>`;

                        // 4. NUEVAS FUNCIONALIDADES: Mostrar Puntos y Plan
                        const planBadge = user.planId ? `<span class="bg-amber-100 text-amber-700 px-2 py-0.5 rounded text-[9px] ml-2">PRO</span>` : '';

                        tbody.innerHTML += `
                        <tr class="hover:bg-emerald-50/30 transition-all group">
                            <td class="p-5">
                                <p class="font-black text-slate-900 uppercase tracking-tight">${user.nombre || 'N/A'} ${user.apellido || ''}</p>
                                <p class="text-xs text-slate-500 font-medium">${user.email}</p>
                                <p class="text-[10px] text-emerald-600 mt-1">📞 ${user.telefono || 'Sin teléfono'}</p>
                            </td>
                            <td class="p-5">
                                <div class="flex items-center">
                                    <span class="bg-slate-100 text-slate-700 px-2.5 py-1 rounded-md text-[10px] font-black uppercase border border-slate-200">${user.rol}</span>
                                    ${planBadge}
                                </div>
                            </td>
                            <td class="p-5">
                                <div class="text-[10px] font-bold text-slate-500">
                                    <p>⭐ Puntos: <span class="text-emerald-600">${user.puntosAcumulados || 0}</span></p>
                                </div>
                            </td>
                            <td class="p-5 text-center">${estadoTexto}</td>
                            <td class="p-5 text-right">
                                ${btnEstado}
                            </td>
                        </tr>
                    `;
                    });

                    actualizarControlesPaginacion(data.number || 0, paginasTotales);
                } else {
                    if (response.status === 401 || response.status === 403) cerrarSesion();
                    tbody.innerHTML = '<tr><td colspan="5" class="p-12 text-center text-red-500 font-bold">Error 403: Permisos insuficientes.</td></tr>';
                }
            } catch (e) {
                tbody.innerHTML = '<tr><td colspan="5" class="p-12 text-center text-red-500 font-bold">Error crítico de conexión.</td></tr>';
            }
        }

        function limpiarFiltros() {
            document.getElementById('filtro-texto').value = '';
            document.getElementById('filtro-rol').value = '';
            document.getElementById('filtro-estado').value = '';
            cargarUsuarios(0);
        }

        function cambiarPagina(delta) {
            const nuevaPagina = paginaActual + delta;
            if (nuevaPagina >= 0 && nuevaPagina < paginasTotales) {
                cargarUsuarios(nuevaPagina);
            }
        }

        function actualizarControlesPaginacion(actual, total) {
            document.getElementById('info-paginacion').innerText = `Mostrando página ${total === 0 ? 0 : actual + 1} de ${total}`;
            document.getElementById('btn-prev').disabled = actual === 0;
            document.getElementById('btn-next').disabled = actual >= total - 1 || total === 0;
        }

        async function cambiarEstado(id, activar) {
            if (id === usuarioActualId) {
                alert('No puedes cambiar tu propio estado. Contacta a otro administrador.');
                return;
            }

            if (!confirm(`¿Confirma que desea ${activar ? 'reactivar' : 'suspender'} esta cuenta?`)) return;

            try {
                const response = await fetch(`https://budgetmap-api.onrender.com/api/usuarios/${id}/estado?activo=${activar}`, {
                    method: 'PUT',
                    headers: {
                        'Authorization': `Bearer ${token}`,
                        'Content-Type': 'application/json'
                    }
                });

                if (response.ok) {
                    cargarUsuarios(paginaActual);
                } else {
                    const error = await response.text();
                    alert("Error: " + error);
                }
            } catch (e) {
                alert("Error de comunicación con el servidor.");
            }
        }
    </script>
</body>

</html>
