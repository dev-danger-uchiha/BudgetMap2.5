version: '3.8'
services:
  db:
    image: mariadb:10.11
    container_name: budgetmap-db
    restart: always
    environment:
      MYSQL_DATABASE: budgetmap
      MYSQL_ROOT_PASSWORD: tu_password_seguro
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql

  api:
    build: .
    container_name: budgetmap-api
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:mariadb://db:3306/budgetmap
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: tu_password_seguro
    depends_on:
      - db

volumes:
  db_data: